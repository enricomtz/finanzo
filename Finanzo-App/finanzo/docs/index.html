<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F6">
<!-- iPhone: als App auf dem Home-Bildschirm -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Finanzo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233355FF'/%3E%3Crect x='14' y='17' width='36' height='7' rx='3.5' fill='white'/%3E%3Crect x='14' y='29' width='26' height='7' rx='3.5' fill='white'/%3E%3Crect x='14' y='41' width='15' height='7' rx='3.5' fill='white'/%3E%3Ccircle cx='42' cy='44.5' r='5' fill='%2364E3B4'/%3E%3C/svg%3E">
<style>
/* Farben: hell (Standard) */
:root{
  --bg:#EEF1F6; --card:#FFFFFF; --soft:#F2F4F8; --ink:#17203A; --ink-2:#5B6680; --ink-3:#8F98AD; --line:#E3E7EF;
  --accent:#3355FF; --on-accent:#FFFFFF; --accent-soft:#E8EDFF;
  --green:#12895F; --left:#BDEBD5; --red:#D23F36; --warn:#9A6200; --warn-soft:#FFF2D2; --scrim:rgba(12,18,38,.45);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
/* Farben: dunkel – automatisch (System) oder fest eingestellt */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1220; --card:#161D31; --soft:#1D2641; --ink:#E9EEF8; --ink-2:#A7B2C9; --ink-3:#6F7A93; --line:#263049;
    --accent:#7088FF; --on-accent:#0D1220; --accent-soft:#222C55;
    --green:#41CC97; --left:#1F5A45; --red:#FF7268; --warn:#F2B740; --warn-soft:#33290F; --scrim:rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1220; --card:#161D31; --soft:#1D2641; --ink:#E9EEF8; --ink-2:#A7B2C9; --ink-3:#6F7A93; --line:#263049;
  --accent:#7088FF; --on-accent:#0D1220; --accent-soft:#222C55;
  --green:#41CC97; --left:#1F5A45; --red:#FF7268; --warn:#F2B740; --warn-soft:#33290F; --scrim:rgba(0,0,0,.6);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
svg{display:block}

/* Aufbau */
main{padding:calc(env(safe-area-inset-top) + 4px) 16px calc(40px + env(safe-area-inset-bottom))}
.wrap{max-width:600px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;height:60px}
.logo{display:flex;align-items:center;gap:10px;font-weight:760;font-size:19px;letter-spacing:-.015em}
.logo-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--card)}
.icon-btn svg{pointer-events:none}
@media (min-width:760px){ main{padding:28px 32px 56px} }

/* Übersicht mit Grafik */
.summary{background:var(--card);border-radius:26px;padding:24px 20px 18px}
.donut{position:relative;width:236px;height:236px;margin:0 auto}
.donut svg{width:236px;height:236px}
.donut-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.donut-mid span{font-size:15px;font-weight:600;color:var(--ink-2)}
.donut-mid strong{font-size:30px;font-weight:790;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1.15;max-width:170px}
.donut-mid strong.long{font-size:23px}
.donut-mid strong.minus{color:var(--red)}
.calc{margin:20px 0 0;padding:0;list-style:none}
.calc li{display:flex;align-items:center;gap:10px;padding:9px 2px;font-variant-numeric:tabular-nums}
.calc li > span:nth-child(2){flex:1;color:var(--ink-2)}
.calc li:not(.total){padding:0}
.calc b{font-weight:720;white-space:nowrap}
.calc .total{border-top:1.5px solid var(--line);margin-top:4px;padding-top:12px}
.calc .total span:nth-child(2){color:var(--ink);font-weight:720}
.calc .total b{font-size:19px}
.tgl{display:flex;align-items:center;gap:10px;width:calc(100% + 16px);margin:0 -8px;padding:10px;border-radius:12px;text-align:left;font-variant-numeric:tabular-nums}
.tgl:hover{background:var(--soft)}
.tgl-name{flex:1;color:var(--ink-2)}
.tgl[aria-pressed="false"]{opacity:.45}
.tgl[aria-pressed="false"] .tgl-name,.tgl[aria-pressed="false"] b{text-decoration:line-through}
.tgl[aria-pressed="false"] .key{background:transparent!important;box-shadow:inset 0 0 0 2px var(--ink-3)}
.plus{color:var(--green)} .minus{color:var(--red)}
.key{width:12px;height:12px;border-radius:4px;flex:none}
.hint-line{margin:12px 2px 0;font-size:14.5px;color:var(--ink-2);text-align:center}

/* Fällige Erinnerung oben */
.due{width:100%;display:flex;gap:12px;align-items:flex-start;background:var(--warn-soft);border-radius:18px;padding:14px 16px;margin-top:12px;text-align:left}
.due svg{color:var(--warn);flex:none;margin-top:1px}
.due-text{display:block;min-width:0}
.due.late{background:color-mix(in srgb,var(--red) 14%,var(--card))}
.due.late svg{color:var(--red)}
.due small{display:block;color:var(--ink-2);font-size:14.5px;overflow-wrap:anywhere}

/* Listen */
.list-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:28px 6px 10px;font-size:17px;font-weight:740}
.list-title small{font-size:14px;font-weight:600;color:var(--ink-2)}
.list{list-style:none;margin:0;padding:0;background:var(--card);border-radius:22px;overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.item{width:100%;display:flex;align-items:center;gap:14px;padding:15px 18px;text-align:left;min-height:68px}
.item:hover{background:var(--soft)}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.bell-ic{width:32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;margin-left:-9px}
.bell-ic svg{width:18px;height:18px}
.item-main{flex:1;min-width:0}
.item-name{font-weight:680;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-sub{font-size:14px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-sub.soon{color:var(--warn);font-weight:650}
.item-sub.save{color:var(--green);font-weight:600}

/* Countdown bis zum Zahltag */
.countdown{width:100%;display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;padding:14px 16px;margin-bottom:12px;text-align:left}
.countdown:hover{background:color-mix(in srgb,var(--card) 94%,var(--ink))}
.cd-tile{width:60px;height:60px;border-radius:17px;background:var(--accent-soft);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.cd-tile strong{font-size:27px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cd-tile strong.word{font-size:15px}
.cd-tile span{font-size:12.5px;font-weight:700;margin-top:4px}
.cd-tile.today{background:color-mix(in srgb,var(--green) 16%,var(--card));color:var(--green)}
.cd-main{flex:1;min-width:0;display:block}
.cd-title{display:block;font-weight:740;font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd-sub{display:block;font-size:14px;color:var(--ink-2)}
.cd-bar{display:block;height:6px;border-radius:99px;background:var(--soft);margin-top:9px;overflow:hidden}
.cd-bar span{display:block;height:100%;background:var(--green);border-radius:99px}

/* PIN */
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom));overflow:auto}
.lock-in{width:100%;max-width:330px;text-align:center}
.lock .logo-mark{width:58px;height:58px;border-radius:18px;margin:0 auto 14px;display:grid}
.lock .logo-mark svg{width:32px;height:32px}
.lock h2{margin:0 0 18px;font-size:22px;letter-spacing:-.015em}
.lock-text{color:var(--ink-2);margin:0 0 18px}
.lock-link{margin-top:20px;color:var(--accent);font-weight:650;padding:10px}
.dots{display:flex;justify-content:center;gap:18px;margin:4px 0 8px}
.dots span{width:15px;height:15px;border-radius:50%;border:2px solid var(--ink-3);transition:background .1s}
.dots span.on{background:var(--ink);border-color:var(--ink)}
.dots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.pin-msg{min-height:22px;margin:0 0 14px;color:var(--red);font-weight:650;font-size:14.5px}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 26px;justify-content:center}
.pad button{width:72px;height:72px;border-radius:50%;background:var(--card);font-size:28px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.pad button:active{background:var(--accent-soft)}
.pad button[data-k="del"]{background:transparent;color:var(--ink-2)}
.pin-sheet{text-align:center;padding-bottom:6px}
.pin-sheet .pad button{background:var(--soft)}
.pin-sheet .pad button[data-k="del"]{background:transparent}
.item-amt{text-align:right;font-weight:740;font-variant-numeric:tabular-nums;white-space:nowrap}
.item-amt small{display:block;font-size:13px;font-weight:500;color:var(--ink-3)}
.item-amt.plus{color:var(--green)}
.item.past{opacity:.5}
.item-sub.late{color:var(--red);font-weight:650}
.pay-row{display:flex;align-items:center}
.pay-row .item{padding-left:6px}
.check{width:44px;height:44px;margin-left:8px;flex:none;display:grid;place-items:center;border-radius:12px}
.ring{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink-3);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.ring svg{width:15px;height:15px}
.check:hover .ring{border-color:var(--green)}
.check[aria-pressed="true"] .ring{background:var(--green);border-color:var(--green);color:#fff}
.pay-row.paid .item{opacity:.5}
.pay-row.paid .item-name{text-decoration:line-through}
.add-row{color:var(--accent);font-weight:700;min-height:58px}
.add-row .plus-ic{width:30px;height:30px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;flex:none;margin-left:-8px}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:15px;font-weight:700;font-size:16px;min-height:50px}
.btn-main{background:var(--accent);color:var(--on-accent)}
.btn-main:hover{filter:brightness(1.06)}
.btn-soft{background:var(--soft);color:var(--ink)}
.btn-red{background:color-mix(in srgb,var(--red) 11%,transparent);color:var(--red)}
.btn-full{width:100%}
.btns{display:flex;gap:10px;margin-top:10px}
.btns .btn{flex:1}

/* Fenster */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;
  padding:8px 20px calc(22px + env(safe-area-inset-bottom));animation:up .24s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet-top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 2px;position:sticky;top:-8px;background:var(--card);z-index:2}
.sheet-top h2{margin:0;font-size:21px;letter-spacing:-.015em}
.sheet p.text{margin:6px 0 14px;color:var(--ink-2)}
@media (min-width:760px){
  .scrim{align-items:center;padding:24px}
  .sheet{border-radius:26px;padding:12px 26px 26px;animation:pop .2s cubic-bezier(.2,.8,.2,1)}
  .sheet-top{top:-12px}
}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
@keyframes pop{from{transform:scale(.97);opacity:0}}

/* Formular */
.field{display:block;margin:16px 0}
.label{display:block;font-size:14.5px;font-weight:650;color:var(--ink-2);margin-bottom:7px}
.label i{font-style:normal;font-weight:500;color:var(--ink-3)}
.input{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);min-height:50px;appearance:none;-webkit-appearance:none}
.input:focus{outline:none;border-color:var(--accent);background:var(--card)}
textarea.input{min-height:90px;resize:vertical;line-height:1.4}
select.input,select.input:focus{background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 21px) 50%,calc(100% - 15px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:44px;cursor:pointer}
.money{position:relative;display:block}
.money .input{font-size:30px;font-weight:760;letter-spacing:-.02em;padding:10px 70px 10px 14px;font-variant-numeric:tabular-nums}
.money span{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:22px;font-weight:700;color:var(--ink-3);pointer-events:none;max-width:60px;overflow:hidden;white-space:nowrap}
.date-btn{position:relative;display:block}
.date-btn .date-ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--accent);pointer-events:none;z-index:1}
.date-btn .date-ic svg{width:20px;height:20px}
.date-btn .input{padding-left:46px;font-weight:680;color:var(--accent);background:var(--accent-soft);border-color:transparent;cursor:pointer}
.hint{display:block;font-size:13.5px;color:var(--ink-3);margin-top:8px}
.err{color:var(--red);font-size:14.5px;font-weight:650;margin:8px 0}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{padding:11px 8px;border-radius:13px;border:1.5px solid var(--line);font-weight:650;font-size:15px}
.choice button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.quick button{padding:7px 13px;border-radius:999px;background:var(--soft);font-size:14.5px;font-weight:650;color:var(--ink-2)}
.quick button:hover{color:var(--ink)}

/* Einstellungen */
.set{padding:16px 0;border-top:1px solid var(--line)}
.sheet-top + .set{border-top:0}
.set h3{margin:0 0 10px;font-size:16px}
.set p{margin:-4px 0 12px;color:var(--ink-2);font-size:14.5px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{padding:10px 6px;border-radius:11px;font-weight:700;font-size:15px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(10,20,50,.16)}
.pick{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--soft);text-align:left}
.pick span:first-child{flex:1;font-weight:680}
.pick small{color:var(--ink-2);font-weight:600;font-size:14.5px}
.pick svg{color:var(--ink-3)}

/* Währungsliste */
.cur-search{position:sticky;top:44px;background:var(--card);padding:8px 0 10px;z-index:1}
.cur-group{font-size:13.5px;font-weight:700;color:var(--ink-3);margin:14px 4px 6px}
.cur-list{list-style:none;margin:0;padding:0}
.cur{width:100%;display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;text-align:left}
.cur:hover{background:var(--soft)}
.cur-name{flex:1;min-width:0}
.cur-name small{display:block;color:var(--ink-3);font-size:13px;font-weight:600}
.cur-sym{font-weight:700;color:var(--ink-2);white-space:nowrap}
.cur[aria-selected="true"]{background:var(--accent-soft)}
.cur[aria-selected="true"] .cur-sym{color:var(--accent)}
.cur-none{color:var(--ink-2);text-align:center;padding:18px 0}

/* Meldung */
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:60;
  width:max-content;max-width:calc(100vw - 32px);background:var(--ink);color:var(--card);border-radius:14px;padding:12px 18px;font-weight:650;
  transition:transform .2s,opacity .2s;box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}
.toast.show{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="wrap">
    <header class="top">
      <div class="logo"><span class="logo-mark" data-icon="mark"></span>Finanzo</div>
      <button class="icon-btn" data-settings aria-label="Einstellungen"><span data-icon="gear"></span></button>
    </header>
    <section id="view"></section>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ===== Symbole ===== */
const ICON={
  mark:'<svg width="18" height="18" viewBox="0 0 64 64"><rect x="10" y="12" width="44" height="9" rx="4.5" fill="#fff"/><rect x="10" y="28" width="32" height="9" rx="4.5" fill="#fff"/><rect x="10" y="44" width="18" height="9" rx="4.5" fill="#fff"/><circle cx="45" cy="48.5" r="6.5" fill="#64E3B4"/></svg>',

  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  right:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  check:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  back:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-6 6M11 9l6 6"/></svg>',
  bell:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>',
};

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

const pad=n=>String(n).padStart(2,'0');
const toISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromISO=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1);};
const isISO=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'');
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
function addMonths(d,n){const f=new Date(d.getFullYear(),d.getMonth()+n,1);const last=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();return new Date(f.getFullYear(),f.getMonth(),Math.min(d.getDate(),last));}
const daysBetween=(a,b)=>Math.round((b-a)/86400000);
const shortDate=d=>d.toLocaleDateString('de-DE',{day:'numeric',month:'short'});

function parseMoney(s){let t=String(s||'').replace(/\s/g,'').replace(/[^\d.,-]/g,'');t=t.replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.');const n=Number(t);return isFinite(n)&&t!==''?round2(n):NaN;}
const moneyInput=n=>n?n.toFixed(2).replace('.',','):'';

const KEY='finanzo-v1';

const store={get(k){try{return localStorage.getItem(k);}catch(e){return k in mem?mem[k]:null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){mem[k]=v;}}};
const RHYTHM={
  monthly:{label:'Monatlich',months:1},
  quarterly:{label:'Alle 3 Monate',months:3},
  halfyearly:{label:'Alle 6 Monate',months:6},
  yearly:{label:'Jährlich',months:12},
};
const NOTIFY_HOUR=9;   // Uhrzeit der Nachricht
// Erinnerungstag: X Tage vor dem Datum, aber nicht in der Vergangenheit und nicht nach dem Datum
function remindDefault(dateISO,daysBefore,notPast=true){
  const d=fromISO(dateISO); let c=addDays(d,-daysBefore);
  if(notPast){ const t=today(); if(c<t) c=t<=d?t:d; }
  return toISO(c);
}
const empty=()=>({version:7,incomes:[],contracts:[],bills:[],reminders:[],settings:{theme:'system',currency:'EUR'}});
function freeColor(list){const used=list.map(c=>c.color);for(let i=0;i<COLORS.length;i++)if(!used.includes(i))return i;return list.length%COLORS.length;}
function clean(raw){
  const s=empty();
  const st=(raw&&raw.settings)||{};
  s.settings={
    theme:['system','light','dark'].includes(st.theme)?st.theme:'system',
    currency:CURRENCIES.includes(st.currency)?st.currency:'EUR',
    pin:typeof st.pin==='string'&&/^[0-9a-f]{16}$/.test(st.pin)?st.pin:'',
  };
  for(const i of (raw&&Array.isArray(raw.incomes)?raw.incomes:[])){
    if(!i||!i.name||!(i.amount>0)) continue;
    s.incomes.push({id:i.id||uid(),name:String(i.name).slice(0,40),amount:round2(Number(i.amount)),
      payday:Number.isInteger(i.payday)&&i.payday>=1&&i.payday<=31?i.payday:0});
  }
  for(const b of (raw&&Array.isArray(raw.bills)?raw.bills:[])){
    if(!b||!b.name||!isISO(b.due)||!(b.amount>0)) continue;
    s.bills.push({id:b.id||uid(),name:String(b.name).slice(0,60),amount:round2(Number(b.amount)),due:b.due,
      remindOn:isISO(b.remindOn)?b.remindOn:remindDefault(b.due,3,false),note:String(b.note||'').slice(0,300),
      paid:!!b.paid,paidOn:isISO(b.paidOn)?b.paidOn:'',notified:isISO(b.notified)?b.notified:''});
  }
  for(const r of (raw&&Array.isArray(raw.reminders)?raw.reminders:[])){
    if(!r||!r.title||!isISO(r.date)) continue;
    s.reminders.push({id:r.id||uid(),title:String(r.title).slice(0,60),date:r.date,note:String(r.note||'').slice(0,300),
      remindOn:isISO(r.remindOn)?r.remindOn:remindDefault(r.date,[0,1,3,7].includes(r.before)?r.before:3,false),
      notified:isISO(r.notified)?r.notified:''});
  }
  for(const c of (raw&&Array.isArray(raw.contracts)?raw.contracts:[])){
    if(!c||!c.name||!isISO(c.nextDate)||!(c.amount>0)||c.status==='cancelled') continue;
    // Alte Kündigungs-Daten werden zu Erinnerungen
    let cancelBy=isISO(c.cancelBy)?c.cancelBy:'';
    if(!cancelBy&&isISO(c.endDate)&&c.noticeValue){
      const e=fromISO(c.endDate),n=Number(c.noticeValue);
      cancelBy=toISO(c.noticeUnit==='weeks'?addDays(e,-7*n):addMonths(e,-n));
    }
    if(cancelBy) s.reminders.push({id:uid(),title:`${String(c.name).slice(0,40)} kündigen`,date:cancelBy,note:'',remindOn:remindDefault(cancelBy,7,false),notified:''});
    const color=Number.isInteger(c.color)&&c.color>=0&&c.color<COLORS.length?c.color:freeColor(s.contracts);
    s.contracts.push({id:c.id||uid(),name:String(c.name).slice(0,40),amount:round2(Number(c.amount)),
      rhythm:RHYTHM[c.rhythm]?c.rhythm:(RHYTHM[c.cycle]?c.cycle:'monthly'),nextDate:c.nextDate,color});
  }
  return s;
}
function load(){try{const r=store.get(KEY);return r?clean(JSON.parse(r)):empty();}catch(e){return empty();}}
const save=()=>store.set(KEY,JSON.stringify(data));

/* ===== Aussehen (Hell / Dunkel / System) ===== */
function applyTheme(){

  if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme');

}
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme); }catch(e){}

/* ===== Rechnen: Verträge ===== */
const payDate=(c,k)=>addMonths(fromISO(c.nextDate),k*RHYTHM[c.rhythm].months);
// Nächste Abbuchung ab heute (auch wenn das eingetragene Datum schon vorbei ist)
function nextPay(c){
  const a=fromISO(c.nextDate), t=today(), step=RHYTHM[c.rhythm].months;
  let k=Math.floor(((t.getFullYear()-a.getFullYear())*12+(t.getMonth()-a.getMonth()))/step)-1;
  for(let i=0;i<30;i++,k++){const d=payDate(c,k);if(d>=t)return d;}
  return null;
}
const perMonth=c=>c.amount/RHYTHM[c.rhythm].months;

/* ===== Rechnen: Erinnerungen ===== */
const remindDay=r=>fromISO(r.remindOn);                                         // an diesem Tag wird erinnert
const isDue=r=>{const t=today();return t>=remindDay(r)&&t<=fromISO(r.date);};   // gerade fällig?
const isPast=r=>fromISO(r.date)<today();
function whenText(r,from){                                                     // „In 3 Tagen (4. Nov.)“
  const n=daysBetween(from||today(),fromISO(r.date)), d=shortDate(fromISO(r.date));
  if(n<0) return `Vorbei (${d})`;
  if(n===0) return `Heute (${d})`;
  if(n===1) return `Morgen (${d})`;
  return `In ${n} Tagen (${d})`;
}
const notifyAt=r=>{const d=remindDay(r);return new Date(d.getFullYear(),d.getMonth(),d.getDate(),NOTIFY_HOUR,0,0);};

/* ===== Rechnen: Countdown bis zum Zahltag ===== */
function paydayIn(y,m,day){const f=new Date(y,m,1);const last=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();return new Date(f.getFullYear(),f.getMonth(),Math.min(day,last));}
function nextPayday(i){const t=today();let d=paydayIn(t.getFullYear(),t.getMonth(),i.payday);if(d<t)d=paydayIn(t.getFullYear(),t.getMonth()+1,i.payday);return d;}
function countdown(){                                   // nächste Einnahme mit Zahltag
  const t=today();
  const list=data.incomes.filter(i=>i.payday).map(i=>{const next=nextPayday(i);return {i,next,n:daysBetween(t,next)};}).sort((a,b)=>a.n-b.n||b.i.amount-a.i.amount);
  if(!list.length) return null;
  const c=list[0], prev=paydayIn(c.next.getFullYear(),c.next.getMonth()-1,c.i.payday);
  c.progress=c.n===0?1:Math.min(1,Math.max(0,daysBetween(prev,t)/Math.max(1,daysBetween(prev,c.next))));
  return c;
}

/* ===== Rechnen: Noch zu zahlen ===== */
function billText(b,from){                                                     // „Bis 5. Nov. (noch 3 Tage)“
  const n=daysBetween(from||today(),fromISO(b.due)), d=shortDate(fromISO(b.due));
  if(n<0) return `Überfällig seit ${-n} ${-n===1?'Tag':'Tagen'} (${d})`;
  if(n===0) return `Heute fällig (${d})`;
  if(n===1) return `Morgen fällig (${d})`;
  return `Bis ${d} (noch ${n} Tage)`;
}
const lc=t=>t.charAt(0).toLowerCase()+t.slice(1);
const billDue=b=>!b.paid&&today()>=remindDay(b);       // Hinweis zeigen, bis es bezahlt ist
const billLate=b=>!b.paid&&fromISO(b.due)<today();
// Alles, woran die App erinnert: Erinnerungen und offene Zahlungen
function alerts(){
  return [
    ...data.bills.filter(b=>!b.paid).map(b=>({id:b.id,ref:b,title:`${b.name} bezahlen`,remindOn:b.remindOn,due:billDue(b),
        text:from=>`${eur(b.amount)} ${lc(billText(b,from))}`+(b.note?` – ${b.note}`:'')})),
    ...data.reminders.map(r=>({id:r.id,ref:r,title:r.title,remindOn:r.remindOn,due:isDue(r),
        text:from=>whenText(r,from)+(r.note?` – ${r.note}`:'')})),
  ];
}

/* ===== Nachrichten =====
   Handy-App: echte Nachricht zur geplanten Zeit, auch wenn die App zu ist.
   PC / Browser: Nachricht, sobald die App offen ist und die Erinnerung fällig ist. */
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const nativeLN=()=>{try{const C=window.Capacitor;return C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.LocalNotifications||null;}catch(e){return null;}};
const numId=s=>{let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h)%2000000000+1;};
let channelReady=false;
async function syncNotifications(ask){
  const LN=nativeLN();
  if(LN){
    try{
      let perm=await LN.checkPermissions();
      if(perm.display!=='granted'&&ask) perm=await LN.requestPermissions();
      if(perm.display!=='granted') return;
      if(!channelReady){ try{ await LN.createChannel({id:'erinnerungen',name:'Erinnerungen',importance:4}); }catch(e){} channelReady=true; }
      const pending=await LN.getPending();
      if(pending&&pending.notifications&&pending.notifications.length) await LN.cancel({notifications:pending.notifications.map(n=>({id:n.id}))});
      const now=new Date();
      const list=alerts().filter(a=>notifyAt(a)>now).sort((a,b)=>notifyAt(a)-notifyAt(b)).slice(0,60);
      if(list.length) await LN.schedule({notifications:list.map(a=>({
        id:numId(a.id), title:a.title, body:a.text(remindDay(a)),
        schedule:{at:notifyAt(a),allowWhileIdle:true}, channelId:'erinnerungen'}))});
    }catch(e){ console.warn('Nachrichten:',e); }
    return;
  }
  // PC / Browser (auf dem iPhone zeigt die App fällige Erinnerungen oben an)
  if(isIOS||!('Notification' in window)) return;
  try{
    if(Notification.permission==='default'&&ask) await Notification.requestPermission();
  }catch(e){ return; }
  showDueNotifications();
}
function showDueNotifications(){
  if(nativeLN()||isIOS||!('Notification' in window)) return;
  let perm; try{ perm=Notification.permission; }catch(e){ return; }
  if(perm!=='granted') return;
  const t=toISO(today()); let changed=false;
  for(const a of alerts()){
    if(!a.due||a.ref.notified===t) continue;
    if(new Date()<notifyAt(a)) continue;   // erst ab 9 Uhr am Erinnerungstag
    try{ new Notification(a.title,{body:a.text(),tag:a.id}); a.ref.notified=t; changed=true; }catch(e){}
  }
  if(changed) save();
}

/* ===== Grafik: Ring = dein Geld im Monat ===== */
function donutSVG(contracts,costs,income){
  const R=80, W=22, C=2*Math.PI*R;
  let parts=[], base=0;
  if(show.abos) parts=contracts.map(c=>({v:perMonth(c),color:COLORS[c.color],title:`${c.name}: ${eur(perMonth(c))} im Monat`}));
  if(show.income&&show.abos){ base=Math.max(income,costs); if(income>costs) parts.push({v:income-costs,color:'var(--left)',title:`Übrig: ${eur(income-costs)}`}); }
  else if(show.income){ base=income; if(income>0) parts.push({v:income,color:'var(--green)',title:`Einnahmen: ${eur(income)}`}); }
  else if(show.abos){ base=costs; }
  const gap=parts.length>1?2.5:0;
  let pos=0, segs='';
  if(base>0) for(const p of parts){
    const len=p.v/base*C;
    segs+=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${p.color}" stroke-width="${W}"
      stroke-dasharray="${Math.max(len-gap,0.8).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-pos).toFixed(2)}" transform="rotate(-90 100 100)"><title>${esc(p.title)}</title></circle>`;
    pos+=len;
  }
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Grafik: wofür dein Geld im Monat draufgeht"><circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--soft)" stroke-width="${W}"/>${segs}</svg>`;
}

/* ===== Anzeige ===== */

  const openBills=data.bills.filter(b=>!b.paid).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0);
  const paidBills=data.bills.filter(b=>b.paid).sort((a,b)=>a.paidOn<b.paidOn?1:-1);

  const reminderRow=r=>{const p=isPast(r), due=isDue(r);

      <span class="item-main"><div class="item-name">${esc(r.title)}</div>
        <div class="item-sub ${due?'soon':''}">${esc(whenText(r))}</div>
        ${r.note?`<div class="item-sub">${esc(r.note)}</div>`:''}</span></button></li>`;};

  const cd=countdown();
  const cdTitle=cd?(cd.n===0?`${cd.i.name} kommt heute`:cd.n===1?`${cd.i.name} kommt morgen`:`${cd.i.name} kommt in ${cd.n} Tagen`):'';

  $('#view').innerHTML=`
    ${cd?`<button type="button" class="countdown" data-countdown="${cd.i.id}">
      <span class="cd-tile ${cd.n===0?'today':''}">${cd.n===0?'<strong class="word">Heute</strong>':`<strong>${cd.n}</strong><span>${cd.n===1?'Tag':'Tage'}</span>`}</span>
      <span class="cd-main"><span class="cd-title">${esc(cdTitle)}</span>
        <span class="cd-sub">+${eur(cd.i.amount)} am ${shortDate(cd.next)}</span>
        <span class="cd-bar" aria-hidden="true"><span style="width:${(cd.progress*100).toFixed(1)}%"></span></span></span>
    </button>`:''}
    <section class="summary">
      <div class="donut">${donutSVG(contracts,costs,income)}
        <div class="donut-mid"><span>${midLabel}</span><strong class="${midClass}">${midValue}</strong></div></div>
      <ul class="calc">
        <li><button type="button" class="tgl" data-tgl="income" aria-pressed="${show.income}" aria-label="Einnahmen in der Grafik ${show.income?'ausblenden':'einblenden'}">
          <span class="key" style="background:var(--green)"></span><span class="tgl-name">Einnahmen</span><b class="plus">${eur(income)}</b></button></li>
        <li><button type="button" class="tgl" data-tgl="abos" aria-pressed="${show.abos}" aria-label="Abos in der Grafik ${show.abos?'ausblenden':'einblenden'}">
          <span class="key" style="background:conic-gradient(${COLORS[0]} 0 33%,${COLORS[1]} 0 66%,${COLORS[2]} 0)"></span><span class="tgl-name">Abos &amp; Verträge</span><b>${costs?'−':''}${eur(costs)}</b></button></li>
        <li class="total"><span class="key" style="background:var(--left)"></span><span>Übrig</span><b class="${left<0?'minus':''}">${left<0?'−':''}${eur(Math.abs(left))}</b></li>
      </ul>

/* ===== Fenster =====
   Schließen passiert immer sofort. Nur in der fertigen App (nicht in einer Vorschau)
   wird zusätzlich die Zurück-Taste am Handy unterstützt. */
const stack=[];
let useHistory=false;
try{ useHistory = window.self===window.top; if(useHistory) history.replaceState({w:0},''); }catch(e){ useHistory=false; }
function dropTop(){const w=stack.pop();if(!w)return;w.el.remove();if(w.onClose)w.onClose();}
window.addEventListener('popstate',e=>{
  if(!useHistory) return;
  const depth=(e.state&&e.state.w)||0;
  while(stack.length>depth) dropTop();   // Zurück-Taste am Handy
});
function closeWin(n=1){
  n=Math.min(n,stack.length); if(!n) return;
  for(let i=0;i<n;i++) dropTop();          // sofort schließen
  if(useHistory){ try{ history.go(-n); }catch(e){} }
}
function win(title,body,setup){
  const el=document.createElement('div'); el.className='scrim';
  el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-top"><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-close aria-label="Schließen">${ICON.x}</button></div>${body}</div>`;
  document.body.appendChild(el);
  const w={el}; stack.push(w);
  if(useHistory){ try{ history.pushState({w:stack.length},''); }catch(e){ useHistory=false; } }
  el.addEventListener('click',e=>{
    if(e.target===el || e.target.closest('[data-close]')){ e.preventDefault(); closeWin(stack.length-stack.indexOf(w)); }
  });
  const sheet=el.querySelector('.sheet'); if(setup) setup(sheet,w);
  const first=sheet.querySelector('[data-focus]');
  if(first&&matchMedia('(min-width:760px)').matches) setTimeout(()=>{try{first.focus();}catch(e){}},60);
  return w;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&stack.length&&!locked){e.preventDefault();closeWin(1);}});
function ask(title,text,okText){
  return new Promise(res=>{let done=false;
    win(title,`<p class="text">${esc(text)}</p><div class="btns"><button type="button" class="btn btn-soft" data-close>Abbrechen</button><button type="button" class="btn btn-red" data-ok>${esc(okText)}</button></div>`,(s,w)=>{
      w.onClose=()=>{if(!done){done=true;res(false);}};
      s.querySelector('[data-ok]').addEventListener('click',()=>{if(done)return;done=true;res(true);});
    });});
}

function linkRemindOn(dateInput,remindInput,gap){
  let touched=false;

    remindInput.addEventListener(ev,()=>{touched=true;});
    dateInput.addEventListener(ev,()=>{ if(!touched&&isISO(dateInput.value)) remindInput.value=remindDefault(dateInput.value,gap); });
  });
}

/* ===== PIN: Ziffernfeld, Einrichten, Sperrbildschirm ===== */
// Der PIN wird nicht im Klartext gespeichert, sondern nur als Prüfsumme
function pinHash(pin){
  let h1=0xdeadbeef, h2=0x41c6ce57; const str='finanzo:'+pin;
  for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0');
}
const keypadHTML=()=>`<div class="dots" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <p class="pin-msg" aria-live="polite"></p>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-k="${n}">${n}</button>`).join('')}<span></span>
    <button type="button" data-k="0">0</button><button type="button" data-k="del" aria-label="Letzte Zahl löschen">${ICON.back}</button></div>`;
function wireKeypad(root,onDone){
  let v='', busy=false;
  const dots=root.querySelector('.dots'), msg=root.querySelector('.pin-msg');
  const paint=()=>dots.querySelectorAll('span').forEach((d,i)=>d.classList.toggle('on',i<v.length));
  const pad={
    press(k){
      if(busy) return;
      if(k==='del') v=v.slice(0,-1); else if(/^[0-9]$/.test(k)&&v.length<4){ v+=k; msg.textContent=''; }
      paint();
      if(v.length===4){ busy=true; const val=v; setTimeout(()=>{ busy=false; onDone(val); },140); }
    },
    reset(text,shake){
      v=''; paint(); msg.textContent=text||'';
      if(shake){ dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake'); }
    },
  };
  root.querySelector('.pad').addEventListener('click',e=>{const b=e.target.closest('[data-k]'); if(b) pad.press(b.dataset.k);});
  return pad;
}
function pinSetupWin(done){
  const FIRST='Gib einen neuen PIN mit 4 Zahlen ein.', AGAIN='Gib den PIN nochmal ein.';
  win(data.settings.pin?'PIN ändern':'PIN einrichten',`<div class="pin-sheet"><p class="text" data-step>${FIRST}</p>${keypadHTML()}</div>`,(s,w)=>{
    let first=null; const step=s.querySelector('[data-step]');
    w.pad=wireKeypad(s,val=>{
      if(first===null){ first=val; step.textContent=AGAIN; w.pad.reset(); return; }
      if(val===first){
        data.settings.pin=pinHash(val); save(); closeWin(1); if(done) done(); toast('PIN-Sperre ist an');
      } else { first=null; step.textContent=FIRST; w.pad.reset('Die PINs waren nicht gleich. Versuch es nochmal.',true); }
    });
  });
}
let locked=false, lockAuto=false, lockPad=null, hiddenAt=0;
function setInert(on){ document.querySelectorAll('body > *:not(#lock)').forEach(el=>{ try{ el.inert=on; }catch(e){} if(on) el.setAttribute('aria-hidden','true'); else el.removeAttribute('aria-hidden'); }); }
function lockApp(auto){
  if(!data.settings.pin||locked) return;
  locked=true; lockAuto=!!auto;
  const el=document.createElement('div'); el.id='lock'; el.className='lock';
  el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-label','Finanzo ist gesperrt');
  document.body.appendChild(el); setInert(true);
  showLockPad(el);
}
function showLockPad(el){
  el.innerHTML=`<div class="lock-in"><span class="logo-mark">${ICON.mark}</span><h2>PIN eingeben</h2>${keypadHTML()}
    <button type="button" class="lock-link" data-forgot>PIN vergessen?</button></div>`;
  lockPad=wireKeypad(el,val=>{ if(pinHash(val)===data.settings.pin) unlockApp(); else lockPad.reset('Falscher PIN',true); });
  el.querySelector('[data-forgot]').addEventListener('click',()=>{
    lockPad=null;
    el.innerHTML=`<div class="lock-in"><span class="logo-mark">${ICON.mark}</span><h2>PIN vergessen?</h2>
      <p class="lock-text">Ohne PIN kommst du nur wieder rein, wenn du alle Daten löschst. Alle Einnahmen, Verträge, Zahlungen und Erinnerungen werden gelöscht.</p>
      <div class="btns"><button type="button" class="btn btn-soft" data-back>Zurück</button><button type="button" class="btn btn-red" data-reset>Alles löschen</button></div></div>`;
    el.querySelector('[data-back]').addEventListener('click',()=>showLockPad(el));
    el.querySelector('[data-reset]').addEventListener('click',()=>{
      data.incomes=[]; data.contracts=[]; data.bills=[]; data.reminders=[]; data.settings.pin='';
      save(); draw(); unlockApp(); toast('Alles gelöscht. Die PIN-Sperre ist aus.'); syncNotifications(false);
    });
  });
}
function unlockApp(){
  const el=document.getElementById('lock'); if(el) el.remove();
  locked=false; lockAuto=false; lockPad=null; setInert(false);
}
// Zahlen und Löschen auch über die Tastatur (PC)
document.addEventListener('keydown',e=>{
  const top=stack[stack.length-1];
  const pad=locked?lockPad:(top&&top.pad);
  if(!pad) return;
  if(/^[0-9]$/.test(e.key)){ e.preventDefault(); pad.press(e.key); }
  else if(e.key==='Backspace'){ e.preventDefault(); pad.press('del'); }
},true);
// Wenn die App in den Hintergrund geht: sofort sperren. Kommt man in 10 Sekunden zurück, geht sie von selbst wieder auf.
document.addEventListener('visibilitychange',()=>{
  if(!data.settings.pin) return;
  if(document.hidden){ if(!locked){ hiddenAt=Date.now(); lockApp(true); } }
  else if(locked&&lockAuto&&Date.now()-hiddenAt<10000){ unlockApp(); }
});

/* ===== Währung auswählen ===== */
function currencyWin(onPick){
  const all=CURRENCIES.map(code=>({code,name:curName(code),sym:curSymbol(code)})).sort((a,b)=>a.name.localeCompare(b.name,'de'));
  const row=c=>`<li><button type="button" class="cur" data-code="${c.code}" aria-selected="${c.code===data.settings.currency}">
    <span class="cur-name">${esc(c.name)}<small>${c.code}</small></span><span class="cur-sym">${c.code===data.settings.currency?ICON.check:(c.sym!==c.code?esc(c.sym):'')}</span></button></li>`;
  win('Währung',`<div class="cur-search"><input class="input" type="search" placeholder="Suchen, z. B. Dollar oder USD" data-q autocomplete="off"></div>
    <p class="text" style="margin-top:0">Die Beträge werden dabei nicht umgerechnet, nur das Zeichen ändert sich.</p>
    <div data-results></div>`,s=>{
    const box=s.querySelector('[data-results]'), q=s.querySelector('[data-q]');
    const render=()=>{
      const t=q.value.trim().toLowerCase();
      if(!t){
        box.innerHTML=`<div class="cur-group">Häufig</div><ul class="cur-list">${POPULAR.map(c=>all.find(x=>x.code===c)).filter(Boolean).map(row).join('')}</ul>
          <div class="cur-group">Alle Währungen</div><ul class="cur-list">${all.map(row).join('')}</ul>`;
      } else {
        const hits=all.filter(c=>c.name.toLowerCase().includes(t)||c.code.toLowerCase().includes(t)||c.sym.toLowerCase()===t);
        box.innerHTML=hits.length?`<ul class="cur-list">${hits.map(row).join('')}</ul>`:`<p class="cur-none">Keine Währung gefunden.</p>`;
      }
    };
    render();
    q.addEventListener('input',render);
    box.addEventListener('click',e=>{
      const b=e.target.closest('[data-code]'); if(!b) return;
      data.settings.currency=b.dataset.code; setCurrency(b.dataset.code); save();
      closeWin(1); draw(); if(onPick) onPick(); toast(`Währung: ${curName(b.dataset.code)}`);
    });
  });
}

/* ===== Klicks auf der Hauptseite ===== */
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.closest('.sheet')) return;
  if(b.dataset.tgl){show[b.dataset.tgl]=!show[b.dataset.tgl];draw();const n=document.querySelector(`[data-tgl="${b.dataset.tgl}"]`);if(n)try{n.focus({preventScroll:true});}catch(e){}return;}
  if(b.hasAttribute('data-add-income')){incomeWin();return;}
  if(b.hasAttribute('data-add-contract')){contractWin();return;}
  if(b.hasAttribute('data-add-reminder')){reminderWin();return;}
  if(b.hasAttribute('data-add-bill')){billWin();return;}
  if(b.dataset.pay){const x=data.bills.find(y=>y.id===b.dataset.pay); if(x) setPaid(x,!x.paid); return;}
  if(b.dataset.bill){billWin(b.dataset.bill);return;}
  if(b.hasAttribute('data-settings')){settingsWin();return;}
  if(b.dataset.income){incomeWin(b.dataset.income);return;}
  if(b.dataset.countdown){incomeWin(b.dataset.countdown);return;}
  if(b.dataset.contract){contractWin(b.dataset.contract);return;}
  if(b.dataset.reminder){reminderWin(b.dataset.reminder);return;}
});
// Neuer Tag / App wieder geöffnet: Anzeige und Nachrichten aktualisieren
let lastDay=toISO(today());
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) return;
  if(toISO(today())!==lastDay){lastDay=toISO(today());draw();}
  showDueNotifications();
});
setInterval(()=>{ if(toISO(today())!==lastDay){lastDay=toISO(today());draw();} showDueNotifications(); },15*60*1000);

paintIcons();
applyTheme();
lockApp(false);
draw();
save();   // speichert umgewandelte alte Daten
if(data.reminders.length||data.bills.length) syncNotifications(false);
showDueNotifications();
// Online-Version (iPhone): auch ohne Internet starten können
if((location.protocol==='https:'||location.hostname==='localhost')&&!window.Capacitor&&'serviceWorker' in navigator){
  try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
}
</script>
