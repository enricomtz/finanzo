<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1B4D3B">
<!-- iPhone: als App auf dem Home-Bildschirm -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Finanzo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231B4D3B'/%3E%3Crect x='14' y='17' width='36' height='7' rx='3.5' fill='white'/%3E%3Crect x='14' y='29' width='26' height='7' rx='3.5' fill='white'/%3E%3Crect x='14' y='41' width='15' height='7' rx='3.5' fill='white'/%3E%3Ccircle cx='42' cy='44.5' r='5' fill='%2364E3B4'/%3E%3C/svg%3E">
<style>
/* ---------- Farben: hell ---------- */
:root{
  --bg:#F2F5F3; --card:#FFFFFF; --soft:#EDF2EF; --ink:#12231B; --ink-2:#55675E; --ink-3:#88978F; --line:#E3E9E5;
  --brand:#1B4D3B; --brand-sub:#B7D2C4;
  --accent:#1E6B4F; --on-accent:#FFFFFF; --accent-soft:#E0EFE7;
  --green:#15965A; --green-soft:#E2F3E9; --left:#C3E7D3; --red:#D9433F; --red-soft:#FCEAEA;
  --warn:#9E5C00; --warn-soft:#FFF2D4; --scrim:rgba(8,22,15,.45);
  --shadow:0 1px 2px rgba(18,45,32,.05),0 4px 16px -6px rgba(18,45,32,.13);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
/* ---------- Farben: dunkel (System oder fest eingestellt) ---------- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1411; --card:#17211C; --soft:#1F2B25; --ink:#E4EEE8; --ink-2:#A1B2A9; --ink-3:#6B7C73; --line:#26342D;
    --brand:#133A2B; --brand-sub:#9BC3AF; --accent:#4CC28B; --on-accent:#0B1A12; --accent-soft:#1B3A2B;
    --green:#4CC28B; --green-soft:#183326; --left:#1E4A37; --red:#FF7070; --red-soft:#3A1D1D; --warn:#F2B740; --warn-soft:#33290F;
    --scrim:rgba(0,0,0,.6); --shadow:0 0 0 1px var(--line);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1411; --card:#17211C; --soft:#1F2B25; --ink:#E4EEE8; --ink-2:#A1B2A9; --ink-3:#6B7C73; --line:#26342D;
  --brand:#133A2B; --brand-sub:#9BC3AF; --accent:#4CC28B; --on-accent:#0B1A12; --accent-soft:#1B3A2B;
  --green:#4CC28B; --green-soft:#183326; --left:#1E4A37; --red:#FF7070; --red-soft:#3A1D1D; --warn:#F2B740; --warn-soft:#33290F;
  --scrim:rgba(0,0,0,.6); --shadow:0 0 0 1px var(--line);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,input,select,textarea,label{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default;opacity:.3}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
svg{display:block}
.plus{color:var(--green)} .neg{color:var(--red)} .minus{color:var(--red)}

/* ---------- Aufbau ---------- */
main{padding:calc(env(safe-area-inset-top) + 14px) 16px calc(170px + env(safe-area-inset-bottom))}
body[data-page="start"] main{padding-top:0}
.wrap{max-width:600px;margin:0 auto}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn svg{pointer-events:none}
@media (hover:hover){ .icon-btn:hover{background:var(--soft)} }
@media (min-width:760px){ main{padding:28px 32px calc(150px + env(safe-area-inset-bottom))} body[data-page="start"] main{padding-top:28px} }

/* ---------- Reiter unten ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:color-mix(in srgb,var(--card) 94%,transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar-in{display:flex;gap:0;width:100%;max-width:600px}
.tab{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 3px;font-size:clamp(10.5px,3vw,11.5px);letter-spacing:-.01em;font-weight:650;color:var(--ink-3);border-radius:14px;white-space:nowrap}
.tab[data-tab="settings"]{flex-grow:1.35}
.tab .pill{width:50px;height:30px;border-radius:999px;display:grid;place-items:center}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .pill{background:var(--accent-soft)}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:31;height:56px;padding:0 22px 0 16px;border-radius:18px;
  background:var(--accent);color:var(--on-accent);display:flex;align-items:center;gap:8px;font-weight:760;font-size:16.5px;
  box-shadow:0 10px 24px -8px color-mix(in srgb,var(--accent) 75%,transparent)}
.fab:active{transform:scale(.97)}
@media (min-width:760px){ .fab{right:max(16px,calc(50% - 380px))} }

/* ---------- Start: grüner Kopf und Geld-Karte ---------- */
.hello{background:var(--brand);color:#fff;margin:0 -16px;padding:calc(env(safe-area-inset-top) + 22px) 20px 74px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-radius:0 0 28px 28px}
.hello h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.025em;line-height:1.2;overflow-wrap:anywhere}
.hello p{margin:3px 0 0;color:var(--brand-sub);font-size:15.5px}
@media (min-width:760px){ .hello{margin:0;border-radius:28px;padding:26px 24px 76px} }
.budget{display:block;width:100%;text-align:left;background:var(--card);border-radius:24px;padding:18px 18px 16px;margin:-56px 0 12px;position:relative;
  box-shadow:0 14px 34px -16px rgba(10,40,25,.45)}
.b-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.b-label{color:var(--ink-2);font-weight:650;font-size:15.5px;padding-top:2px}
.b-ic{width:46px;height:46px;border-radius:15px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;flex:none}
.b-num{display:block;font-size:42px;font-weight:820;letter-spacing:-.04em;line-height:1.08;margin-top:-6px;font-variant-numeric:tabular-nums}
.b-of{display:block;color:var(--ink-3);font-size:14.5px;font-weight:600;margin-top:2px}
.b-bar{margin:12px 0 10px;height:9px}
.b-bar span{background:var(--green)}
.b-num.minus + .b-of + .b-bar span{background:var(--red)}
.b-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14.5px;color:var(--ink-2)}
.b-empty{margin:4px 0 14px;color:var(--ink-2)}

/* ---------- Bausteine ---------- */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}
.page-title{margin:2px 0 12px;font-size:27px;font-weight:800;letter-spacing:-.025em}
.page-head .page-title{margin:0}
.page-sub{margin:-4px 4px 14px;color:var(--ink-2);font-size:15px}
.round-btn{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.card{background:var(--card);border-radius:22px;padding:18px 18px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{margin:0;font-size:17px;font-weight:760}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card-head small{color:var(--ink-3);font-weight:600;font-size:14px;white-space:nowrap}
.muted{color:var(--ink-2);margin:6px 0 0;font-size:15px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 4px 10px}
.sec-head h2{margin:0;font-size:18px;font-weight:770;letter-spacing:-.01em}
.sec-head small{font-size:14px;font-weight:600;color:var(--ink-2)}
.sec-link{color:var(--accent);font-weight:700;font-size:15px;padding:6px 2px}
.list{list-style:none;margin:0;padding:0;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.list li+li{border-top:1px solid var(--line)}
.item{width:100%;display:flex;align-items:center;gap:13px;padding:12px 16px;text-align:left;min-height:64px}
@media (hover:hover){ .item:hover,.cat-row:hover,.ov:hover{background:var(--soft)} }
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.item-main{flex:1;min-width:0}
.item-name{font-weight:680;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-sub{font-size:14px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-sub.wrap{white-space:normal}
.item-sub.soon{color:var(--warn);font-weight:650}
.item-sub.late{color:var(--red);font-weight:650}
.item-sub.save{color:var(--green);font-weight:600;white-space:normal}
.item-sub.act{color:var(--accent);font-weight:650}
.item-amt{text-align:right;font-weight:740;font-variant-numeric:tabular-nums;white-space:nowrap}
.item-amt small{display:block;font-size:13px;font-weight:500;color:var(--ink-3)}
.b-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--c) 15%,var(--card));color:var(--c)}
.b-icon svg{width:21px;height:21px}
.book.planned .item-amt{color:var(--ink-3)}
.book.planned .b-icon{opacity:.75}
.add-row{color:var(--accent);font-weight:700;min-height:58px}
.plus-ic{width:30px;height:30px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.empty{background:var(--card);border-radius:22px;padding:28px 22px 24px;text-align:center;box-shadow:var(--shadow)}
.empty-ic{width:62px;height:62px;margin:0 auto 14px;border-radius:20px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.empty-ic svg{width:30px;height:30px}
.empty p{margin:0 auto 18px;color:var(--ink-2);max-width:32ch}
.empty strong{display:block;font-size:19px;margin-bottom:6px;color:var(--ink)}
.empty-line{background:var(--card);border-radius:20px;padding:18px;color:var(--ink-2);margin:0;text-align:center;box-shadow:var(--shadow)}
.link-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.link-btn{display:inline-flex;align-items:center;gap:8px;color:var(--accent);font-weight:700;padding:10px 0 4px}
.bar{display:block;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px}
.warn-card{width:100%;display:flex;gap:12px;align-items:flex-start;background:var(--red-soft);color:var(--ink);border-radius:18px;padding:13px 16px;margin-bottom:12px;text-align:left}
.warn-card svg{color:var(--red);flex:none;margin-top:1px}
.warn-card.yellow{background:var(--warn-soft)}
.warn-card.yellow svg{color:var(--warn)}

/* ---------- Start: Monatsübersicht ---------- */
.ov-list{list-style:none;margin:8px 0 0;padding:0}
.ov-list li+li{border-top:1px solid var(--line)}
.ov{display:flex;align-items:center;gap:12px;width:calc(100% + 16px);margin:0 -8px;padding:10px 8px;text-align:left;border-radius:12px;font-variant-numeric:tabular-nums}
.ov-name{flex:1;font-weight:620;color:var(--ink)}
.ov b{font-weight:740;white-space:nowrap}
.ov > svg{color:var(--ink-3);flex:none;margin-left:-6px;width:18px;height:18px}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.ic svg{width:20px;height:20px}
.ic-green{background:var(--green-soft);color:var(--green)}
.ic-blue{background:color-mix(in srgb,#4C6EF5 15%,var(--card));color:#4C6EF5}
.ic-red{background:var(--red-soft);color:var(--red)}
.ic-orange{background:color-mix(in srgb,#F08C00 16%,var(--card));color:#E67700}
.ic-teal{background:color-mix(in srgb,#0CA678 15%,var(--card));color:#0CA678}
.ic-gray{background:var(--soft);color:var(--ink-2)}

/* ---------- Buchungen ---------- */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:15px;padding:0 14px;box-shadow:var(--shadow);color:var(--ink-3)}
.search input{flex:1;min-width:0;border:0;background:none;min-height:50px;font-size:16px;outline:none;color:var(--ink);-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.month-nav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:999px;padding:4px;margin-bottom:12px;box-shadow:var(--shadow)}
.month-nav strong{font-size:16.5px;font-weight:720;text-align:center}
.month-nav .icon-btn{border-radius:999px}
.stats span{display:block;font-size:13.5px;color:var(--ink-2);font-weight:600}
.icon-round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--ink-2);box-shadow:var(--shadow);flex:none}
.icon-round[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.search{margin-bottom:12px}
.month-card{padding:8px 8px 10px}
.mc-nav{display:flex;align-items:center;justify-content:space-between}
.mc-title{display:inline-flex;align-items:center;gap:6px;font-size:17px;font-weight:760;padding:8px 12px;border-radius:12px}
.mc-title svg{color:var(--ink-3)}
@media (hover:hover){ .mc-title:hover{background:var(--soft)} }
.yp-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--soft);border-radius:999px;min-height:52px;margin:8px 0 14px;font-size:18px;font-weight:780}
.yp-btn svg{color:var(--ink-3);transition:transform .2s}
.yp-btn.open svg{transform:rotate(180deg)}
.wheel{position:relative;height:220px;margin:-4px 0 14px;border-radius:18px;background:var(--soft);overflow:hidden}
.wheel-band{position:absolute;left:8px;right:8px;top:88px;height:44px;border-radius:12px;background:var(--card)}
.wheel-scroll{position:relative;z-index:1;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 32%,#000 68%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 32%,#000 68%,transparent 100%)}
.wheel-scroll::-webkit-scrollbar{display:none}
.wheel-pad{height:88px}
.wheel-item{height:44px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:21px;font-weight:600;color:var(--ink-3);cursor:pointer;font-variant-numeric:tabular-nums;transition:color .12s,font-size .12s}
.wheel-item.on{color:var(--ink);font-size:25px;font-weight:780}
.mp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.mp button{padding:13px 4px;border-radius:13px;border:1.5px solid var(--line);font-weight:700;font-size:15.5px}
.mp button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mp button:disabled{opacity:.3}
.mc-sums{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 4px 0}
.mc-sums div{background:var(--soft);border-radius:16px;padding:10px 14px;min-width:0}
.mc-sums span{display:block;font-size:13.5px;color:var(--ink-2);font-weight:600}
.mc-sums b{display:block;font-size:20px;font-weight:780;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-seg{margin:0 0 12px}
.group{font-size:14px;font-weight:700;color:var(--ink-3);margin:18px 6px 8px}

/* ---------- Analyse ---------- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{padding:10px 6px;border-radius:11px;font-weight:700;font-size:15px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats.one{grid-template-columns:1fr}
.stats div{background:var(--soft);border-radius:16px;padding:12px 14px}
.stats b{display:block;font-size:19px;font-weight:760;font-variant-numeric:tabular-nums;margin-top:2px}
.mstats{display:flex;gap:10px;margin-top:10px}
.mstats > *{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;background:var(--soft);text-align:left}
.mstats span{font-size:13px;font-weight:650;color:var(--ink-3)}
.mstats b{font-size:15px;font-weight:780;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchart{display:flex;align-items:stretch;gap:2px;height:150px;margin-top:10px}
.mcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0 2px;border-radius:10px}
.mcol-wrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.mcol-bar{display:block;width:38%;max-width:11px;min-height:2px;border-radius:5px 5px 2px 2px;transition:background .15s}
.mcol-bar.in{background:color-mix(in srgb,var(--green) 30%,var(--card))}
.mcol-bar.out{background:color-mix(in srgb,var(--red) 30%,var(--card))}
.mcol.sel .mcol-bar.in{background:var(--green)}
.mcol.sel .mcol-bar.out{background:var(--red)}
.mcol.sel{background:var(--soft)}
.mlegend{display:flex;gap:16px;margin-top:14px;font-size:13px;font-weight:650;color:var(--ink-3)}
.mlegend span{display:inline-flex;align-items:center;gap:6px}
.mlegend i{width:10px;height:10px;border-radius:3px;background:var(--green)}
.mlegend i.out{background:var(--red)}
.msum{display:flex;gap:10px;margin-top:12px}
.msum > div{flex:1;min-width:0;padding:12px 14px;border-radius:16px;background:var(--soft)}
.msum span{display:block;font-size:13px;font-weight:650;color:var(--ink-3)}
.msum b{display:block;margin-top:2px;font-size:clamp(17px,5.4vw,22px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.msum .plus,.crow-top .plus{color:var(--green)}
.msum .neg,.mleft .neg{color:var(--red)}
.mleft{margin:10px 2px 0;color:var(--ink-2);font-weight:600}
.mleft b{color:var(--ink)}
.sec-h{margin:18px 0 0;font-size:13px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.sec-h + .crows{margin-top:4px}
.mcol-lbl{font-size:11px;font-weight:650;color:var(--ink-3);white-space:nowrap}
.mcol.sel .mcol-lbl{color:var(--ink);font-weight:800}
.cmp{display:inline-block;margin-top:10px;padding:6px 11px;border-radius:10px;font-size:13px;font-weight:700}
.cmp.up{background:var(--red-soft);color:var(--red)}
.cmp.down{background:var(--green-soft);color:var(--green)}
.cmp.same{background:var(--soft);color:var(--ink-2)}
.crows{list-style:none;margin:14px 0 0;padding:0}
.crows li+li{border-top:1px solid var(--line)}
.crow{display:flex;align-items:center;gap:12px;width:calc(100% + 16px);margin:0 -8px;padding:12px 8px;text-align:left;border-radius:12px}
@media (hover:hover){ .crow:hover{background:var(--soft)} }
.crow-main{flex:1;min-width:0}
.crow-top{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.crow-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow-top b{font-variant-numeric:tabular-nums;white-space:nowrap}
.crow .bar{margin:7px 0 5px;height:7px}
.crow-sub{display:block;font-size:13px;color:var(--ink-3);font-weight:600}
.crow-sub .over{color:var(--red)}
.crow > svg{color:var(--ink-3);flex:none}
.budget-link{margin:2px 6px 0}
.budget-link svg{width:18px;height:18px}
.sheet .list{background:var(--soft);box-shadow:none}
.cat-row{display:block;text-align:left;padding:10px 8px;margin:0 -8px;width:calc(100% + 16px);border-radius:12px}
.cat-top{display:flex;align-items:center;gap:10px;font-size:15.5px}
.cat-top .name{flex:1;font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-top b{font-variant-numeric:tabular-nums;white-space:nowrap}
.cat-top small{color:var(--ink-3);font-weight:600;white-space:nowrap}
.cat-row .bar{margin-top:7px}
.cat-note{display:block;font-size:13.5px;margin-top:5px;color:var(--ink-2)}
.cat-note.warn{color:var(--warn);font-weight:650}
.cat-note.over{color:var(--red);font-weight:650}

/* ---------- Termine ---------- */
.pay-row{display:flex;align-items:center}
.pay-row .item{padding-left:4px}
.check{width:44px;height:44px;margin-left:8px;flex:none;display:grid;place-items:center;border-radius:12px}
.ring{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink-3);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.ring svg{width:15px;height:15px}
.check[aria-pressed="true"] .ring{background:var(--green);border-color:var(--green);color:#fff}
.pay-row.done .item{opacity:.5}
.pay-row.done .item-name{text-decoration:line-through}

/* ---------- Sparziele ---------- */
.goal{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.goal-head{width:100%;display:flex;align-items:center;gap:13px;text-align:left}
.g-ic{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 16%,var(--card));color:var(--c)}
.g-ic svg{width:25px;height:25px}
.g-txt{flex:1;min-width:0}
.g-name{display:block;font-weight:740;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-target{display:block;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.goal .bar{height:10px;margin-top:14px}
.goal-line{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:14.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.goal-line b{color:var(--ink)}
.goal-line.small{font-size:13.5px;color:var(--ink-3);margin-top:3px}
.goal-tip{margin-top:10px;padding:9px 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums}
.goal-done{color:var(--green);font-weight:700}
.goal .btn{margin-top:12px;width:100%;min-height:44px}

/* ---------- Mehr ---------- */
.menu{margin-bottom:14px}
.menu .item{min-height:68px}
.menu .item > svg{color:var(--ink-3);flex:none}
.back-btn{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-weight:700;padding:8px 8px 6px 0;margin:-4px 0 4px -6px}
.version{margin:10px 0 0;text-align:center;font-size:13.5px;color:var(--ink-3)}

/* ---------- Knöpfe ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:15px;font-weight:700;font-size:16px;min-height:50px}
.btn-main{background:var(--accent);color:var(--on-accent)}
.btn-soft{background:var(--soft);color:var(--ink)}
.btn-red{background:color-mix(in srgb,var(--red) 11%,transparent);color:var(--red)}
.btn-full{width:100%}
.btns{display:flex;gap:10px;margin-top:10px}
.btns .btn{flex:1}

/* ---------- Fenster ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;
  padding:8px 20px calc(22px + env(safe-area-inset-bottom));animation:up .24s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet-top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 2px;position:sticky;top:-8px;background:var(--card);z-index:2}
.sheet-top h2{margin:0;font-size:21px;letter-spacing:-.015em}
.sheet p.text{margin:6px 0 14px;color:var(--ink-2)}
@media (min-width:760px){
  .scrim{align-items:center;padding:24px}
  .sheet{border-radius:26px;padding:12px 26px 26px;animation:pop .2s cubic-bezier(.2,.8,.2,1)}
  .sheet-top{top:-12px}
}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
@keyframes pop{from{transform:scale(.97);opacity:0}}

/* ---------- Formular ---------- */
.field{display:block;margin:16px 0}
.label{display:block;font-size:14.5px;font-weight:650;color:var(--ink-2);margin-bottom:7px}
.input{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);min-height:50px;appearance:none;-webkit-appearance:none}
.input:focus{outline:none;border-color:var(--accent);background:var(--card)}
textarea.input{min-height:84px;resize:vertical;line-height:1.4}
select.input,select.input:focus{background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 21px) 50%,calc(100% - 15px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:44px;cursor:pointer}
.money{position:relative;display:block}
.money .input{font-size:30px;font-weight:760;letter-spacing:-.02em;padding:10px 70px 10px 14px;font-variant-numeric:tabular-nums}
.money span{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:22px;font-weight:700;color:var(--ink-3);pointer-events:none;max-width:60px;overflow:hidden;white-space:nowrap}
.date-btn{position:relative;display:block}
.date-btn .date-ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--accent);pointer-events:none;z-index:1}
.date-btn .date-ic svg{width:20px;height:20px}
.date-btn .input{padding-left:46px;font-weight:680;color:var(--accent);background:var(--accent-soft);border-color:transparent;cursor:pointer}
.hint{display:block;font-size:13.5px;color:var(--ink-3);margin-top:8px}
.err{color:var(--red);font-size:14.5px;font-weight:650;margin:8px 0}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{padding:11px 8px;border-radius:13px;border:1.5px solid var(--line);font-weight:650;font-size:15px}
.choice button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.choice button[aria-pressed="true"] .c-ic{color:inherit!important}
.choice.cats button{display:flex;align-items:center;gap:8px;justify-content:flex-start;padding:10px 12px;text-align:left;font-size:14.5px}
.c-ic svg{width:18px;height:18px}
.choice.cats4{grid-template-columns:repeat(4,1fr);gap:8px}
.choice.cats4 button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 2px 8px;border-radius:14px;font-size:12.5px;font-weight:700;min-width:0;white-space:nowrap}
.choice.cats4 .c-ic svg{width:22px;height:22px}
.row2{display:grid;grid-template-columns:1.15fr 1fr;gap:10px}
.row2 .field{min-width:0}
.row2 input[type=date]{min-width:0;padding-left:8px;padding-right:8px;text-align:center}
form.compact .field{margin:12px 0}
form.compact .kind-seg{margin:4px 0 0}
form.compact .quick{margin:-2px 0 12px}
.kind-seg{margin:8px 0 4px}
.icon-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.icon-pick button{height:52px;border-radius:14px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--ink-2)}
.icon-pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.quick button{padding:7px 13px;border-radius:999px;background:var(--soft);font-size:14.5px;font-weight:650;color:var(--ink-2)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--soft);width:100%;text-align:left;font-weight:650;margin:16px 0 0}
.switch{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch-row[aria-pressed="true"] .switch{background:var(--green)}
.switch-row[aria-pressed="true"] .switch::after{transform:translateX(20px)}

/* ---------- Rechnung zum Nachprüfen ---------- */
.recap{list-style:none;margin:4px 0 8px;padding:0}
.recap li{display:flex;justify-content:space-between;gap:12px;padding:8px 2px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.recap li span{color:var(--ink-2);min-width:0}
.recap li b{white-space:nowrap;font-weight:680}
.recap li.head{border-bottom:0;padding:14px 2px 2px}
.recap li.head span{color:var(--ink);font-weight:720}
.recap li.total{border-bottom:0;border-top:1.5px solid var(--ink-3);font-size:17px;margin-top:4px}
.recap li.total span{color:var(--ink);font-weight:740}
.recap li.total b{font-weight:800}

/* ---------- Einstellungen ---------- */
.set{padding:16px 0;border-top:1px solid var(--line)}
.sheet-top + .set{border-top:0}
.set-card{padding-top:2px;padding-bottom:4px}
.set-card .set:first-child{border-top:0}
.set h3{margin:0 0 10px;font-size:16px}
.set p{margin:-4px 0 12px;color:var(--ink-2);font-size:14.5px}
.pick{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--soft);text-align:left}
.pick span:first-child{flex:1;font-weight:680}
.pick small{color:var(--ink-2);font-weight:600;font-size:14.5px}
.pick svg{color:var(--ink-3)}
.cur-search{position:sticky;top:44px;background:var(--card);padding:8px 0 10px;z-index:1}
.cur-group{font-size:13.5px;font-weight:700;color:var(--ink-3);margin:14px 4px 6px}
.cur-list{list-style:none;margin:0;padding:0}
.cur{width:100%;display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;text-align:left}
.cur-name{flex:1;min-width:0}
.cur-name small{display:block;color:var(--ink-3);font-size:13px;font-weight:600}
.cur-sym{font-weight:700;color:var(--ink-2);white-space:nowrap}
.cur[aria-selected="true"]{background:var(--accent-soft)}
.cur[aria-selected="true"] .cur-sym{color:var(--accent)}
.cur-none{color:var(--ink-2);text-align:center;padding:18px 0}

/* ---------- Anmelden ---------- */
.auth{position:fixed;inset:0;z-index:35;background:var(--bg);overflow:auto;display:flex;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 20px) 16px calc(28px + env(safe-area-inset-bottom));overscroll-behavior:contain}
body.locked main,body.locked .tabbar,body.locked .fab{display:none!important}
.auth-in{width:100%;max-width:440px}
.auth-hero{background:var(--brand);color:#fff;border-radius:28px;padding:24px 22px 64px}
.auth-logo{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.14);display:grid;place-items:center;margin-bottom:14px}
.auth-hero h1{margin:0;font-size:30px;font-weight:820;letter-spacing:-.03em}
.auth-hero p{margin:6px 0 0;color:var(--brand-sub);font-size:15.5px}
.auth-card{background:var(--card);border-radius:24px;padding:16px 18px 18px;margin:-46px 10px 0;position:relative;box-shadow:0 14px 34px -16px rgba(10,40,25,.45)}
.auth-card .field:first-of-type{margin-top:14px}
.ok-msg{color:var(--green);font-weight:650;font-size:14.5px;margin:8px 0}
.auth-forgot{display:flex;margin:8px auto 0}
.auth-note{display:flex;gap:10px;align-items:flex-start;color:var(--ink-2);font-size:14px;margin:16px 14px 0}
.auth-note svg{flex:none;color:var(--green);width:20px;height:20px}
.sync-info{color:var(--green)!important;font-weight:600}

/* ---------- Meldung ---------- */
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:60;
  width:max-content;max-width:calc(100vw - 32px);background:var(--ink);color:var(--card);border-radius:14px;padding:12px 18px;font-weight:650;
  transition:transform .2s,opacity .2s;box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}
.toast.show{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>

</main>

  <button class="tab" data-tab="settings"><span class="pill" data-icon="gear"></span>Einstellungen</button>
</div></nav>
<button class="fab" data-add-expense><span data-icon="plus"></span>Eintragen</button>

<div id="auth" class="auth" hidden></div>

function clean(raw){
  raw=raw&&typeof raw==='object'?raw:{};
  const arr=k=>Array.isArray(raw[k])?raw[k]:[];
  const s=empty(), st=raw.settings||{};
  s.settings={
    theme:['system','light','dark'].includes(st.theme)?st.theme:'system',
    currency:CURRENCIES.includes(st.currency)?st.currency:'EUR',
    name:typeof st.name==='string'?st.name.trim().slice(0,30):'',
    lastBackup:isISO(st.lastBackup)?st.lastBackup:'',
  };
  for(const i of arr('incomes')){
    if(!i||!i.name||!(i.amount>0)) continue;
    s.incomes.push({id:i.id||uid(),name:String(i.name).slice(0,40),amount:round2(i.amount),
      payday:Number.isInteger(i.payday)&&i.payday>=1&&i.payday<=31?i.payday:0,since:isISO(i.since)?i.since:''});
  }
  for(const c of arr('contracts')){
    if(!c||!c.name||!isISO(c.nextDate)||!(c.amount>0)||c.status==='cancelled') continue;
    let cancelBy=isISO(c.cancelBy)?c.cancelBy:'';                       // Version 1
    if(!cancelBy&&isISO(c.endDate)&&c.noticeValue){
      const e=fromISO(c.endDate),n=Number(c.noticeValue);
      cancelBy=toISO(c.noticeUnit==='weeks'?addDays(e,-7*n):addMonths(e,-n));
    }
    if(cancelBy) s.tasks.push(mkTask({title:`${String(c.name).slice(0,40)} kündigen`,date:cancelBy,remindOn:remindDefault(cancelBy,7,false)}));
    s.contracts.push({id:c.id||uid(),name:String(c.name).slice(0,40),amount:round2(c.amount),
      rhythm:RHYTHM[c.rhythm]?c.rhythm:(RHYTHM[c.cycle]?c.cycle:'monthly'),nextDate:c.nextDate,
      color:Number.isInteger(c.color)&&c.color>=0&&c.color<COLORS.length?c.color:freeColor(s.contracts),
      trialEnd:isISO(c.trialEnd)?c.trialEnd:'',notified:isISO(c.notified)?c.notified:'',since:isISO(c.since)?c.since:''});
  }
  for(const t of arr('tasks')) if(t&&t.title&&isISO(t.date)) s.tasks.push(mkTask(t));
  for(const b of arr('bills')) if(b&&b.name&&isISO(b.due)&&b.amount>0)                       // Version 2: „Noch zu zahlen“
    s.tasks.push(mkTask({id:b.id,title:b.name,date:b.due,amount:b.amount,note:b.note,remindOn:b.remindOn,done:b.paid,doneAt:b.paidOn,notified:b.notified}));
  for(const r of arr('reminders')) if(r&&r.title&&isISO(r.date))                              // Version 2: „Erinnerungen“
    s.tasks.push(mkTask({id:r.id,title:r.title,date:r.date,note:r.note,remindOn:r.remindOn,done:fromISO(r.date)<today(),doneAt:fromISO(r.date)<today()?r.date:'',notified:r.notified}));
  for(const x of arr('expenses')){
    if(!x||!(x.amount>0)||!isISO(x.date)) continue;
    s.expenses.push({id:x.id||uid(),kind:x.kind==='in'?'in':'out',amount:round2(x.amount),cat:EXP_CATS.some(c=>c.id===x.cat)?x.cat:'sonstiges',date:x.date,
      note:String(x.note||'').slice(0,60),createdAt:Number(x.createdAt)||Date.now()});
  }
  const bud=raw.budgets&&typeof raw.budgets==='object'?raw.budgets:{};
  for(const c of EXP_CATS){ const v=Number(bud[c.id]); if(v>0) s.budgets[c.id]=round2(v); }
  for(const g of arr('goals')){
    if(!g||!g.name||!(g.target>0)) continue;
    const moves=(Array.isArray(g.moves)?g.moves:[]).filter(m=>m&&isISO(m.date)&&Number(m.amount)).map(m=>({id:m.id||uid(),date:m.date,amount:round2(m.amount)}));
    const start=Array.isArray(g.moves)?Math.max(0,round2(g.start)):Math.max(0,round2(g.saved));   // Version 2: „saved“
    s.goals.push({id:g.id||uid(),name:String(g.name).slice(0,40),target:round2(g.target),start,moves,
      until:isISO(g.until)?g.until:'',color:Number.isInteger(g.color)?Math.abs(g.color)%GOAL_COLORS.length:s.goals.length%GOAL_COLORS.length,
      icon:GOAL_ICONS.some(x=>x[0]===g.icon)?g.icon:guessGoalIcon(g.name)});
  }
  s.updatedAt=Number(raw.updatedAt)>0?Number(raw.updatedAt):0;     // wann zuletzt geändert (für den Abgleich mit dem Konto)
  s.owner=typeof raw.owner==='string'?raw.owner.slice(0,64):'';    // zu welchem Konto die Daten gehören
  return s;
}

// Anfrage an Supabase. Wirft einen Fehler mit .offline, .status und .code
async function sbFetch(path,{method='GET',body,token,prefer}={}){
  const h={apikey:SB_KEY,'Content-Type':'application/json'};
  if(token) h.Authorization='Bearer '+token;
  if(prefer) h.Prefer=prefer;
  const ctl=typeof AbortController!=='undefined'?new AbortController():null;
  const timer=ctl?setTimeout(()=>ctl.abort(),15000):0;
  let res;
  try{ res=await fetch(SB_URL+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body),signal:ctl?ctl.signal:undefined,cache:'no-store'}); }
  catch(e){ const er=new Error('offline'); er.offline=true; throw er; }
  finally{ clearTimeout(timer); }
  let text=''; try{ text=await res.text(); }catch(e){}
  let j=null; try{ j=text?JSON.parse(text):null; }catch(e){}
  if(!res.ok){
    const er=new Error(String((j&&(j.msg||j.error_description||j.message||j.error))||('HTTP '+res.status)));
    er.status=res.status; er.code=String((j&&(j.error_code||j.error||j.code))||''); throw er;
  }
  return j;
}
function toSession(j){ const u=j.user||{}; return {access_token:j.access_token,refresh_token:j.refresh_token,

// Gültiger Zugangsschlüssel; läuft er bald ab, wird er automatisch erneuert
let refreshing=null;
async function accessToken(force){
  if(!session){ const e=new Error('no session'); e.noSession=true; throw e; }
  if(!force&&session.expires_at-60>Date.now()/1000) return session.access_token;
  if(!refreshing) refreshing=(async()=>{
    try{ const j=await sbFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:session.refresh_token}}); saveSession(toSession(j)); }
    catch(e){ if(!e.offline&&[400,401,403].includes(e.status)) e.noSession=true; throw e; }
    finally{ refreshing=null; }
  })();
  await refreshing; return session.access_token;
}
async function sbUser(path,opts={}){
  let tok=await accessToken();
  try{ return await sbFetch(path,{...opts,token:tok}); }
  catch(e){ if(e.status===401){ tok=await accessToken(true); return await sbFetch(path,{...opts,token:tok}); } throw e; }
}

async function pull(){
  if(!ACCOUNTS||!session) return;
  if(stack.length||pulling){ pullWanted=true; return; }
  pulling=true;

let authMode='in', authEmail='';
function showAuth(mode='in',err='',ok=''){

function hideAuth(){ const a=$('#auth'); a.hidden=true; a.innerHTML=''; document.body.classList.remove('locked'); }
function authMsg(e){
  if(e&&e.offline) return 'Keine Verbindung zum Internet. Prüfe dein WLAN oder deine mobilen Daten.';
  const c=String(e&&e.code||''), m=String(e&&e.message||'').toLowerCase();
  if(c==='invalid_credentials'||c==='invalid_grant'||m.includes('invalid login')) return 'E-Mail oder Passwort ist falsch.';
  if(c==='email_not_confirmed'||m.includes('not confirmed')) return 'Bitte bestätige zuerst deine E-Mail. Den Link findest du in deinem Postfach.';
  if(c==='user_already_exists'||c==='email_exists'||m.includes('already registered')) return 'Für diese E-Mail gibt es schon ein Konto. Melde dich an.';
  if(c==='weak_password'||m.includes('password should')) return 'Das Passwort ist zu schwach. Nimm mindestens 8 Zeichen mit Buchstaben und Zahlen.';
  if(c==='same_password') return 'Das neue Passwort muss anders sein als das alte.';
  if(c==='email_address_invalid'||m.includes('invalid format')) return 'Diese E-Mail-Adresse ist ungültig.';
  if(e&&e.status===429||c.includes('rate_limit')) return 'Zu viele Versuche. Bitte warte ein paar Minuten.';
  if(c==='signup_disabled') return 'Neue Konten sind gerade ausgeschaltet.';
  if(c.startsWith('PGRST')||c==='42P01'||(e&&e.status===404)) return 'Die Datenbank ist noch nicht fertig eingerichtet (SQL-Schritt in Supabase).';
  return 'Das hat nicht geklappt. Bitte versuch es nochmal.';
}
function renderAuth(err='',ok=''){

    <div class="auth-card">

        ${m==='reset'?'':`<label class="field"><span class="label">E-Mail</span><input class="input" name="email" type="email" inputmode="email" autocomplete="${m==='up'?'email':'username'}" autocapitalize="off" spellcheck="false" placeholder="name@beispiel.de"></label>`}
        <label class="field"><span class="label">${m==='reset'?'Neues Passwort':'Passwort'}</span><input class="input" name="password" type="password" autocomplete="${m==='in'?'current-password':'new-password'}" placeholder="${m==='in'?'Dein Passwort':'Mindestens 8 Zeichen'}"></label>
        ${m==='in'?'':'<label class="field"><span class="label">Passwort wiederholen</span><input class="input" name="password2" type="password" autocomplete="new-password"></label>'}

        <button class="btn btn-main btn-full" type="submit" data-auth-submit>${m==='in'?'Anmelden':m==='up'?'Konto erstellen':'Passwort speichern'}</button>
        ${m==='in'?'<button type="button" class="link-btn auth-forgot" data-forgot>Passwort vergessen?</button>':''}
      </form></div>

  const a=$('#auth'), f=a.querySelector('[data-auth-form]');
  if(f.email) f.email.value=authEmail;
  a.querySelectorAll('[data-auth-mode]').forEach(b=>b.addEventListener('click',()=>{ if(f.email) authEmail=f.email.value.trim(); authMode=b.dataset.authMode; renderAuth(); }));
  const fg=a.querySelector('[data-forgot]'); if(fg) fg.addEventListener('click',()=>forgot(f));

function authInfo(f,err,ok){
  const e=f.querySelector('.err'), o=f.querySelector('.ok-msg');
  e.textContent=err||''; e.hidden=!err; o.textContent=ok||''; o.hidden=!ok;

function authBusy(f,on){ const b=f.querySelector('[data-auth-submit]'); b.disabled=on; if(on){ b.dataset.label=b.textContent; b.textContent='Einen Moment …'; } else if(b.dataset.label) b.textContent=b.dataset.label; }
async function authSubmit(f){
  const m=authMode, email=f.email?f.email.value.trim().toLowerCase():'', pw=f.password.value, pw2=f.password2?f.password2.value:'';
  if(f.email) authEmail=email;
  if(m!=='reset'&&!emailOk(email)) return authInfo(f,'Bitte gib deine E-Mail-Adresse ein, zum Beispiel name@beispiel.de.');
  if(!pw) return authInfo(f,m==='in'?'Bitte gib dein Passwort ein.':'Bitte wähle ein Passwort.');
  if(m!=='in'&&pw.length<8) return authInfo(f,'Das Passwort braucht mindestens 8 Zeichen.');
  if(m!=='in'&&pw!==pw2) return authInfo(f,'Die beiden Passwörter sind nicht gleich.');
  authInfo(f,''); authBusy(f,true);
  try{
    let name='';
    if(m==='in'){ saveSession(toSession(await sbFetch('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password:pw}}))); }
    else if(m==='up'){
      name=f.name.value.trim().slice(0,30);
      const j=await sbFetch('/auth/v1/signup',{method:'POST',body:{email,password:pw,data:{name}}});
      if(!j||!j.access_token){ authMode='in'; renderAuth('','Fast geschafft: Wir haben dir eine E-Mail geschickt. Tippe auf den Link darin und melde dich dann hier an.'); return; }
      saveSession(toSession(j));
    }
    else await sbUser('/auth/v1/user',{method:'PUT',body:{password:pw}});
    await afterLogin();
    if(name&&!data.settings.name){ data.settings.name=name; save(); draw(); }
    toast(m==='up'?'Konto erstellt':m==='reset'?'Neues Passwort gespeichert':'Angemeldet');
  }catch(e){ if(!$('#auth').hidden){ authBusy(f,false); authInfo(f,authMsg(e)); } else { showAuth('in',authMsg(e)); } }
}
async function forgot(f){
  const email=f.email.value.trim().toLowerCase(); authEmail=email;
  if(!emailOk(email)) return authInfo(f,'Gib oben deine E-Mail-Adresse ein. Dann schicken wir dir einen Link.');

    await sbFetch('/auth/v1/recover?redirect_to='+encodeURIComponent(appUrl()),{method:'POST',body:{email}});

}

function readAuthHash(){
  const h=location.hash.replace(/^#/,'');
  if(!h||!/(^|&)(access_token|error|error_code)=/.test(h)) return null;
  try{ history.replaceState(history.state,'',location.pathname+location.search); }catch(e){}
  const o={}; new URLSearchParams(h).forEach((v,k)=>{o[k]=v;}); return o;
}

  if(h&&h.access_token){
    const tmp={access_token:h.access_token,refresh_token:h.refresh_token||'',expires_at:Number(h.expires_at)||Math.floor(Date.now()/1000)+(Number(h.expires_in)||3600),user:{id:'',email:''}};
    try{ const u=await sbFetch('/auth/v1/user',{token:h.access_token}); tmp.user={id:u.id,email:u.email||''}; saveSession(tmp); }

/* =====================================================================
   Rechnen: Abos & Verträge
   ===================================================================== */
const payDate=(c,k)=>addMonths(fromISO(c.nextDate),k*RHYTHM[c.rhythm].months);
const inTrial=c=>!!c.trialEnd&&fromISO(c.trialEnd)>=today();               // Probe-Abo läuft noch
const monthlyOf=c=>c.amount/RHYTHM[c.rhythm].months;                         // auf einen Monat umgerechnet
// Alle Abbuchungen zwischen zwei Tagen (beide Tage zählen mit). Während eines Probe-Abos wird nichts abgebucht.
function paymentsBetween(c,from,to){
  const a=fromISO(c.nextDate), step=RHYTHM[c.rhythm].months, out=[], te=c.trialEnd?fromISO(c.trialEnd):null;
  let k=Math.floor(((from.getFullYear()-a.getFullYear())*12+(from.getMonth()-a.getMonth()))/step)-1;
  for(let i=0;i<400;i++,k++){const d=payDate(c,k);if(d>to)break;if(d>=from&&(!te||d>te))out.push(d);}
  return out;
}
const nextPay=c=>{const t=today();return paymentsBetween(c,t,addMonths(t,13))[0]||null;};

/* =====================================================================
   Rechnen: Gehalt und Zeitraum
   ===================================================================== */
function paydayIn(y,m,day){const f=new Date(y,m,1);const last=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();return new Date(f.getFullYear(),f.getMonth(),Math.min(day,last));}
function paydaysBetween(i,from,to){const out=[];for(let k=0;k<600;k++){const d=paydayIn(from.getFullYear(),from.getMonth()+k,i.payday);if(d>to)break;if(d>=from)out.push(d);}return out;}
const USE_PAYDAY=false;                                          // Zahltag-Auswahl vorerst aus: gerechnet wird vom 1. bis zum Monatsende
const payOf=i=>USE_PAYDAY?i.payday:0;                            // gespeicherter Zahltag bleibt erhalten, zählt aber nicht
const mainIncome=()=>data.incomes.filter(i=>payOf(i)).sort((a,b)=>b.amount-a.amount)[0]||null;
// Zeitraum: von Gehalt zu Gehalt. Ohne Zahltag: der aktuelle Monat. „end“ ist der erste Tag danach.
function period(){
  const t=today(), i=mainIncome();
  if(i){
    let start=paydayIn(t.getFullYear(),t.getMonth(),i.payday);
    if(start>t) start=paydayIn(t.getFullYear(),t.getMonth()-1,i.payday);
    const end=paydayIn(start.getFullYear(),start.getMonth()+1,i.payday);
    return {start,end,last:addDays(end,-1),main:i};
  }
  const start=new Date(t.getFullYear(),t.getMonth(),1), end=new Date(t.getFullYear(),t.getMonth()+1,1);
  return {start,end,last:addDays(end,-1),main:null};
}
// Anfang jedes Zeitraums zwischen zwei Tagen (Einnahmen ohne Zahltag werden dort gebucht)
function periodStarts(from,to){
  const m=mainIncome(), out=[];
  for(let k=0;k<600;k++){
    const d=m?paydayIn(from.getFullYear(),from.getMonth()+k,m.payday):new Date(from.getFullYear(),from.getMonth()+k,1);
    if(d>to) break; if(d>=from) out.push(d);
  }
  return out;
}
// Neue Einnahmen und Abos zählen ab dem Anfang des aktuellen Zeitraums als Buchung
function fillSince(){
  const s=toISO(period().start); let changed=false;
  for(const x of [...data.incomes,...data.contracts]) if(!x.since){ x.since=s; changed=true; }
  return changed;
}

/* =====================================================================
   Rechnen: Was ist noch übrig?
   Einnahmen − Abos & Verträge − Zahlungen − Ausgaben − Gespartes = Übrig
   (alles im aktuellen Zeitraum, also von Gehalt zu Gehalt)
   ===================================================================== */
function plan(){
  const p=period(), t=today(), sI=toISO(p.start), lI=toISO(p.last);
  const inP=iso=>iso>=sI&&iso<=lI;
  const incomes=[...data.incomes].sort((a,b)=>b.amount-a.amount);
  const extras=data.expenses.filter(x=>x.kind==='in'&&inP(x.date));
  const extra=round2(sum(extras.map(x=>x.amount)));
  const income=round2(sum(incomes.map(i=>i.amount))+extra);
  const fixedList=[];
  data.contracts.forEach(c=>paymentsBetween(c,p.start,p.last).forEach(d=>fixedList.push({c,date:d,amount:c.amount})));
  fixedList.sort((a,b)=>a.date-b.date);
  const fixed=round2(sum(fixedList.map(x=>x.amount)));
  // Zahlungen aus „Termine“: alles in diesem Zeitraum und alles Offene von früher
  const payList=data.tasks.filter(x=>x.amount>0&&(inP(x.date)||(!x.done&&x.date<sI))).sort((a,b)=>a.date<b.date?-1:1);
  const pays=round2(sum(payList.map(x=>x.amount)));
  const exp=data.expenses.filter(x=>x.kind!=='in'&&inP(x.date));
  const spent=round2(sum(exp.map(x=>x.amount)));
  const moves=[]; data.goals.forEach(g=>g.moves.forEach(m=>{ if(inP(m.date)) moves.push({g,amount:m.amount}); }));
  const saved=round2(sum(moves.map(m=>m.amount)));
  const left=round2(income-fixed-pays-spent-saved);
  const days=Math.max(1,daysBetween(t,p.end));
  const total=Math.max(1,daysBetween(p.start,p.end));
  return {...p,incomes,extras,extra,income,fixedList,fixed,payList,pays,expCount:exp.length,spent,moves,saved,left,days,
    perDay:round2(left/days),progress:Math.min(1,Math.max(0,daysBetween(p.start,t)/total))};
}

/* =====================================================================
   Rechnen: Ausgaben und Sparziele
   ===================================================================== */
const monthPrefix=(y,m)=>{const d=new Date(y,m,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-`;};
const expensesIn=(y,m)=>data.expenses.filter(x=>x.kind!=='in'&&x.date.startsWith(monthPrefix(y,m)));
const catSpent=(y,m,cat)=>round2(sum(expensesIn(y,m).filter(x=>x.cat===cat).map(x=>x.amount)));
const goalSaved=g=>round2(g.start+sum(g.moves.map(m=>m.amount)));

/* =====================================================================
   Buchungen: alles, was Geld bewegt (eingetragen oder automatisch)
   ===================================================================== */
function bookings(from,to){
  const out=[], F=toISO(from), T=toISO(to), inR=iso=>iso>=F&&iso<=T;
  // ab wann automatisch gebucht wird (ohne Zahltag: ab dem 1. des Monats, so wie auch gerechnet wird)
  const startOf=x=>{let s=x.since?fromISO(x.since):from; if(!mainIncome()) s=new Date(s.getFullYear(),s.getMonth(),1); return s>from?s:from;};
  for(const x of data.expenses) if(inR(x.date)){
    if(x.kind==='in') out.push({iso:x.date,dir:'in',type:'extra',name:x.note||'Einnahme',sub:'Einnahme',amount:x.amount,icon:'arrowIn',color:'var(--green)',open:'expense:'+x.id,t:x.createdAt});
    else { const c=catOf(x.cat); out.push({iso:x.date,dir:'out',type:'spent',cat:c.id,name:x.note||c.label,sub:c.label,amount:x.amount,icon:c.icon,color:c.color,open:'expense:'+x.id,t:x.createdAt}); }
  }
  for(const i of data.incomes){
    const a=startOf(i); if(a>to) continue;
    (payOf(i)?paydaysBetween(i,a,to):periodStarts(a,to)).forEach(d=>out.push({iso:toISO(d),dir:'in',type:'income',name:i.name,sub:'Einnahme',amount:i.amount,icon:'arrowIn',color:'var(--green)',open:'income:'+i.id,t:1}));
  }
  for(const c of data.contracts){
    const a=startOf(c); if(a>to) continue;
    paymentsBetween(c,a,to).forEach(d=>out.push({iso:toISO(d),dir:'out',type:'fixed',name:c.name,sub:'Abo & Vertrag',amount:c.amount,icon:'repeat',color:COLORS[c.color],open:'contract:'+c.id,t:0}));
  }
  for(const x of data.tasks) if(x.done&&x.amount>0){
    const iso=x.doneAt&&x.doneAt<x.date?x.doneAt:x.date;
    if(inR(iso)) out.push({iso,dir:'out',type:'pays',name:x.title,sub:'Zahlung',amount:x.amount,icon:'calendar',color:PART.pays,open:'task:'+x.id,t:0});
  }
  for(const g of data.goals) for(const m of g.moves) if(inR(m.date))
    out.push({iso:m.date,dir:'save',type:'saved',name:g.name,sub:m.amount>0?'Ins Sparziel gelegt':'Aus dem Sparziel genommen',amount:Math.abs(m.amount),
      sign:m.amount>0?'−':'+',icon:(GOAL_ICONS.find(z=>z[0]===g.icon)||GOAL_ICONS[0])[2],color:GOAL_COLORS[g.color%GOAL_COLORS.length],open:'goal:'+g.id,t:0});
  return out.sort((a,b)=>a.iso<b.iso?1:a.iso>b.iso?-1:(b.t||0)-(a.t||0));
}
/* =====================================================================
   Erinnerungen und Nachrichten
   ===================================================================== */
const remindDay=a=>fromISO(a.remindOn);
const notifyAt=a=>{const d=remindDay(a);return new Date(d.getFullYear(),d.getMonth(),d.getDate(),NOTIFY_HOUR,0,0);};
function alerts(){
  return [
    ...data.tasks.filter(x=>!x.done).map(x=>({id:x.id,ref:x,title:x.title,remindOn:x.remindOn,due:today()>=remindDay(x),
      text:()=>(x.amount?`${eur(x.amount)} – `:'')+whenText(x.date)+(x.note?` – ${x.note}`:'')})),
    ...data.contracts.filter(inTrial).map(c=>({id:c.id+'-probe',ref:c,title:`Probe-Abo: ${c.name}`,remindOn:remindDefault(c.trialEnd,3),
      due:today()>=addDays(fromISO(c.trialEnd),-3),
      text:()=>`Kostenlos bis ${shortDate(fromISO(c.trialEnd))}, danach ${eur(c.amount)} ${RHYTHM[c.rhythm].label.toLowerCase()}. Kündige vorher, wenn du es nicht behalten willst.`})),
  ];
}
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const nativeLN=()=>{try{const C=window.Capacitor;return C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.LocalNotifications||null;}catch(e){return null;}};
const numId=s=>{let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h)%2000000000+1;};
let channelReady=false;
// Handy-App: echte Nachricht zur geplanten Zeit. PC: Nachricht, sobald die App offen ist. iPhone: Hinweis in der App.
async function syncNotifications(ask){
  const LN=nativeLN();
  if(LN){
    try{
      let perm=await LN.checkPermissions();
      if(perm.display!=='granted'&&ask) perm=await LN.requestPermissions();
      if(perm.display!=='granted') return;
      if(!channelReady){ try{ await LN.createChannel({id:'erinnerungen',name:'Erinnerungen',importance:4}); }catch(e){} channelReady=true; }
      const pending=await LN.getPending();
      if(pending&&pending.notifications&&pending.notifications.length) await LN.cancel({notifications:pending.notifications.map(n=>({id:n.id}))});
      const now=new Date();
      const list=alerts().filter(a=>notifyAt(a)>now).sort((a,b)=>notifyAt(a)-notifyAt(b)).slice(0,60);
      if(list.length) await LN.schedule({notifications:list.map(a=>({id:numId(a.id),title:a.title,body:a.text(),
        schedule:{at:notifyAt(a),allowWhileIdle:true},channelId:'erinnerungen'}))});
    }catch(e){ console.warn('Nachrichten:',e); }
    return;
  }
  if(isIOS||!('Notification' in window)) return;
  try{ if(Notification.permission==='default'&&ask) await Notification.requestPermission(); }catch(e){ return; }
  showDueNotifications();
}
function showDueNotifications(){
  if(nativeLN()||isIOS||!('Notification' in window)) return;
  let perm; try{ perm=Notification.permission; }catch(e){ return; }
  if(perm!=='granted') return;
  const t=toISO(today()); let changed=false;
  for(const a of alerts()){
    if(!a.due||a.ref.notified===t||new Date()<notifyAt(a)) continue;
    try{ new Notification(a.title,{body:a.text(),tag:a.id}); a.ref.notified=t; changed=true; }catch(e){}
  }
  if(changed) save();
}

// Eine Buchung als Zeile
function bookSub(b){
  const kind=b.type==='spent'?(b.name===b.sub?'':b.sub):b.type==='fixed'?'Abo':b.type==='pays'?'Zahlung':b.type==='saved'?b.sub:'';
  return [kind,dayShort(b.iso),b.state].filter(Boolean).join(' · ');
}
function bookRow(b,mode=''){
  const sign=b.dir==='in'?'+':b.dir==='out'?'−':b.sign, cls=b.dir==='in'?'plus':b.dir==='out'?'neg':'';
  const sub=mode==='planned'?`geplant · ${dayText(fromISO(b.iso))}`:bookSub(b);
  return `<li><button class="item book ${mode==='planned'||b.state?'planned':''}" data-open="${b.open}"><span class="b-icon" style="--c:${b.color}">${ICON[b.icon]||ICON.dots}</span>
    <span class="item-main"><div class="item-name">${esc(b.name)}</div><div class="item-sub">${esc(sub)}</div></span>
    <span class="item-amt ${cls}">${sign}${eur(b.amount)}</span></button></li>`;
}
// Termin mit Haken zum Abhaken
function taskRow(x){
  const late=!x.done&&x.date<toISO(today()), rem=!x.done&&today()>=remindDay(x);
  return `<li class="pay-row ${x.done?'done':''}"><button type="button" class="check" data-check="${x.id}" aria-pressed="${x.done}" aria-label="${esc(x.title)}: ${x.done?'wieder öffnen':'als erledigt abhaken'}"><span class="ring">${ICON.check}</span></button>
    <button class="item" data-task="${x.id}"><span class="item-main"><div class="item-name">${esc(x.title)}</div>
      <div class="item-sub ${x.done?'':late?'late':rem?'soon':''}">${x.done?`Erledigt${x.doneAt?' am '+shortDate(fromISO(x.doneAt)):''}`:esc(whenText(x.date))}</div>
      ${x.note?`<div class="item-sub">${esc(x.note)}</div>`:''}</span>
      ${x.amount?`<span class="item-amt">${eur(x.amount)}</span>`:''}</button></li>`;
}
const addRow=(attr,label)=>`<li><button class="item add-row" ${attr}><span class="plus-ic">${ICON.plus}</span>${label}</button></li>`;
const openTasks=()=>data.tasks.filter(x=>!x.done).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
const doneTasks=()=>data.tasks.filter(x=>x.done).sort((a,b)=>(a.doneAt||a.date)<(b.doneAt||b.date)?1:-1).slice(0,20);

/* ---------- Reiter: Start ---------- */
function drawStart(){
  const P=plan(), t=today(), ty=t.getFullYear(), tm=t.getMonth(), name=data.settings.name;
  const hello=`<header class="hello"><div><h1>Hallo${name?`, ${esc(name)}`:''}!</h1><p>Schön, dass du da bist!</p></div></header>`;

  // Geld-Karte: wie viel noch übrig ist
  let card;
  if(!data.incomes.length){
    card=`<section class="budget"><span class="b-top"><span class="b-label">Verfügbares Geld</span><span class="b-ic">${ICON.wallet}</span></span>
      <p class="b-empty">Trag dein Gehalt ein. Dann siehst du hier, wie viel Geld du noch ausgeben kannst.</p>
      <button type="button" class="btn btn-main btn-full" data-add-income>${ICON.plus}Gehalt eintragen</button></section>`;
  } else {
    const isPayday=P.main&&toISO(P.start)===toISO(t);
    const when=P.main
      ?(isPayday?`Heute kommt: ${esc(P.main.name)}`:P.days===1?`${esc(P.main.name)} kommt morgen`:`${esc(P.main.name)} kommt in ${P.days} Tagen`)
      :(P.days===1?'Letzter Tag im Monat':`Noch ${P.days} Tage im Monat`);
    const pct=P.income>0?Math.max(0,Math.min(1,P.left/P.income)):0;
    card=`<section class="budget">
      <span class="b-top"><span class="b-label">${P.main?'Verfügbar bis zum Gehalt':`Verfügbar im ${esc(monthName(ty,tm))}`}</span><span class="b-ic">${ICON.wallet}</span></span>
      <span class="b-num ${P.left<0?'minus':''}">${P.left<0?'−':''}${eur(Math.abs(P.left))}</span>
      <span class="b-of">von ${eur(P.income)} Einnahmen</span>
      <span class="bar b-bar" aria-hidden="true"><span style="width:${P.left<0?100:(pct*100).toFixed(1)}%"></span></span>
      <span class="b-foot"><span>${when}</span></span></section>`;
  }

  // Hinweise: Budget überschritten, Probe-Abo endet bald
  const over=EXP_CATS.filter(c=>data.budgets[c.id]&&catSpent(ty,tm,c.id)>data.budgets[c.id]);
  const trials=data.contracts.filter(c=>inTrial(c)&&daysBetween(t,fromISO(c.trialEnd))<=3);
  const warns=over.map(c=>`<button type="button" class="warn-card" data-tab-go="stats">${ICON.alert}<span><b>Budget überschritten:</b> ${esc(c.label)}
      (${eur(catSpent(ty,tm,c.id))} von ${eur(data.budgets[c.id])})</span></button>`).join('')
    +trials.map(c=>{const n=daysBetween(t,fromISO(c.trialEnd));
      return `<button type="button" class="warn-card yellow" data-contract="${c.id}">${ICON.bell}<span><b>Probe-Abo ${esc(c.name)}</b> endet ${n===0?'heute':n===1?'morgen':`in ${n} Tagen`}.
        Danach kostet es ${eur(c.amount)}. Kündige vorher, wenn du es nicht willst.</span></button>`;}).join('');

  // Monatsübersicht
  const ov=(icon,cls,label,val,sign,attr)=>`<li><button type="button" class="ov" ${attr}><span class="ic ${cls}">${ICON[icon]}</span>
    <span class="ov-name">${label}</span><b class="${sign==='+'&&val?'plus':''}">${val?sign:''}${eur(Math.abs(val))}</b>${ICON.right}</button></li>`;
  const overview=`<section class="card">
    <div class="card-head"><h2>Monatsübersicht</h2><small>${esc(shortDate(P.start))} – ${esc(shortDate(P.last))}</small></div>
    <ul class="ov-list">
      ${ov('arrowIn','ic-green','Einnahmen',P.income,'+','data-sub="incomes"')}
      ${ov('repeat','ic-blue','Abos &amp; Verträge',P.fixed,'−','data-sub="abos"')}
      ${ov('cart','ic-red','Ausgaben',P.spent,'−','data-tab-go="stats"')}
      ${P.pays?ov('calendar','ic-orange','Zahlungen',P.pays,'−','data-sub="tasks"'):''}
      ${ov('coins','ic-teal','Gespart',P.saved,P.saved<0?'+':'−','data-tab-go="goals"')}
    </ul></section>`;

  // Termine
  const open=openTasks(), shown=open.slice(0,3);
  const openSum=round2(sum(open.map(x=>x.amount)));
  const tasks=`<div class="sec-head"><h2>Termine</h2>${data.tasks.length?`<button class="sec-link" data-sub="tasks">${open.length>3?`Alle ${open.length}`:'Alle'}</button>`:''}</div>
    <ul class="list">${shown.map(taskRow).join('')}${addRow('data-add-task','Termin hinzufügen')}</ul>
    ${openSum?`<p class="page-sub" style="margin:8px 6px 0">Offen zu zahlen: <b>${eur(openSum)}</b></p>`:''}`;

  // Letzte Buchungen
  const last=bookings(addDays(t,-92),t).slice(0,5);
  const recent=`<div class="sec-head"><h2>Letzte Buchungen</h2>${last.length?'<button class="sec-link" data-tab-go="list">Alle</button>':''}</div>
    ${last.length?`<ul class="list">${last.map(b=>bookRow(b,'date')).join('')}</ul>`
      :'<p class="empty-line">Noch keine Buchungen. Tippe unten rechts auf „Eintragen“.</p>'}`;

  $('#view').innerHTML=hello+card+warns+overview+tasks+recent;
}

/* ---------- Reiter: Buchungen ---------- */
let searchOpen=false;
function drawList(){
  const open=searchOpen||!!listQuery;
  $('#view').innerHTML=`<div class="page-head"><h1 class="page-title">Buchungen</h1>
      <button type="button" class="icon-round" data-search-toggle aria-label="${open?'Suche schließen':'Suchen'}" aria-pressed="${open}">${open?ICON.x:ICON.search}</button></div>
    ${open?`<label class="search">${ICON.search}<input type="search" data-search placeholder="Suchen" value="${esc(listQuery)}" autocomplete="off" enterkeyhint="search" aria-label="Buchungen suchen"></label>`:''}
    <div id="blist"></div>`;
  const inp=$('[data-search]');
  if(inp){ inp.addEventListener('input',()=>{ listQuery=inp.value; renderList(); }); if(!listQuery) setTimeout(()=>{try{inp.focus();}catch(e){}},60); }
  renderList();
}
function renderList(){
  const box=$('#blist'); if(!box) return;
  const q=listQuery.trim().toLowerCase(), t=today();
  const pass=b=>(listFilter==='all'||b.dir===listFilter)&&(!q||b.name.toLowerCase().includes(q)||b.sub.toLowerCase().includes(q));
  const filters=`<div class="seg list-seg" role="group" aria-label="Filter">${[['all','Alle'],['in','Einnahmen'],['out','Ausgaben']].map(([v,l])=>
    `<button type="button" data-filter="${v}" aria-pressed="${listFilter===v}">${l}</button>`).join('')}</div>`;
  if(q){
    const hits=[...monthBooks(t.getFullYear(),t.getMonth()).filter(b=>b.state),...bookings(new Date(2000,0,1),t)].filter(pass);
    box.innerHTML=filters+(hits.length?`<p class="page-sub">${plural(hits.length,'Treffer','Treffer')}</p><ul class="list">${hits.map(b=>bookRow(b)).join('')}</ul>`
      :`<p class="empty-line">Nichts gefunden für „${esc(listQuery.trim())}“.</p>`);
    return;
  }
  const {y,m}=listMonth, from=new Date(y,m,1), lastDay=new Date(y,m+1,0), isNow=y===t.getFullYear()&&m===t.getMonth();
  const all=monthBooks(y,m);   // alles im Monat: Ausgaben, Einnahmen, Abos, Zahlungen, Gespart – auch was noch kommt
  const inSum=round2(sum(all.filter(b=>b.dir==='in').map(b=>b.amount))), outSum=round2(sum(all.filter(b=>b.dir==='out').map(b=>b.amount)));
  const list=all.filter(pass);
  const none=listFilter==='in'?'Keine Einnahmen':listFilter==='out'?'Keine Ausgaben':'Keine Buchungen';
  box.innerHTML=`<section class="card month-card">
      <div class="mc-nav"><button class="icon-btn" data-month="-1" aria-label="Monat zurück">${ICON.left}</button>
        <button type="button" class="mc-title" data-pick-month aria-label="Monat wählen">${esc(monthName(y,m))} ${y}${ICON.down}</button><button class="icon-btn" data-month="1" aria-label="Monat vor" ${isNow?'disabled':''}>${ICON.right}</button></div>
      <div class="mc-sums"><div><span>Einnahmen</span><b class="${inSum?'plus':''}">${inSum?'+':''}${eur(inSum)}</b></div><div><span>Ausgaben</span><b class="${outSum?'neg':''}">${outSum?'−':''}${eur(outSum)}</b></div></div></section>
    ${filters}
    ${list.length?`<ul class="list">${list.map(b=>bookRow(b)).join('')}</ul>`:`<p class="empty-line">${none} im ${esc(monthName(y,m))}${y!==t.getFullYear()?' '+y:''}.</p>`}`;
}

// Schnell zu einem Monat springen: Jahr wählen, dann Monat antippen
const MONTHS_SHORT=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const WHEEL_ROW=44;   // Höhe einer Zeile im Jahres-Drehrad
function monthPickerWin(){
  const t=today(), years=[]; for(let y=2000;y<=t.getFullYear();y++) years.push(y);
  let year=listMonth.y, wheelOpen=false;
  win('Monat wählen',`<button type="button" class="yp-btn" data-yp-toggle aria-expanded="false"><span data-year></span>${ICON.down}</button>
    <div class="wheel" data-wheel hidden><div class="wheel-band"></div>
      <div class="wheel-scroll" data-wheel-scroll><div class="wheel-pad"></div>${years.map(y=>`<div class="wheel-item" data-wy="${y}">${y}</div>`).join('')}<div class="wheel-pad"></div></div></div>
    <div class="mp" data-months></div>
    <button type="button" class="btn btn-soft btn-full" data-mp-now>Dieser Monat</button>`,s=>{
    const wheel=s.querySelector('[data-wheel]'), sc=s.querySelector('[data-wheel-scroll]'), tg=s.querySelector('[data-yp-toggle]');
    const render=()=>{
      s.querySelector('[data-year]').textContent=year;
      s.querySelector('[data-months]').innerHTML=MONTHS_SHORT.map((l,i)=>`<button type="button" data-m="${i}" aria-label="${esc(monthName(year,i))} ${year}"
        aria-pressed="${year===listMonth.y&&i===listMonth.m}" ${year===t.getFullYear()&&i>t.getMonth()?'disabled':''}>${l}</button>`).join('');
    };
    const mark=()=>{ const idx=Math.max(0,Math.min(years.length-1,Math.round(sc.scrollTop/WHEEL_ROW)));
      sc.querySelectorAll('.wheel-item').forEach((el,k)=>el.classList.toggle('on',k===idx)); return years[idx]; };
    let settle=0;
    sc.addEventListener('scroll',()=>{ const y=mark(); clearTimeout(settle); settle=setTimeout(()=>{ if(y!==year){ year=y; render(); } },120); },{passive:true});
    const openWheel=on=>{
      wheelOpen=on; wheel.hidden=!on; tg.setAttribute('aria-expanded',on); tg.classList.toggle('open',on);
      if(on){ sc.scrollTop=years.indexOf(year)*WHEEL_ROW; mark(); }
    };
    const pick=(y,m)=>{ listMonth={y,m}; closeWin(1); renderList(); };
    s.addEventListener('click',e=>{
      const it=e.target.closest('[data-wy]');
      if(it){ clearTimeout(settle); year=Number(it.dataset.wy); render(); openWheel(false); return; }   // Jahr antippen: auswählen und Drehrad schließen
      const b=e.target.closest('button'); if(!b||b.disabled) return;
      if(b.hasAttribute('data-yp-toggle')) openWheel(!wheelOpen);
      else if(b.dataset.m) pick(year,Number(b.dataset.m));
      else if(b.hasAttribute('data-mp-now')) pick(t.getFullYear(),t.getMonth());
    });
    render();
  });
}

/* ---------- Reiter: Analyse ---------- */
// Alles, was in einem Monat passiert – genau wie in der Monatsübersicht auf Start:
// Einnahmen, Ausgaben, Abos & Verträge, Zahlungen und Gespartes. Der aktuelle Monat zählt ganz (auch was noch kommt).
function monthBooks(y,m){
  const t=today(), from=new Date(y,m,1), last=new Date(y,m+1,0);
  if(from>t) return [];
  const T=toISO(t), list=bookings(from,last).map(b=>b.iso>T?{...b,state:'geplant'}:b);   // kommt noch in diesem Monat
  if(y===t.getFullYear()&&m===t.getMonth()){
    const L=toISO(last);
    for(const x of data.tasks) if(!x.done&&x.amount>0&&x.date<=L)    // offene Zahlungen: diesen Monat oder überfällig
      list.push({iso:x.date,dir:'out',type:'pays',name:x.title,sub:'Zahlung',amount:x.amount,icon:'calendar',color:PART.pays,open:'task:'+x.id,t:0,state:x.date>T?'geplant':'offen'});
  }
  return list.sort((a,b)=>a.iso<b.iso?1:a.iso>b.iso?-1:(b.t||0)-(a.t||0));
}
const monthTotals=list=>{ let i=0,o=0,sv=0;
  for(const b of list){ if(b.dir==='in') i+=b.amount; else if(b.dir==='out') o+=b.amount; else sv+=b.sign==='−'?b.amount:-b.amount; }
  return {i:round2(i),o:round2(o),s:round2(sv)}; };
// Gruppen: Ausgaben nach Kategorie, Abos und Zahlungen extra, Einnahmen nach Name
const groupKey=b=>b.dir==='in'?(b.type==='income'?b.open:'x:'+b.name):b.type==='spent'?b.cat:b.type;
function groupMeta(k,b){
  if(b&&b.dir==='in') return {label:b.name,color:'var(--green)',icon:'arrowIn'};
  if(k==='fixed') return {label:'Abos & Verträge',color:PART.fixed,icon:'repeat'};
  if(k==='pays') return {label:'Zahlungen',color:PART.pays,icon:'calendar'};
  const c=catOf(k); return {label:c.label,color:c.color,icon:c.icon};
}
function groupParts(list){
  const map=new Map();
  for(const b of list){ const k=groupKey(b); const g=map.get(k)||{k,v:0,n:0,...groupMeta(k,b)}; g.v=round2(g.v+b.amount); g.n++; map.set(k,g); }
  return [...map.values()].sort((a,b)=>b.v-a.v);
}
function catRow(c,y,m){
  const sp=catSpent(y,m,c.id), b=data.budgets[c.id];
  let fill=0, color=c.color, note;
  if(b){ const r=sp/b; fill=Math.min(1,r); color=r>1?'var(--red)':r>=0.8?'var(--warn)':c.color;
    note=r>1?`<span class="cat-note over">${eur(round2(sp-b))} über dem Budget</span>`:`<span class="cat-note ${r>=0.8?'warn':''}">Noch ${eur(round2(b-sp))} von ${eur(b)} übrig</span>`; }
  else note=`<span class="cat-note">Kein Budget</span>`;
  return `<button type="button" class="cat-row" data-budget="${c.id}"><span class="cat-top"><span class="dot" style="background:${c.color}"></span>
    <span class="name">${esc(c.label)}</span><b>${eur(sp)}</b>${b?`<small>/ ${eur(b)}</small>`:''}</span>
    <span class="bar"><span style="width:${(fill*100).toFixed(1)}%;background:${color}"></span></span>${note}</button>`;
}
function drawStats(){
  const t=today(), sy=statAnchor.getFullYear(), sm=statAnchor.getMonth();
  // 1) Die letzten 12 Monate: grün = Einnahmen, rot = Ausgaben
  const months=[];
  for(let k=11;k>=0;k--){ const d=new Date(t.getFullYear(),t.getMonth()-k,1), y=d.getFullYear(), m=d.getMonth(); months.push({y,m,...monthTotals(monthBooks(y,m))}); }
  const maxV=Math.max(0,...months.map(x=>Math.max(x.i,x.o))), top=months.reduce((a,b)=>b.o>a.o?b:a,months[0]);
  const past=months.slice(0,11).filter(x=>x.o>0), avg=past.length?round2(sum(past.map(x=>x.o))/past.length):0;
  const h=v=>v>0&&maxV?Math.max(3,v/maxV*100).toFixed(1):0;
  const chart=`<section class="card"><h2>Pro Monat</h2>
    ${top.o>0?`<div class="mstats"><button type="button" data-stat-month="${top.y}-${top.m}"><span>Meiste Ausgaben</span><b>${esc(monthName(top.y,top.m))} · ${eur(top.o)}</b></button>
      ${avg?`<div><span>Ausgaben im Schnitt</span><b>${eur(avg)}</b></div>`:''}</div>`:''}
    <div class="mlegend"><span><i class="in"></i>Einnahmen</span><span><i class="out"></i>Ausgaben</span></div>
    <div class="mchart">${months.map(x=>`<button type="button" class="mcol ${x.y===sy&&x.m===sm?'sel':''}" data-stat-month="${x.y}-${x.m}" aria-label="${esc(monthName(x.y,x.m))} ${x.y}: Einnahmen ${eur(x.i)}, Ausgaben ${eur(x.o)}">
      <span class="mcol-wrap"><span class="mcol-bar in" style="height:${h(x.i)}%"></span><span class="mcol-bar out" style="height:${h(x.o)}%"></span></span>
      <span class="mcol-lbl">${MONTHS_SHORT[x.m]}</span></button>`).join('')}</div></section>`;
  // 2) Der gewählte Monat genauer
  const books=monthBooks(sy,sm), T=monthTotals(books), left=round2(T.i-T.o-T.s);
  const pd=new Date(sy,sm-1,1), prev=monthTotals(monthBooks(pd.getFullYear(),pd.getMonth())).o, diff=round2(T.o-prev), pName=monthName(pd.getFullYear(),pd.getMonth());
  const cmp=!T.o||!prev?'':diff>0?`<span class="cmp up">↑ ${eur(diff)} mehr ausgegeben als im ${esc(pName)}</span>`
    :diff<0?`<span class="cmp down">↓ ${eur(-diff)} weniger ausgegeben als im ${esc(pName)}</span>`:`<span class="cmp same">Genauso viel ausgegeben wie im ${esc(pName)}</span>`;
  const rows=(parts,total,dir)=>`<ul class="crows">${parts.map(p=>{
    const pct=total?Math.round(p.v/total*100):0, b=dir==='out'&&data.budgets[p.k];
    const bud=b?(p.v>b?`<span class="over">${eur(round2(p.v-b))} über dem Budget</span>`:`Budget ${eur(b)}`):'';
    return `<li><button type="button" class="crow" data-cat-detail="${esc(p.k)}"><span class="b-icon" style="--c:${p.color}">${ICON[p.icon]||ICON.dots}</span>
      <span class="crow-main"><span class="crow-top"><span class="crow-name">${esc(p.label)}</span><b class="${dir==='in'?'plus':''}">${dir==='in'?'+':''}${eur(p.v)}</b></span>
        <span class="bar"><span style="width:${pct}%;background:${p.color}"></span></span>
        <span class="crow-sub">${pct} % · ${plural(p.n,'Eintrag','Einträge')}${bud?' · '+bud:''}</span></span>${ICON.right}</button></li>`;
  }).join('')}</ul>`;
  const inParts=groupParts(books.filter(b=>b.dir==='in')), outParts=groupParts(books.filter(b=>b.dir==='out'));
  const detail=`<section class="card"><h2>${esc(monthName(sy,sm))} ${sy}</h2>
    <div class="msum"><div><span>Einnahmen</span><b class="plus">+${eur(T.i)}</b></div><div><span>Ausgaben</span><b class="neg">−${eur(T.o)}</b></div></div>
    <p class="mleft">${T.s?`Gespart ${eur(T.s)} · `:''}${left<0?`<span class="neg">Minus ${eur(-left)}</span>`:`Übrig <b>${eur(left)}</b>`}</p>
    ${cmp}
    ${!books.length?'<p class="muted" style="margin:14px 0 4px">Keine Buchungen in diesem Monat.</p>':''}
    ${inParts.length?`<h3 class="sec-h">Einnahmen</h3>${rows(inParts,T.i,'in')}`:''}
    ${outParts.length?`<h3 class="sec-h">Ausgaben</h3>${rows(outParts,T.o,'out')}`:''}</section>
    <button type="button" class="link-btn budget-link" data-sub="budgets">${ICON.bars}Budgets festlegen ›</button>`;
  $('#view').innerHTML=`<h1 class="page-title">Analyse</h1>${chart}${detail}`;
}
// Alle Einträge einer Gruppe im gewählten Monat
function catDetailWin(k){
  const y=statAnchor.getFullYear(), m=statAnchor.getMonth(), all=()=>monthBooks(y,m).filter(b=>groupKey(b)===k);
  const first=all()[0]; if(!first) return; const meta=groupMeta(k,first);
  const body=()=>{ const list=all().sort((a,b)=>b.amount-a.amount), total=round2(sum(list.map(b=>b.amount)));
    return list.length?`<p class="text">${esc(monthName(y,m))} ${y}: <b>${eur(total)}</b> · ${plural(list.length,'Eintrag','Einträge')}</p>
      <ul class="list">${list.map(b=>{ const own=b.name!==meta.label, when=dayShort(b.iso)+(b.state?' · '+b.state:'');   // ohne eigenen Namen steht nur das Datum da
        return `<li><button class="item book" data-open="${b.open}"><span class="b-icon" style="--c:${b.color}">${ICON[b.icon]||ICON.dots}</span>
          <span class="item-main"><div class="item-name">${esc(own?b.name:when)}</div>${own?`<div class="item-sub">${esc(when)}</div>`:''}</span>

// Wie viel muss ich sparen? Heute und der Zieltag zählen beide mit (26.10. bis 30.10. = 5 Tage).
// Aufgerundet auf den Cent, damit das Ziel sicher erreicht wird.
function saveTip(g,rest){
  if(!g.until||!(rest>0)) return '';
  const days=daysBetween(today(),fromISO(g.until))+1;
  if(days<1) return 'Das Datum ist schon vorbei.';
  const up=x=>Math.ceil(x*100-1e-6)/100;
  if(days===1) return `Heute noch ${eur(rest)} sparen`;
  const perDay=up(rest/days);
  if(days<=31) return `${eur(perDay)} pro Tag sparen (noch ${days} Tage)`;
  return `${eur(up(rest/(days/30.4375)))} pro Monat · ${eur(perDay)} pro Tag`;
}
function goalCard(g){
  const col=GOAL_COLORS[g.color%GOAL_COLORS.length], sv0=goalSaved(g), done=sv0>=g.target, pct=Math.min(100,Math.floor(sv0/g.target*100)), rest=round2(Math.max(0,g.target-sv0));
  const tip=done?'':saveTip(g,rest);
  return `<section class="goal"><button type="button" class="goal-head" data-goal="${g.id}"><span class="g-ic" style="--c:${col}">${goalIconSvg(g.icon)}</span>
      <span class="g-txt"><span class="g-name">${esc(g.name)}</span><span class="g-target">${eur(g.target)}</span></span>${ICON.right}</button>
    <span class="bar"><span style="width:${pct}%;background:${col}"></span></span>
    <div class="goal-line"><span><b>${eur(sv0)}</b> von ${eur(g.target)} gespart</span><span><b>${pct} %</b></span></div>
    <div class="goal-line small"><span>${done?'<span class="goal-done">Geschafft!</span>':`Noch ${eur(rest)}`}</span><span>${g.until?`Ziel: ${numDate(fromISO(g.until))}`:''}</span></div>
    ${tip?`<div class="goal-tip">${esc(tip)}</div>`:''}
    <button type="button" class="btn btn-soft" data-deposit="${g.id}">${ICON.plus}Geld einzahlen</button></section>`;
}
