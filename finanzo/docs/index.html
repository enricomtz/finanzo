/* =====================================================================
   Fenster (öffnen/schließen, auch mit der Zurück-Taste am Handy)
   ===================================================================== */
const stack=[];
let useHistory=false;
try{ useHistory=window.self===window.top; if(useHistory) history.replaceState({w:0},''); }catch(e){ useHistory=false; }
function dropTop(){const w=stack.pop();if(!w)return;w.el.remove();if(w.onClose)w.onClose();if(!stack.length&&pullWanted){pullWanted=false;setTimeout(pull,0);}}
window.addEventListener('popstate',e=>{ if(!useHistory) return; const depth=(e.state&&e.state.w)||0; while(stack.length>depth) dropTop(); });
function closeWin(n=1){
  n=Math.min(n,stack.length); if(!n) return;
  for(let i=0;i<n;i++) dropTop();
  if(useHistory){ try{ history.go(-n); }catch(e){} }
}
function win(title,body,setup){
  splashHide(true);
  const el=document.createElement('div'); el.className='scrim';
  el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-top"><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-close aria-label="${esc(tr('close'))}">${ICON.x}</button></div>${body}</div>`;
  document.body.appendChild(el);
  const w={el}; stack.push(w);
  if(useHistory){ try{ history.pushState({w:stack.length},''); }catch(e){ useHistory=false; } }
  el.addEventListener('click',e=>{ if(e.target===el||e.target.closest('[data-close]')){ e.preventDefault(); closeWin(stack.length-stack.indexOf(w)); } });
  // Wischen nur erlauben, wo es wirklich etwas zu scrollen gibt (sonst bewegt sich nichts)
  el.addEventListener('touchmove',e=>{ if(e.touches&&e.touches.length>1) return;
    const sc=e.target.closest&&e.target.closest('[data-wheel-scroll],.sheet');
    if(sc&&sc.scrollHeight>sc.clientHeight+1) return; e.preventDefault(); },{passive:false});
  const sheet=el.querySelector('.sheet'); if(setup) setup(sheet,w); fitKeyboard();
  const first=sheet.querySelector('[data-focus]');
  if(first&&matchMedia('(min-width:760px)').matches) setTimeout(()=>{try{first.focus();}catch(e){}},60);
  return w;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&stack.length){e.preventDefault();closeWin(1);}});
// Tastatur am Handy: offene Fenster rücken über die Tastatur, damit man sieht, was man tippt
function fitKeyboard(){
  const vv=window.visualViewport; if(!vv) return;
  const full=Math.max(document.documentElement.clientHeight,window.innerHeight);
  const kb=full-vv.height>120&&Math.abs((vv.scale||1)-1)<.05;
  document.body.classList.toggle('kb',kb);
  document.documentElement.style.setProperty('--vvh',kb?vv.height+'px':'');
  document.querySelectorAll('.scrim').forEach(s=>{
    s.style.top=kb?vv.offsetTop+'px':''; s.style.height=kb?vv.height+'px':''; s.style.bottom=kb?'auto':''; });
  const a=document.activeElement;
  if(kb&&a&&a.closest&&a.closest('.sheet')&&a.matches('input,textarea')) requestAnimationFrame(()=>{   // Feld mit etwas Luft in den sichtbaren Teil holen
    const sh=a.closest('.sheet'), r=a.getBoundingClientRect(), sr=sh.getBoundingClientRect(), top=sh.querySelector('.sheet-top');
    const down=r.bottom+24-sr.bottom, up=sr.top+(top?top.offsetHeight:0)+(a.closest('.cur-search')?0:12)-r.top;
    if(down>0) sh.scrollTop+=down; else if(up>0) sh.scrollTop-=up; });
}
if(window.visualViewport){ visualViewport.addEventListener('resize',fitKeyboard); visualViewport.addEventListener('scroll',fitKeyboard); }
document.addEventListener('focusin',()=>setTimeout(fitKeyboard,50));
document.addEventListener('focusout',()=>setTimeout(fitKeyboard,50));
// Suchfelder: „Suchen“ auf der Tastatur schließt die Tastatur
const searchKeys=q=>q.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); q.blur(); } });
function ask(title,text,okText){
  return new Promise(res=>{let done=false;
    win(title,`<p class="text">${esc(text)}</p><div class="btns"><button type="button" class="btn btn-soft" data-close>${esc(tr('cancel'))}</button><button type="button" class="btn btn-red" data-ok>${esc(okText)}</button></div>`,(s,w)=>{
      w.onClose=()=>{if(!done){done=true;res(false);}};
      s.querySelector('[data-ok]').addEventListener('click',()=>{if(done)return;done=true;res(true);});
    });});
}
// Fenster mit zwei Möglichkeiten; schließen ohne Wahl ist nicht möglich
function choose(title,text,aLabel,bLabel){
  return new Promise(res=>{let done=false;
    const open=()=>win(title,`<p class="text">${esc(text)}</p><div class="btns"><button type="button" class="btn btn-main" data-a>${esc(aLabel)}</button><button type="button" class="btn btn-soft" data-b>${esc(bLabel)}</button></div>`,(s,w)=>{
      w.onClose=()=>{ if(!done) setTimeout(open,0); };
      s.querySelector('[data-a]').addEventListener('click',()=>{done=true;closeWin(1);res('a');});
      s.querySelector('[data-b]').addEventListener('click',()=>{done=true;closeWin(1);res('b');});
    });
    open();
  });
}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400);}
const showErr=(s,msg)=>{const e=s.querySelector('.err');e.textContent=msg;e.hidden=false;};
const moneyField=(label,value,focus,name='amount')=>`<label class="field"><span class="label">${esc(label)}</span><span class="money"><input class="input" name="${name}" value="${esc(moneyInput(value))}" inputmode="decimal" placeholder="${esc(exNum(0))}" autocomplete="off" ${focus?'data-focus':''}><span>${esc(curSymbol(data.settings.currency))}</span></span></label>`;
const choice=(name,options,current,cls='')=>`<div class="choice ${cls}" data-choice="${name}">${options.map(o=>
  `<button type="button" data-v="${o.v}" aria-pressed="${String(o.v)===String(current)}">${o.icon?`<span class="c-ic" style="color:${o.dot}">${ICON[o.icon]}</span>`:o.dot?`<span class="dot" style="background:${o.dot}"></span>`:''}${esc(o.l)}</button>`).join('')}</div>`;
function wireChoice(root){root.querySelectorAll('[data-choice]').forEach(box=>box.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; box.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));}));}
const choiceValue=(root,name)=>{const b=root.querySelector(`[data-choice="${name}"] [aria-pressed="true"]`);return b?b.dataset.v:null;};
const quick=list=>`<div class="quick">${list.map(q=>`<button type="button" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`;
function wireQuick(s,input,next){s.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();input.value=b.dataset.q;if(next)next.focus();}));}
function wireSwitch(s,attr,onChange){const b=s.querySelector(`[${attr}]`);b.addEventListener('click',()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);onChange(on);});return ()=>b.getAttribute('aria-pressed')==='true';}
const remindField=v=>`<label class="field"><span class="label">${esc(tr('remind.label'))}</span>
  <span class="date-btn"><span class="date-ic">${ICON.bell}</span><input class="input" type="date" name="remindOn" value="${esc(v)}" aria-label="${esc(tr('remind.aria'))}"></span></label>`;
// Ändert man das Datum, wandert der Erinnerungstag mit – bis man ihn selbst ändert
function linkRemindOn(dateInput,remindInput,gap){
  let touched=false;
  ['input','change'].forEach(ev=>{
    remindInput.addEventListener(ev,()=>{touched=true;});
    dateInput.addEventListener(ev,()=>{ if(!touched&&isISO(dateInput.value)) remindInput.value=remindDefault(dateInput.value,gap); });
  });
}

/* ---------- Einnahme (jeden Monat) ---------- */
function incomeWin(id){
  const it=id?data.incomes.find(x=>x.id===id):null; if(id&&!it) return;
  const v=it||{name:'',amount:0,payday:0};
  win(it?tr('inc.edit'):tr('inc.new'),`<form novalidate>
    <div class="field"><label><span class="label">${esc(tr('what'))}</span><input class="input" name="name" value="${esc(v.name)}" placeholder="${esc(tr('inc.namePh'))}" maxlength="40" autocomplete="off" ${it?'':'data-focus'}></label>
      ${quick([tr('q.salary'),tr('q.sidejob'),tr('q.childben'),tr('q.other')])}</div>
    ${moneyField(tr('inc.amount'),v.amount)}
    <p class="hint" style="margin-top:-8px">${esc(tr('inc.hint'))}</p>
    <p class="err" hidden></p>
    <button class="btn btn-main btn-full" type="submit">${esc(tr('save'))}</button>
    ${it?`<div class="btns"><button type="button" class="btn btn-red" data-del>${esc(tr('inc.delete'))}</button></div>`:''}
  </form>`,s=>{
    const f=s.querySelector('form'); wireQuick(s,f.name,f.amount);
    f.addEventListener('submit',e=>{e.preventDefault();
      const name=f.name.value.trim(), amount=parseMoney(f.amount.value);
      if(!name) return showErr(s,tr('inc.errName'));
      if(!(amount>0)) return showErr(s,tr('err.amountEx',{ex:exNum(1200)}));
      if(it) Object.assign(it,{name,amount}); else data.incomes.push({id:uid(),name,amount,payday:0,since:''});
      fillSince(); save(); closeWin(1); draw(); toast(tr('toast.saved'));
    });
    const del=s.querySelector('[data-del]');
    if(del) del.addEventListener('click',async()=>{
      if(!await ask(tr('inc.delQ'),tr('delText',{name:it.name}),tr('delete'))) return;
      data.incomes=data.incomes.filter(x=>x!==it); save(); closeWin(2); draw(); toast(tr('toast.deleted'));
    });
  });
}

/* ---------- Abo oder Vertrag ---------- */
function contractWin(id){
  const c=id?data.contracts.find(x=>x.id===id):null; if(id&&!c) return;
  const v=c||{name:'',amount:0,rhythm:'monthly',nextDate:toISO(today()),trialEnd:''};
  win(c?tr('abo.edit'):tr('abo.new'),`<form novalidate>
    <div class="field"><label><span class="label">${esc(tr('name'))}</span><input class="input" name="name" value="${esc(v.name)}" placeholder="${esc(tr('abo.namePh'))}" maxlength="40" autocomplete="off" ${c?'':'data-focus'}></label>
      ${c?'':quick([tr('q.phone'),'Spotify','Netflix',tr('q.gym'),tr('q.insurance')])}</div>
    ${moneyField(tr('amount'),v.amount)}
    <div class="field"><span class="label">${esc(tr('abo.how'))}</span>${choice('rhythm',Object.entries(RHYTHM).map(([k,r])=>({v:k,l:r.label})),v.rhythm)}</div>
    <button type="button" class="switch-row" data-trial aria-pressed="${!!v.trialEnd}"><span>${esc(tr('abo.trial'))}</span><span class="switch"></span></button>
    <label class="field" data-trial-on ${v.trialEnd?'':'hidden'}><span class="label">${esc(tr('abo.freeUntil'))}</span><input class="input" type="date" name="trialEnd" value="${esc(v.trialEnd||toISO(addDays(today(),30)))}">
      <span class="hint">${esc(tr('abo.trialHint'))}</span></label>
    <label class="field" data-trial-off ${v.trialEnd?'hidden':''}><span class="label">${esc(tr('abo.nextDate'))}</span><input class="input" type="date" name="nextDate" value="${esc(v.nextDate)}"></label>
    <p class="err" hidden></p>
    <button class="btn btn-main btn-full" type="submit">${esc(tr('save'))}</button>
    ${c?`<div class="btns"><button type="button" class="btn btn-red" data-del>${esc(tr('delete'))}</button></div>`:''}
  </form>`,s=>{
    wireChoice(s);
    const f=s.querySelector('form'); wireQuick(s,f.name,f.amount);
    const trialOn=wireSwitch(s,'data-trial',on=>{ s.querySelector('[data-trial-on]').hidden=!on; s.querySelector('[data-trial-off]').hidden=on; });
    f.addEventListener('submit',e=>{e.preventDefault();
      const trial=trialOn(), name=f.name.value.trim(), amount=parseMoney(f.amount.value), trialEnd=trial?f.trialEnd.value:'';
      if(!name) return showErr(s,tr('abo.errName'));
      if(!(amount>0)) return showErr(s,trial?tr('abo.errTrialAmount',{ex:exNum(9.99)}):tr('err.amountEx',{ex:exNum(9.99)}));
      if(trial&&!isISO(trialEnd)) return showErr(s,tr('abo.errTrialEnd'));
      const nextDate=trial?toISO(addDays(fromISO(trialEnd),1)):f.nextDate.value;
      if(!isISO(nextDate)) return showErr(s,tr('abo.errNext'));
      const d={name,amount,rhythm:choiceValue(s,'rhythm')||'monthly',nextDate,trialEnd};
      if(c){ if(c.trialEnd!==trialEnd) d.notified=''; Object.assign(c,d); }
      else data.contracts.push(Object.assign({id:uid(),color:freeColor(data.contracts),notified:'',since:''},d));
      fillSince(); save(); closeWin(1); draw(); toast(tr('toast.saved'));
      syncNotifications(trial);
    });
    const del=s.querySelector('[data-del]');
    if(del) del.addEventListener('click',async()=>{
      if(!await ask(tr('delQ'),tr('delText',{name:c.name}),tr('delete'))) return;
      data.contracts=data.contracts.filter(x=>x!==c); save(); closeWin(2); draw(); toast(tr('toast.deleted')); syncNotifications(false);
    });
  });
}

        <button type="button" class="icon-btn rc-x" data-rc-x aria-label="${esc(tr('rc.remove'))}">${ICON.x}</button>

const RC_STORES=[

  [/\bBACK\s?WERK\b/i,'BackWerk','essen'],[/\bB[AÄ]CKEREI\b/i,'Bäckerei','essen'],[/\bRESTAURANT\b/i,'','essen'],[/\bPIZZ/i,'','essen'],[/\bD[OÖ]NER|KEBAP|KEBAB/i,'','essen'],
  [/\bH\s?&\s?M\b/i,'H&M','kleidung'],[/\bZARA\b/i,'Zara','kleidung'],[/\bPRIMARK\b/i,'Primark','kleidung'],[/\bC\s?&\s?A\b/i,'C&A','kleidung'],[/\bDEICHMANN\b/i,'Deichmann','kleidung'],
  [/\bSNIPES\b/i,'Snipes','kleidung'],[/\bKIK\b/i,'KiK','kleidung'],[/\bDECATHLON\b/i,'Decathlon','freizeit'],
  [/MEDIA\s?MARKT/i,'MediaMarkt','technik'],[/\bSATURN\b/i,'Saturn','technik'],[/\bEXPERT\b/i,'expert','technik'],[/\bAPPLE\s?STORE\b/i,'Apple Store','technik'],
  [/\bKINO|CINEMA|CINEMAXX|UCI\b/i,'','freizeit'],[/\bTHALIA\b/i,'Thalia','freizeit'],

function rcMoney(s){ // "1.234,56" / "12,99" / "12.99" / "12, 99" → Zahl
  const m=String(s).replace(/\s/g,'').match(/^(-?)(\d{1,3}(?:[.']\d{3})*|\d+)[.,](\d{2})$/);
  if(!m) return NaN; return Number(m[2].replace(/[.']/g,'')+'.'+m[3])*(m[1]?-1:1);
}
// alle Beträge in einer Zeile (OCR macht manchmal Leerzeichen um das Komma)
function rcAmounts(line){
  const out=[]; const re=/(?<![\d.,])(-?\d{1,3}(?:[.']\d{3})+|-?\d{1,5})\s?[.,]\s?(\d{2})(?![\d])(?!\s?%)/g; let m;
  while((m=re.exec(line))) { const v=rcMoney(m[1]+','+m[2]); if(isFinite(v)) out.push(v); }
  return out;
}
const RC_TOTAL=/\b(S\s?U\s?M+\s?E|SUM+E|SUMNE|GESAMT\w*|ENDBETRAG|ENDSUMME|TOTAL|ZU\s?ZAHLEN|ZAHLBETRAG|RECHNUNGSBETRAG|BETRAG|ZU\s?ZAHL)\b/i;
const RC_PAY=/\b(EC[\s-]?(CASH|KARTE)?|GIROCARD|KARTEN?ZAHLUNG|KARTE|VISA|MASTER\s?CARD|MAESTRO|V\s?PAY|AMEX|APPLE\s?PAY|GOOGLE\s?PAY|PAYPAL|BEZAHLT|KREDITKARTE|BAR(ZAHLUNG)?)\b/i;
const RC_SKIP=/(ZWISCHEN|NETTO|MWST|M\s?W\s?ST|STEUER|UST|RÜCKGELD|RUECKGELD|WECHSELGELD|GEGEBEN|ZURÜCK|ZURUECK|RABATT|PFAND\s?BON|GUTHABEN|PUNKTE|PAYBACK|ERSPARNIS|GESPART)/i;
function rcDate(text){
  const now=new Date(); let best=null;
  const re=/(?<!\d)(\d{1,2})\s?[.\/-]\s?(\d{1,2})\s?[.\/-]\s?(20\d{2}|\d{2})(?!\d)/g; let m;
  while((m=re.exec(text))){
    let d=+m[1], mo=+m[2], y=+m[3]; if(y<100) y+=2000;
    if(mo<1||mo>12||d<1||d>31) continue;
    const dt=new Date(y,mo-1,d); if(dt.getMonth()!==mo-1) continue;
    if(dt>new Date(now.getFullYear(),now.getMonth(),now.getDate()+1)||dt<new Date(now.getFullYear()-2,0,1)) continue;
    best=best||dt;
  }
  return best;
}
function parseReceipt(text){
  const lines=String(text||'').split(/\r?\n/).map(l=>l.replace(/[|]/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
  const cand=[];   // mögliche Summen mit Punkten
  const firstTotal=lines.findIndex(l=>RC_TOTAL.test(l)&&!RC_SKIP.test(l));
  lines.forEach((l,i)=>{
    const a=rcAmounts(l), next=i+1<lines.length?rcAmounts(lines[i+1]):[];
    if(/BRUTTO/i.test(l)&&!a.length){                                            // Steuer-Tabelle: Brutto steht ganz rechts
      const m=i+1<lines.length&&lines[i+1].match(/(\d{1,4}\s?[.,]\s?\d{2})\s*$/); if(m) cand.push({v:rcMoney(m[1]),s:3}); return; }
    if(RC_SKIP.test(l)&&!/^(SUMME|GESAMT)/i.test(l)) return;
    if(RC_TOTAL.test(l)){ const v=a.length?a[a.length-1]:(next.length===1?next[0]:NaN); if(v>0) cand.push({v,s:10}); }
    else if(RC_PAY.test(l)&&!/R[UÜ]CK|ZUR[UÜ]CK/i.test(l)){ const v=a.length?a[a.length-1]:NaN; if(v>0) cand.push({v,s:6}); }
  });
  // Summe der Artikel (Zeilen vor der Summe, die mit einem Preis enden)
  let items=0, nItems=0;
  lines.slice(0,firstTotal>0?firstTotal:lines.length).forEach(l=>{
    if(RC_SKIP.test(l)||RC_TOTAL.test(l)) return;
    const m=l.match(/(-?\d{1,4}\s?[.,]\s?\d{2})\s*(?:[A-D1-4*]|EUR|€)?\s*$/i);
    if(m&&!/%\s*$/.test(l)){ const v=rcMoney(m[1]); if(isFinite(v)){ items+=v; nItems++; } }
  });
  items=Math.round(items*100)/100;
  const all=[]; lines.forEach(l=>{ if(!RC_SKIP.test(l)||/^(SUMME|GESAMT)/i.test(l)) rcAmounts(l).forEach(v=>v>0&&all.push(v)); });
  cand.forEach(c=>{ const n=cand.filter(o=>Math.abs(o.v-c.v)<0.005).length+all.filter(x=>Math.abs(x-c.v)<0.005).length;
    c.s+=Math.min(n,5)*1.5; if(nItems>=1&&Math.abs(items-c.v)<0.005) c.s+=8; });
  cand.sort((x,y)=>y.s-x.s);
  let total=cand.length?cand[0].v:NaN;
  if(!cand.length&&firstTotal<0&&nItems>=2&&items>0) total=items;   // gar keine Summen-Zeile: Artikel zusammenzählen
  if(!(total>0&&total<100000)) total=NaN;
  // Geschäft: bekannte Namen, zuerst in den obersten Zeilen
  let store='', cat='';
  const look=[...lines.slice(0,6),...lines.slice(6).filter(l=>!RC_SKIP.test(l)&&!/BRUTTO|NETTO\s+STEUER/i.test(l))];
  for(const l of look){ const hit=RC_STORES.find(([re])=>re.test(l)); if(hit){ store=hit[1]; cat=hit[2]; break; } }
  return {total:isFinite(total)?Math.round(total*100)/100:null,date:rcDate(lines.join('\n')),store,cat};
}

// Foto vorbereiten: eines zum Aufheben (klein) und eines zum Lesen (groß, Graustufen, kräftiger Kontrast)
async function rcPrepare(file){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image(); img.src=url; await img.decode();
    const W=img.naturalWidth, H=img.naturalHeight; if(!W||!H) throw new Error('image');
    const cv=(w,hh)=>{ const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w)); c.height=Math.max(1,Math.round(hh)); return c; };
    const blob=(c,type,q)=>new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('encode')),type,q));
    const s1=Math.min(1,1600/Math.max(W,H)), c1=cv(W*s1,H*s1);
    c1.getContext('2d').drawImage(img,0,0,c1.width,c1.height);
    const photo=await blob(c1,'image/jpeg',0.72);
    const s=Math.min(1800/Math.min(W,H),2600/Math.max(W,H)), s2=Math.min(s,W<1200?1600/W:s), c2=cv(W*s2,H*s2), g=c2.getContext('2d');
    g.drawImage(img,0,0,c2.width,c2.height);
    const d=g.getImageData(0,0,c2.width,c2.height), px=d.data, hist=new Uint32Array(256);
    for(let i=0;i<px.length;i+=4){ const y=(px[i]*77+px[i+1]*150+px[i+2]*29)>>8; px[i]=y; hist[y]++; }
    const n=px.length/4; let lo=0, hi=255, acc=0;
    while(lo<255&&(acc+=hist[lo])<n*0.01) lo++; acc=0; while(hi>0&&(acc+=hist[hi])<n*0.01) hi--;
    const k=hi>lo?255/(hi-lo):1;
    for(let i=0;i<px.length;i+=4){ const v=Math.max(0,Math.min(255,(px[i]-lo)*k)); px[i]=px[i+1]=px[i+2]=v; }
    g.putImageData(d,0,0);
    const ocr=await (await blob(c2,'image/jpeg',0.92)).arrayBuffer();
    return {photo,ocr};
  }finally{ URL.revokeObjectURL(url); }
}
let ocrW=null, ocrN=0, ocrProg=null; const ocrJobs={};
function ocrRead(buf,onProgress){
  return new Promise((resolve,reject)=>{
    if(!ocrW){
      try{ ocrW=new Worker('ocr/ocr-worker.js'); }catch(e){ return reject(e); }
      ocrW.onmessage=e=>{ const d=e.data||{};
        if(d.progress!=null){ if(ocrProg) ocrProg(d.progress,d.stage); return; }
        const j=ocrJobs[d.id]; if(!j) return; delete ocrJobs[d.id]; clearTimeout(j.t);
        d.error?j.reject(new Error(d.error)):j.resolve(d.text||''); };
      ocrW.onerror=()=>{ for(const k in ocrJobs){ clearTimeout(ocrJobs[k].t); ocrJobs[k].reject(new Error('worker')); delete ocrJobs[k]; } try{ ocrW.terminate(); }catch(x){} ocrW=null; };
    }
    const id=++ocrN; ocrProg=onProgress||null;
    ocrJobs[id]={resolve,reject,t:setTimeout(()=>{ if(ocrJobs[id]){ delete ocrJobs[id]; reject(new Error('timeout')); } },90000)};
    ocrW.postMessage({id,image:buf},[buf]);
  });
}
// Fotos auf dem Gerät (IndexedDB): {blob, up: schon im Konto?, owner}

async function idb(mode,fn){ const db=await photoDb(); return new Promise((res,rej)=>{ const tx=db.transaction('p',mode), r=fn(tx.objectStore('p'));

// Supabase Storage (Bucket „receipts“)

async function sbStorage(method,path,body,type){

    let res; try{ res=await fetch(SB_URL+'/storage/v1/'+path,{method,headers:h,body,cache:'no-store'}); }catch(e){ const er=new Error('offline'); er.offline=true; throw er; }
    if(!res.ok){ const er=new Error('storage '+res.status); er.status=res.status; throw er; } return res; };

  catch(e){ if(e.status===401) return await go(await accessToken(true)); throw e; }
}
let photoSyncT=0, photoSyncing=false;
function photoSyncSoon(ms=800){ if(!ACCOUNTS||!session) return; clearTimeout(photoSyncT); photoSyncT=setTimeout(photoSync,ms); }
async function photoSync(){
  if(!ACCOUNTS||!session||photoSyncing||!navigator.onLine) return;
  photoSyncing=true;

    const del=JSON.parse(store.get(PHOTO_DEL)||'[]'), left=[];
    for(const id of del){ try{ await sbStorage('DELETE','object/receipts/'+photoPath(id)); }catch(e){ if(e.offline||e.status>=500||e.status===401) left.push(id); } }
    left.length?store.set(PHOTO_DEL,JSON.stringify(left)):store.del(PHOTO_DEL);
    for(const id of await photoKeys()){
      const v=await photoGet(id); if(!v) continue;
      if(!data.expenses.some(x=>x.id===id&&x.photo)){ await photoDel(id); continue; }      // Buchung gibt es nicht mehr

// Foto für eine Buchung holen (vom Gerät oder aus dem Konto)
async function photoURL(id){
  const v=await photoGet(id); if(v&&v.blob) return URL.createObjectURL(v.blob);
  if(!ACCOUNTS||!session) return null;
  try{ const r=await sbStorage('GET','object/authenticated/receipts/'+photoPath(id)); const blob=await r.blob();
    await photoPut(id,{blob,up:true,owner:session.user.id}).catch(()=>{}); return URL.createObjectURL(blob); }catch(e){ return null; }
}
function photoForget(id){
  photoDel(id);
  const del=JSON.parse(store.get(PHOTO_DEL)||'[]'); if(!del.includes(id)){ del.push(id); store.set(PHOTO_DEL,JSON.stringify(del)); }
  photoSyncSoon();
}
// Konto löschen: alle Fotos im Konto mitlöschen
async function photoWipeRemote(){
  if(!ACCOUNTS||!session) return;
  try{
    const r=await sbStorage('POST','object/list/receipts',JSON.stringify({prefix:session.user.id,limit:1000,offset:0}),'application/json');
    const list=await r.json(); const names=(Array.isArray(list)?list:[]).map(o=>session.user.id+'/'+o.name).filter(n=>/\.jpg$/.test(n));
    if(names.length) await sbStorage('DELETE','object/receipts',JSON.stringify({prefixes:names}),'application/json');
  }catch(e){}
}
// Großansicht
function receiptWin(src){
  win(tr('rc.title'),`<p class="hint" style="margin:0 0 8px">${esc(tr('rc.zoomHint'))}</p><div class="rc-view" data-rc-full><p class="nt-msg">${esc(tr('busy'))}</p></div>`,(s,w)=>{
    const box=s.querySelector('[data-rc-full]'); let url=null;
    Promise.resolve(typeof src==='string'&&!src.startsWith('blob:')?photoURL(src):src).then(u=>{
      url=u&&u!==src?u:null;
      if(!u){ box.innerHTML=`<p class="nt-msg">${esc(tr('rc.missing'))}</p>`; return; }
      box.innerHTML=`<img alt="${esc(tr('rc.title'))}">`; box.querySelector('img').src=u;
    });
    box.addEventListener('click',()=>box.classList.toggle('zoom'));
    w.onClose=()=>{ if(url) URL.revokeObjectURL(url); };
  });
}

/* ---------- Budget ---------- */
function budgetWin(catId){
  const pick=!catId, t=today();
  const first=catId||(EXP_CATS.find(c=>!data.budgets[c.id])||EXP_CATS[0]).id;
  const c=catOf(first), b=data.budgets[first]||0;
  const y=t.getFullYear(), m=t.getMonth();
  win(pick?tr('bud.set'):tr('bud.for',{cat:c.label}),`<form novalidate>
    ${pick?`<div class="field"><span class="label">${esc(tr('bud.which'))}</span>${choice('cat',EXP_CATS.map(k=>({v:k.id,l:k.label,dot:k.color,icon:k.icon})),first,'cats')}</div>`
      :`<p class="text">${tr('bud.already',{month:esc(monthName(y,m)),amount:`<b>${eur(catSpent(y,m,first))}</b>`})}</p>`}
    ${moneyField(tr('bud.max'),b,!pick)}
    <p class="err" hidden></p>
    <button class="btn btn-main btn-full" type="submit">${esc(tr('save'))}</button>
    ${!pick&&b?`<div class="btns"><button type="button" class="btn btn-red" data-del>${esc(tr('bud.remove'))}</button></div>`:''}
  </form>`,s=>{
    wireChoice(s);
    const f=s.querySelector('form'), box=s.querySelector('[data-choice="cat"]');
    if(box) box.addEventListener('click',()=>{ const v=data.budgets[choiceValue(s,'cat')]; f.amount.value=v?moneyInput(v):''; });
    f.addEventListener('submit',e=>{e.preventDefault();
      const cat=pick?choiceValue(s,'cat'):first, amount=parseMoney(f.amount.value);
      if(!(amount>0)) return showErr(s,tr('err.amountEx',{ex:exNum(150)}));
      data.budgets[cat]=amount; save(); closeWin(1); draw(); toast(tr('toast.budSaved',{cat:catOf(cat).label}));
    });
    const del=s.querySelector('[data-del]');
    if(del) del.addEventListener('click',()=>{ delete data.budgets[first]; save(); closeWin(1); draw(); toast(tr('toast.budRemoved')); });
  });
}

/* ---------- Termin ---------- */
function taskWin(id){
  const x=id?data.tasks.find(t=>t.id===id):null; if(id&&!x) return;
  const d0=toISO(addDays(today(),7));
  const v=x||{title:'',date:d0,amount:0,note:'',remindOn:remindDefault(d0,3)};
  win(x?tr('task.edit'):tr('task.new'),`<form novalidate>
    <label class="field"><span class="label">${esc(tr('what'))}</span><input class="input" name="title" value="${esc(v.title)}" placeholder="${esc(tr('task.titlePh'))}" maxlength="60" autocomplete="off" ${x?'':'data-focus'}></label>
    <label class="field"><span class="label">${esc(tr('task.when'))}</span><input class="input" type="date" name="date" value="${esc(v.date)}"></label>
    <button type="button" class="switch-row" data-money aria-pressed="${v.amount>0}"><span>${esc(tr('task.pay'))}</span><span class="switch"></span></button>
    <div data-money-on ${v.amount>0?'':'hidden'}>${moneyField(tr('amount'),v.amount)}</div>
    <label class="field"><span class="label">${esc(tr('exp.note'))}</span><textarea class="input" name="note" maxlength="300">${esc(v.note)}</textarea></label>
    ${remindField(v.remindOn)}
    <p class="err" hidden></p>
    <button class="btn btn-main btn-full" type="submit">${esc(tr('save'))}</button>
    ${x?`<div class="btns"><button type="button" class="btn btn-soft" data-done>${esc(x.done?tr('task.reopen'):tr('task.done'))}</button><button type="button" class="btn btn-red" data-del>${esc(tr('delete'))}</button></div>`:''}
  </form>`,s=>{
    const f=s.querySelector('form');
    const moneyOn=wireSwitch(s,'data-money',on=>{ s.querySelector('[data-money-on]').hidden=!on; if(on) f.amount.focus(); });
    linkRemindOn(f.date,f.remindOn,x?daysBetween(fromISO(x.remindOn),fromISO(x.date)):3);
    f.addEventListener('submit',e=>{e.preventDefault();
      const title=f.title.value.trim(), date=f.date.value, note=f.note.value.trim(), remindOn=f.remindOn.value;
      const amount=moneyOn()?parseMoney(f.amount.value):0;
      if(!title) return showErr(s,tr('task.errTitle'));
      if(!isISO(date)) return showErr(s,tr('err.date'));
      if(moneyOn()&&!(amount>0)) return showErr(s,tr('task.errAmount',{ex:exNum(30)}));
      if(!isISO(remindOn)) return showErr(s,tr('task.errRemind'));
      if(remindOn>date) return showErr(s,tr('task.errRemindAfter'));
      const d={title,date,amount:round2(amount),note,remindOn};
      if(x){ if(x.date!==date||x.remindOn!==remindOn) d.notified=''; Object.assign(x,d); }
      else data.tasks.push(mkTask(d));
      save(); closeWin(1); draw(); toast(tr('toast.saved'));
      syncNotifications(true);
    });
    const dn=s.querySelector('[data-done]');
    if(dn) dn.addEventListener('click',()=>{ closeWin(1); setDone(x,!x.done); });
    const del=s.querySelector('[data-del]');
    if(del) del.addEventListener('click',async()=>{
      if(!await ask(tr('task.delQ'),tr('delText',{name:x.title}),tr('delete'))) return;
      data.tasks=data.tasks.filter(t=>t!==x); save(); closeWin(2); draw(); toast(tr('toast.deleted')); syncNotifications(false);
    });
  });
}
function setDone(x,done){
  x.done=done; x.doneAt=done?toISO(today()):'';
  save(); draw(); toast(done?(x.amount?tr('toast.paid'):tr('toast.done')):tr('toast.reopened'));
  syncNotifications(false);
}

/* ---------- Sparziel ---------- */
function goalWin(id){
  const g=id?data.goals.find(x=>x.id===id):null; if(id&&!g) return;
  const v=g||{name:'',target:0,until:'',icon:'ziel'};
  win(g?tr('goal.edit'):tr('goal.new'),`<form novalidate>
    <div class="field"><label><span class="label">${esc(tr('goal.for'))}</span><input class="input" name="name" value="${esc(v.name)}" placeholder="${esc(tr('goal.namePh'))}" maxlength="40" autocomplete="off" ${g?'':'data-focus'}></label>
      ${g?'':quick([tr('q.car'),tr('q.vacation'),tr('q.emergency'),tr('q.phone2')])}</div>
    <div class="field"><span class="label">${esc(tr('goal.icon'))}</span><div class="icon-pick" data-choice="icon">${GOAL_ICONS.map(([k,l,ic])=>
      `<button type="button" data-v="${k}" aria-pressed="${k===v.icon}" aria-label="${esc(tr('gi.'+k))}" title="${esc(tr('gi.'+k))}">${ICON[ic]}</button>`).join('')}</div></div>
    ${moneyField(tr('goal.need'),v.target,false,'target')}
    ${g?'':moneyField(tr('goal.have'),0,false,'start')}
    <label class="field"><span class="label">${esc(tr('goal.untilLbl'))}</span><input class="input" type="date" name="until" value="${esc(v.until)}">
      <span class="hint">${esc(tr('goal.untilHint'))}</span></label>
    <p class="err" hidden></p>
    <button class="btn btn-main btn-full" type="submit">${esc(tr('save'))}</button>
    ${g?`<div class="btns"><button type="button" class="btn btn-red" data-del>${esc(tr('goal.delete'))}</button></div>`:''}
  </form>`,s=>{
    wireChoice(s);
    const f=s.querySelector('form'); wireQuick(s,f.name,f.target);
    let touched=!!g;
    const pickBox=s.querySelector('[data-choice="icon"]');
    pickBox.addEventListener('click',()=>{touched=true;});
    const guess=()=>{ if(touched) return; const ic=guessGoalIcon(f.name.value); pickBox.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===ic)); };
    f.name.addEventListener('input',guess); s.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',guess));
    f.addEventListener('submit',e=>{e.preventDefault();
      const name=f.name.value.trim(), target=parseMoney(f.target.value), until=f.until.value, icon=choiceValue(s,'icon')||guessGoalIcon(name);
      const st=f.start?f.start.value.trim():'', start=st?parseMoney(st):0;
      if(!name) return showErr(s,tr('goal.errName'));
      if(!(target>0)) return showErr(s,tr('goal.errTarget',{ex:exNum(2000)}));
      if(!(start>=0)) return showErr(s,tr('goal.errStart',{ex:exNum(150)}));
      if(g) Object.assign(g,{name,target,icon,until:isISO(until)?until:''});
      else data.goals.push({id:uid(),name,target,start,moves:[],until:isISO(until)?until:'',color:data.goals.length%GOAL_COLORS.length,icon});
      save(); closeWin(1); draw(); toast(tr('toast.saved'));
    });
    const del=s.querySelector('[data-del]');
    if(del) del.addEventListener('click',async()=>{
      if(!await ask(tr('goal.delQ'),tr('delText',{name:g.name}),tr('delete'))) return;
      data.goals=data.goals.filter(x=>x!==g); save(); closeWin(2); draw(); toast(tr('toast.deleted'));
    });
  });
}
function depositWin(id){
  const g=data.goals.find(x=>x.id===id); if(!g) return;
  win(g.name,`<form novalidate>
    <p class="text">${tr('dep.saved',{saved:`<b>${eur(goalSaved(g))}</b>`,target:eur(g.target)})}</p>
    ${moneyField(tr('amount'),0,true)}
    <p class="hint" style="margin-top:-8px">${esc(tr('dep.hint'))}</p>
    <p class="err" hidden></p>
    <div class="btns"><button type="button" class="btn btn-soft" data-out>${esc(tr('dep.out'))}</button><button class="btn btn-main" type="submit">${esc(tr('dep.in'))}</button></div>
  </form>`,s=>{
    const f=s.querySelector('form');
    const apply=sign=>{
      const a=parseMoney(f.amount.value), sv0=goalSaved(g);
      if(!(a>0)) return showErr(s,tr('err.amountEx',{ex:exNum(50)}));
      if(sign<0&&a>sv0) return showErr(s,tr('dep.errOnly',{amount:eur(sv0)}));
      const was=sv0>=g.target;
      g.moves.push({id:uid(),date:toISO(today()),amount:round2(sign*a)}); save(); closeWin(1); draw();
      toast(sign>0&&!was&&goalSaved(g)>=g.target?tr('toast.goalDone'):sign>0?tr('toast.depIn',{amount:eur(a)}):tr('toast.depOut',{amount:eur(a)}));
    };
    f.addEventListener('submit',e=>{e.preventDefault();apply(1);});
    s.querySelector('[data-out]').addEventListener('click',()=>apply(-1));
  });
}

// Mitteilungen: ein- und ausschalten, Uhrzeit, Test
function notifyWin(){
  win(tr('nt.title'),`<p class="text">${esc(tr('nt.intro'))}</p><div data-nt></div>`,(s,w)=>{
    const box=s.querySelector('[data-nt]');
    let ready=null, busy=false;                      // ready: null = wird geprüft, false = Supabase noch nicht eingerichtet
    const msg=t=>`<p class="nt-msg">${esc(t)}</p>`;
    const render=note=>{
      const sup=pushSupport();
      if(sup==='homescreen') return box.innerHTML=msg(tr('nt.homescreen'));
      if(sup!=='ok') return box.innerHTML=msg(tr('nt.unsupported'));
      if(Notification.permission==='denied') return box.innerHTML=msg(isIOS?tr('nt.deniedIos'):tr('nt.denied'));
      if(ready===false) return box.innerHTML=msg(tr('nt.notReady'));
      const on=pushOn();
      box.innerHTML=`<button type="button" class="switch-row" data-nt-sw aria-pressed="${on}" ${ready===null||busy?'disabled':''}><span>${esc(busy?tr('busy'):tr('nt.switch'))}</span><span class="switch"></span></button>
        ${note?`<p class="err">${esc(note)}</p>`:''}
        ${on?`<label class="field"><span class="label">${esc(tr('nt.time'))}</span><input class="input" type="time" data-nt-time value="${esc(data.settings.notifyTime)}" required></label>
        <p class="hint" style="margin-top:-8px">${esc(tr('nt.when'))}</p>
        <button type="button" class="btn btn-soft btn-full nt-test" data-nt-test>${ICON.bell}${esc(tr('nt.test'))}</button>`:''}`;
    };
    render();
    w.onClose=()=>{ if(tab==='settings'&&!sub) draw(); };
    if(pushSupport()==='ok'&&Notification.permission!=='denied')
      pushKeyGet().then(k=>{ ready=!!k; render(); }).catch(e=>{ ready=e&&e.status===404?false:true; render(); });
    s.addEventListener('click',async e=>{
      if(e.target.closest('[data-nt-sw]')){
        if(busy||ready===null) return;
        if(pushOn()){ busy=true; render(); try{ await pushDisable(); }catch(x){} busy=false; render(); toast(tr('toast.ntOff')); return; }
        const job=pushEnable();                      // sofort, solange das Tippen noch „frisch“ ist
        busy=true; render();
        try{ const r=await job; busy=false;
          if(r==='ok'){ render(); toast(tr('toast.ntOn')); }
          else if(r==='notready'){ ready=false; render(); }
          else render(r==='dismissed'?tr('nt.dismissed'):'');
        }catch(x){ busy=false; render(x&&x.offline?tr('toast.noNet'):tr('err.generic')); }
        return;
      }
      if(e.target.closest('[data-nt-test]')){
        const b=e.target.closest('[data-nt-test]'); if(b.disabled) return; b.disabled=true;
        try{ await pushJobsSync(); await sbUser('/rest/v1/rpc/push_test',{method:'POST',body:{title:'Finanzo',body:tr('nt.testBody')}}); toast(tr('nt.testSent')); }
        catch(x){ toast(x&&x.offline?tr('toast.noNet'):tr('err.generic')); }
        setTimeout(()=>{ b.disabled=false; },4000);
      }
    });
    s.addEventListener('change',e=>{
      const t=e.target.closest('[data-nt-time]'); if(!t) return;
      if(/^([01]\d|2[0-3]):[0-5]\d$/.test(t.value)&&t.value!==data.settings.notifyTime){
        data.settings.notifyTime=t.value; save(); syncNotifications(false); toast(tr('nt.timeSaved',{time:t.value})); }
      else t.value=data.settings.notifyTime;
    });
  });
}

// E-Mail-Adresse ändern: zur Sicherheit erst das Passwort prüfen
function emailWin(){
  if(!ACCOUNTS||!session) return;
  win(tr('mail.title'),`<form novalidate>
    <p class="text" style="margin-top:0">${esc(tr('mail.current',{email:session.user.email}))}</p>
    <label class="field"><span class="label">${esc(tr('mail.new'))}</span><input class="input" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="${esc(tr('auth.emailPh'))}" data-focus></label>
    <label class="field"><span class="label">${esc(tr('pw.current'))}</span><input class="input" name="pw" type="password" autocomplete="current-password"></label>
    <p class="err" hidden></p><p class="ok-msg" hidden></p>
    <button class="btn btn-main btn-full" type="submit">${esc(tr('mail.save'))}</button>
  </form>`,s=>{
    const f=s.querySelector('form'), btn=f.querySelector('[type=submit]'), err=s.querySelector('.err'), ok=s.querySelector('.ok-msg');
    const info=(e,o)=>{ err.textContent=e||''; err.hidden=!e; ok.textContent=o||''; ok.hidden=!o; };
    const busy=on=>{ btn.disabled=on; btn.textContent=on?tr('busy'):tr('mail.save'); };
    f.addEventListener('submit',async e=>{ e.preventDefault();
      const email=f.email.value.trim().toLowerCase(), pw=f.pw.value;
      if(!emailOk(email)) return info(tr('auth.needEmail'));
      if(email===String(session.user.email).toLowerCase()) return info(tr('mail.same'));
      if(!pw) return info(tr('pw.needOld'));
      info(); busy(true);
      try{
        let j;
        try{ j=await sbFetch('/auth/v1/token?grant_type=password',{method:'POST',body:{email:session.user.email,password:pw}}); }
        catch(x){ if(!x.offline&&x.status===400&&(x.code==='invalid_credentials'||x.code==='invalid_grant'||!x.code)) x.wrongOld=true; throw x; }
        saveSession(toSession(j));                                                   // frisch angemeldet
        const u=await sbFetch('/auth/v1/user?redirect_to='+encodeURIComponent(appUrl()),{method:'PUT',body:{email},token:session.access_token});
        if(u&&String(u.email||'').toLowerCase()===email){                            // sofort geändert
          session.user.email=u.email; saveSession(session);
          closeWin(stack.length); draw(); toast(tr('toast.mailChanged'));
        } else { busy(false); info('',tr('mail.confirm',{email})); }                 // muss erst bestätigt werden
      }catch(x){ busy(false);
        const c=String(x&&x.code||''), m=String(x&&x.message||'').toLowerCase();
        info(x&&x.wrongOld?tr('pw.wrongOld'):(c==='email_exists'||c==='user_already_exists'||m.includes('already been registered'))?tr('mail.taken'):authMsg(x)); }
    });
  });
}
// Liste zum Auswählen (Sprache, Aussehen)
const optRow=(attr,v,title,sub,sel)=>`<li><button type="button" class="opt" ${attr}="${esc(v)}" aria-selected="${sel}"><span class="opt-main"><b>${esc(title)}</b>${sub?`<small>${esc(sub)}</small>`:''}</span><span class="tick">${sel?ICON.check:''}</span></button></li>`;
function langWin(){
  let names=null; try{ names=new Intl.DisplayNames([LOC],{type:'language'}); }catch(e){}
  const local=c=>{ try{ const n=names&&names.of(c==='zh'?'zh-Hans':c); return n&&n.toLowerCase()!==langName(c).toLowerCase()?n.charAt(0).toLocaleUpperCase(LOC)+n.slice(1):''; }catch(e){ return ''; } };
  let en=null; try{ en=new Intl.DisplayNames(['en'],{type:'language'}); }catch(e){}
  const cur=data.settings.lang, all=LANGS.map(([c,n])=>({c,n,loc:local(c),en:(()=>{ try{ return en?en.of(c):''; }catch(e){ return ''; } })()}));
  const autoRow=()=>`<ul class="opt-list">${optRow('data-l','auto',tr('lang.auto'),tr('lang.autoSub',{name:langName(phoneLang())}),cur==='auto')}</ul><div class="opt-sep"></div>`;
  win(tr('set.lang'),`<div class="cur-search"><input class="input" type="search" placeholder="${esc(tr('lang.searchPh'))}" data-lq autocomplete="off" aria-label="${esc(tr('lang.searchPh'))}"></div><div data-lres></div>`,s=>{
    const box=s.querySelector('[data-lres]'), q=s.querySelector('[data-lq]');
    const norm=x=>String(x||'').toLocaleLowerCase(LOC).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const render=()=>{
      const t=norm(q.value.trim());
      const starts=v=>{ const n=norm(v); return n.startsWith(t)||n.split(/[\s()\-·]+/).some(w=>w.startsWith(t)); };   // Wortanfang zählt
      const hits=t?all.filter(x=>x.c===t||[x.n,x.loc,x.en].some(starts)):all;
      box.innerHTML=(t?'':autoRow())+(hits.length?`<ul class="opt-list">${hits.map(x=>optRow('data-l',x.c,x.n,x.loc,cur===x.c)).join('')}</ul>`:`<p class="cur-none">${esc(tr('lang.none'))}</p>`);
    };
    render(); q.addEventListener('input',render); searchKeys(q); s.classList.add('sheet-tall');
    s.addEventListener('click',e=>{
      const b=e.target.closest('[data-l]'); if(!b) return;
      data.settings.lang=b.dataset.l; setLang(data.settings.lang); setCurrency(data.settings.currency); save();
      closeWin(1); paintStatic(); draw(); toast(tr('toast.lang',{name:langName(LANG)}));
    });
  });
}
function themeWin(){
  const cur=data.settings.theme||'system';
  win(tr('set.theme'),`<ul class="opt-list" data-set="theme">${['light','dark','system'].map(v=>optRow('data-v',v,tr('theme.'+v),v==='system'?tr('theme.systemSub'):'',cur===v)).join('')}</ul>`,s=>{
    s.addEventListener('click',e=>{
      const b=e.target.closest('[data-v]'); if(!b) return;
      data.settings.theme=b.dataset.v; save(); applyTheme(); closeWin(1); draw();
    });
  });
}
// Passwort ändern: erst das aktuelle Passwort prüfen, dann das neue speichern
function passwordWin(){
  if(!ACCOUNTS||!session) return;
  win(tr('pw.title'),`<form novalidate>
    <label class="field"><span class="label">${esc(tr('pw.current'))}</span><input class="input" name="old" type="password" autocomplete="current-password" data-focus></label>
    <label class="field"><span class="label">${esc(tr('pw.new'))}</span><input class="input" name="pw" type="password" autocomplete="new-password" placeholder="${esc(tr('auth.pwMin'))}"></label>
    <label class="field"><span class="label">${esc(tr('pw.new2'))}</span><input class="input" name="pw2" type="password" autocomplete="new-password"></label>
    <p class="err" hidden></p><p class="ok-msg" hidden></p>
    <button class="btn btn-main btn-full" type="submit">${esc(tr('auth.savePw'))}</button>
    <button type="button" class="link-btn" data-pw-forgot>${esc(tr('pw.forgot'))}</button>
  </form>`,s=>{
    const f=s.querySelector('form'), btn=f.querySelector('[type=submit]'), err=s.querySelector('.err'), ok=s.querySelector('.ok-msg');
    const info=(e,o)=>{ err.textContent=e||''; err.hidden=!e; ok.textContent=o||''; ok.hidden=!o; };
    const busy=on=>{ btn.disabled=on; btn.textContent=on?tr('busy'):tr('auth.savePw'); };
    f.addEventListener('submit',async e=>{ e.preventDefault();
      const old=f.old.value, pw=f.pw.value, pw2=f.pw2.value;
      if(!old) return info(tr('pw.needOld'));
      if(pw.length<8) return info(tr('pw.short'));
      if(pw!==pw2) return info(tr('pw.mismatch'));
      if(pw===old) return info(tr('err.samePw'));
      info(); busy(true);
      try{
        let j;
        try{ j=await sbFetch('/auth/v1/token?grant_type=password',{method:'POST',body:{email:session.user.email,password:old}}); }
        catch(x){ if(!x.offline&&x.status===400&&(x.code==='invalid_credentials'||x.code==='invalid_grant'||!x.code)) x.wrongOld=true; throw x; }
        saveSession(toSession(j));                                   // frisch angemeldet: darf das Passwort ändern
        await sbFetch('/auth/v1/user',{method:'PUT',body:{password:pw},token:session.access_token});
        closeWin(stack.length); toast(tr('toast.newPw'));
      }catch(x){ busy(false); info(x&&x.wrongOld?tr('pw.wrongOld'):authMsg(x)); }
    });
    s.querySelector('[data-pw-forgot]').addEventListener('click',async()=>{
      info();
      try{ await sbFetch('/auth/v1/recover?redirect_to='+encodeURIComponent(appUrl()),{method:'POST',body:{email:session.user.email}});
        info('',tr('pw.mailSent',{email:session.user.email})); }
      catch(x){ info(authMsg(x)); }
    });
  });
}
function currencyWin(onPick){
  const all=CURRENCIES.map(code=>({code,name:curName(code),sym:curSymbol(code)})).sort((a,b)=>a.name.localeCompare(b.name,LOC));
  const row=c=>`<li><button type="button" class="cur" data-code="${c.code}" aria-selected="${c.code===data.settings.currency}">
    <span class="cur-name">${esc(c.name)}<small>${c.code}</small></span><span class="cur-sym">${c.code===data.settings.currency?ICON.check:(c.sym!==c.code?esc(c.sym):'')}</span></button></li>`;
  win(tr('cur.title'),`<div class="cur-search"><input class="input" type="search" placeholder="${esc(tr('cur.searchPh'))}" data-q autocomplete="off"></div>
    <p class="text" style="margin-top:0" data-cnote>${esc(tr('cur.note'))}</p><div data-results></div>`,s=>{
    const box=s.querySelector('[data-results]'), q=s.querySelector('[data-q]'), note=s.querySelector('[data-cnote]');
    const render=()=>{
      const t=q.value.trim().toLowerCase(); note.hidden=!!t;
      if(!t) box.innerHTML=`<div class="cur-group">${esc(tr('cur.popular'))}</div><ul class="cur-list">${POPULAR.map(c=>all.find(x=>x.code===c)).filter(Boolean).map(row).join('')}</ul>
        <div class="cur-group">${esc(tr('cur.all'))}</div><ul class="cur-list">${all.map(row).join('')}</ul>`;
      else { const hits=all.filter(c=>c.name.toLowerCase().includes(t)||c.code.toLowerCase().includes(t)||c.sym.toLowerCase()===t);
        box.innerHTML=hits.length?`<ul class="cur-list">${hits.map(row).join('')}</ul>`:`<p class="cur-none">${esc(tr('cur.none'))}</p>`; }
    };
    render(); q.addEventListener('input',render); searchKeys(q); s.classList.add('sheet-tall');
    box.addEventListener('click',e=>{
      const b=e.target.closest('[data-code]'); if(!b) return;
      data.settings.currency=b.dataset.code; setCurrency(b.dataset.code); save();
      closeWin(1); draw(); if(onPick) onPick(); toast(tr('toast.cur',{name:curName(b.dataset.code)}));
    });
  });
}

/* =====================================================================
   Zoomen ausschalten
   ===================================================================== */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{ if(e.touches&&e.touches.length>1) e.preventDefault(); },{passive:false});
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{ const now=Date.now(); if(now-lastTouchEnd<300&&!e.target.closest('input,textarea,select,button,label,a')) e.preventDefault(); lastTouchEnd=now; },{passive:false});
document.addEventListener('wheel',e=>{ if(e.ctrlKey) e.preventDefault(); },{passive:false});
document.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].includes(e.key)) e.preventDefault(); });

/* =====================================================================
   Klicks
   ===================================================================== */
const OPEN={expense:expenseWin,income:incomeWin,contract:contractWin,task:taskWin,goal:goalWin};
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.closest('.sheet')) return;
  const d=b.dataset;
  if(d.tab||d.tabGo){ const t=d.tab||d.tabGo; if(t==='stats'&&(tab!=='stats'||sub)) statAnchor=today(); return go(t); }
  if(d.sub) return go(tab,d.sub);
  if(b.hasAttribute('data-back')) return go(tab);
  if(b.hasAttribute('data-add-expense')) return expenseWin();
  if(d.open){ const [k,id]=d.open.split(':'); if(OPEN[k]) OPEN[k](id); return; }
  if(d.filter){ listFilter=d.filter; document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',x===b)); renderList(); return; }
  if(b.hasAttribute('data-search-toggle')){ if(searchOpen||listQuery){ searchOpen=false; listQuery=''; } else searchOpen=true; drawList(); return; }
  if(b.hasAttribute('data-pick-month')) return monthPickerWin();
  if(d.month){ const x=new Date(listMonth.y,listMonth.m+Number(d.month),1); listMonth={y:x.getFullYear(),m:x.getMonth()}; renderList(); return; }
  if(d.statMonth){ const [y,m]=d.statMonth.split('-').map(Number); statAnchor=new Date(y,m,1); draw(); return; }
  if(d.catDetail) return catDetailWin(d.catDetail);
  if(d.budget) return budgetWin(d.budget);
  if(b.hasAttribute('data-budget-new')) return budgetWin();
  if(b.hasAttribute('data-add-income')) return incomeWin();
  if(d.income) return incomeWin(d.income);
  if(b.hasAttribute('data-add-contract')) return contractWin();
  if(d.contract) return contractWin(d.contract);
  if(b.hasAttribute('data-add-task')) return taskWin();
  if(d.task) return taskWin(d.task);
  if(d.check){ const x=data.tasks.find(t=>t.id===d.check); if(x) setDone(x,!x.done); return; }
  if(b.hasAttribute('data-add-goal')) return goalWin();
  if(d.goal) return goalWin(d.goal);
  if(d.deposit) return depositWin(d.deposit);
});
// Neuer Tag / App wieder geöffnet: Anzeige und Nachrichten aktualisieren
let lastDay=toISO(today());
// Wer länger weg war (5 Minuten), kommt wieder auf Start – außer ein Fenster ist noch offen
const BACK_TO_START=5*60*1000; let leftAt=0;
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ leftAt=Date.now(); return; }
  if(leftAt&&Date.now()-leftAt>=BACK_TO_START&&!stack.length&&(tab!=='start'||sub)) go('start'); leftAt=0;
  if(toISO(today())!==lastDay){lastDay=toISO(today());if(!stack.length)draw();} showDueNotifications(); if(ACCOUNTS&&session) pull(); });
window.addEventListener('online',()=>{ updateSyncInfo(); if(ACCOUNTS&&session){ if(isDirty()) push(); else pull(); photoSyncSoon(); } });
window.addEventListener('offline',updateSyncInfo);
window.addEventListener('hashchange',()=>{ if(ACCOUNTS&&/(^#|&)(access_token|error_code)=/.test(location.hash)) bootAccount(); });
setInterval(()=>{ if(toISO(today())!==lastDay){lastDay=toISO(today());if(!stack.length)draw();} showDueNotifications(); },15*60*1000);

/* =====================================================================
   Start
   ===================================================================== */
paintIcons();
paintStatic();
fillSince();
applyTheme();
draw();
saveLocal();   // speichert übernommene Daten aus älteren Versionen
splashStep(.35);   // Daten auf dem Gerät sind da
const booted=bootAccount().catch(()=>{});
Promise.race([booted,new Promise(r=>setTimeout(r,SPLASH_MAX))]).then(()=>splashHide());
booted.then(()=>{ pushCheck(); pushJobsSoon(2500); photoSyncSoon(4000); });
if(data.tasks.length||data.contracts.some(inTrial)) syncNotifications(false);
showDueNotifications();
// Online-Version (iPhone): auch ohne Internet starten können
if((location.protocol==='https:'||location.hostname==='localhost')&&!window.Capacitor&&'serviceWorker' in navigator){
  try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
}
