/* =====================================================================
   Fenster (öffnen/schließen, auch mit der Zurück-Taste am Handy)
   ===================================================================== */
const stack=[];
let useHistory=false;
try{ useHistory=window.self===window.top; if(useHistory) history.replaceState({w:0},''); }catch(e){ useHistory=false; }
function dropTop(){const w=stack.pop();if(!w)return;w.el.remove();if(w.onClose)w.onClose();if(!stack.length&&pullWanted){pullWanted=false;setTimeout(pull,0);}}
window.addEventListener('popstate',e=>{ if(!useHistory) return; const depth=(e.state&&e.state.w)||0; while(stack.length>depth) dropTop(); });
function closeWin(n=1){
  n=Math.min(n,stack.length); if(!n) return;
  for(let i=0;i<n;i++) dropTop();
  if(useHistory){ try{ history.go(-n); }catch(e){} }
}
function win(title,body,setup){
  const el=document.createElement('div'); el.className='scrim';
  el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-top"><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-close aria-label="Schließen">${ICON.x}</button></div>${body}</div>`;
  document.body.appendChild(el);
  const w={el}; stack.push(w);
  if(useHistory){ try{ history.pushState({w:stack.length},''); }catch(e){ useHistory=false; } }
  el.addEventListener('click',e=>{ if(e.target===el||e.target.closest('[data-close]')){ e.preventDefault(); closeWin(stack.length-stack.indexOf(w)); } });
  // Wischen nur erlauben, wo es wirklich etwas zu scrollen gibt (sonst bewegt sich nichts)
  el.addEventListener('touchmove',e=>{ if(e.touches&&e.touches.length>1) return;
    const sc=e.target.closest&&e.target.closest('[data-wheel-scroll],.sheet');
    if(sc&&sc.scrollHeight>sc.clientHeight+1) return; e.preventDefault(); },{passive:false});
  const sheet=el.querySelector('.sheet'); if(setup) setup(sheet,w);
  const first=sheet.querySelector('[data-focus]');
  if(first&&matchMedia('(min-width:760px)').matches) setTimeout(()=>{try{first.focus();}catch(e){}},60);
  return w;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&stack.length){e.preventDefault();closeWin(1);}});
function ask(title,text,okText){
  return new Promise(res=>{let done=false;
    win(title,`<p class="text">${esc(text)}</p><div class="btns"><button type="button" class="btn btn-soft" data-close>Abbrechen</button><button type="button" class="btn btn-red" data-ok>${esc(okText)}</button></div>`,(s,w)=>{
      w.onClose=()=>{if(!done){done=true;res(false);}};
      s.querySelector('[data-ok]').addEventListener('click',()=>{if(done)return;done=true;res(true);});
    });});
}
// Fenster mit zwei Möglichkeiten; schließen ohne Wahl ist nicht möglich
function choose(title,text,aLabel,bLabel){
  return new Promise(res=>{let done=false;
    const open=()=>win(title,`<p class="text">${esc(text)}</p><div class="btns"><button type="button" class="btn btn-main" data-a>${esc(aLabel)}</button><button type="button" class="btn btn-soft" data-b>${esc(bLabel)}</button></div>`,(s,w)=>{
      w.onClose=()=>{ if(!done) setTimeout(open,0); };
      s.querySelector('[data-a]').addEventListener('click',()=>{done=true;closeWin(1);res('a');});
      s.querySelector('[data-b]').addEventListener('click',()=>{done=true;closeWin(1);res('b');});
    });
    open();
  });
}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400);}
const showErr=(s,msg)=>{const e=s.querySelector('.err');e.textContent=msg;e.hidden=false;};
const moneyField=(label,value,focus,name='amount')=>`<label class="field"><span class="label">${label}</span><span class="money"><input class="input" name="${name}" value="${esc(moneyInput(value))}" inputmode="decimal" placeholder="0,00" autocomplete="off" ${focus?'data-focus':''}><span>${esc(curSymbol(data.settings.currency))}</span></span></label>`;
const choice=(name,options,current,cls='')=>`<div class="choice ${cls}" data-choice="${name}">${options.map(o=>
  `<button type="button" data-v="${o.v}" aria-pressed="${String(o.v)===String(current)}">${o.icon?`<span class="c-ic" style="color:${o.dot}">${ICON[o.icon]}</span>`:o.dot?`<span class="dot" style="background:${o.dot}"></span>`:''}${esc(o.l)}</button>`).join('')}</div>`;
function wireChoice(root){root.querySelectorAll('[data-choice]').forEach(box=>box.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; box.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));}));}
const choiceValue=(root,name)=>{const b=root.querySelector(`[data-choice="${name}"] [aria-pressed="true"]`);return b?b.dataset.v:null;};
const quick=list=>`<div class="quick">${list.map(q=>`<button type="button" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`;
function wireQuick(s,input,next){s.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();input.value=b.dataset.q;if(next)next.focus();}));}
function wireSwitch(s,attr,onChange){const b=s.querySelector(`[${attr}]`);b.addEventListener('click',()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);onChange(on);});return ()=>b.getAttribute('aria-pressed')==='true';}
const remindField=v=>`<label class="field"><span class="label">Wann erinnern?</span>
  <span class="date-btn"><span class="date-ic">${ICON.bell}</span><input class="input" type="date" name="remindOn" value="${esc(v)}" aria-label="Datum der Erinnerung"></span></label>`;
// Ändert man das Datum, wandert der Erinnerungstag mit – bis man ihn selbst ändert
function linkRemindOn(dateInput,remindInput,gap){
  let touched=false;
  ['input','change'].forEach(ev=>{
    remindInput.addEventListener(ev,()=>{touched=true;});
    dateInput.addEventListener(ev,()=>{ if(!touched&&isISO(dateInput.value)) remindInput.value=remindDefault(dateInput.value,gap); });
  });
}

      const amount=parseMoney(f.amount.value), date=f.date.value, note=f.note.value.trim();
      const cat=kind==='in'?'sonstiges':(choiceValue(s,'cat')||'sonstiges');
      if(!(amount>0)) return showErr(s,'Bitte gib einen Betrag ein, zum Beispiel 12,50.');
      if(!isISO(date)) return showErr(s,'Bitte wähle ein Datum.');
      if(x) Object.assign(x,{amount,date,cat,note}); else data.expenses.push({id:uid(),kind,amount,date,cat,note,createdAt:Date.now()});
      if(kind!=='in') store.set('finanzo-lastcat',cat);
      const d=fromISO(date); if(tab==='list') listMonth={y:d.getFullYear(),m:d.getMonth()};
      save(); closeWin(1); draw();
      if(kind==='in') return toast('Gespeichert');
      const b=data.budgets[cat], sp=catSpent(d.getFullYear(),d.getMonth(),cat), c=catOf(cat);
      if(b&&sp>b) toast(`Gespeichert. Budget für ${c.label} überschritten!`);
      else if(b&&sp>=b*0.8) toast(`Gespeichert. Noch ${eur(round2(b-sp))} im Budget für ${c.label}.`);
      else toast('Gespeichert');
    });
    const del=s.querySelector('[data-del]');
    if(del) del.addEventListener('click',async()=>{
      if(!await ask(x.kind==='in'?'Einnahme löschen?':'Ausgabe löschen?','Die Buchung wird gelöscht.','Löschen')) return;
      data.expenses=data.expenses.filter(e=>e!==x); save(); closeWin(2); draw(); toast('Gelöscht');
    });
  });
}

/* ---------- Budget ---------- */
function budgetWin(catId){
  const pick=!catId, t=today();
  const first=catId||(EXP_CATS.find(c=>!data.budgets[c.id])||EXP_CATS[0]).id;
  const c=catOf(first), b=data.budgets[first]||0;
  const y=t.getFullYear(), m=t.getMonth();
  win(pick?'Budget festlegen':`Budget: ${c.label}`,`<form novalidate>
    ${pick?`<div class="field"><span class="label">Für welche Kategorie?</span>${choice('cat',EXP_CATS.map(k=>({v:k.id,l:k.label,dot:k.color,icon:k.icon})),first,'cats')}</div>`
      :`<p class="text">Im ${esc(monthName(y,m))} schon ausgegeben: <b>${eur(catSpent(y,m,first))}</b></p>`}
    ${moneyField('Höchstens pro Monat',b,!pick)}
    <p class="err" hidden></p>
    <button class="btn btn-main btn-full" type="submit">Speichern</button>
    ${!pick&&b?'<div class="btns"><button type="button" class="btn btn-red" data-del>Budget entfernen</button></div>':''}
  </form>`,s=>{
    wireChoice(s);
    const f=s.querySelector('form'), box=s.querySelector('[data-choice="cat"]');
    if(box) box.addEventListener('click',()=>{ const v=data.budgets[choiceValue(s,'cat')]; f.amount.value=v?moneyInput(v):''; });
    f.addEventListener('submit',e=>{e.preventDefault();
      const cat=pick?choiceValue(s,'cat'):first, amount=parseMoney(f.amount.value);
      if(!(amount>0)) return showErr(s,'Bitte gib einen Betrag ein, zum Beispiel 150,00.');
      data.budgets[cat]=amount; save(); closeWin(1); draw(); toast(`Budget für ${catOf(cat).label} gespeichert`);
    });
    const del=s.querySelector('[data-del]');
    if(del) del.addEventListener('click',()=>{ delete data.budgets[first]; save(); closeWin(1); draw(); toast('Budget entfernt'); });
  });
}

/* ---------- Termin ---------- */
function taskWin(id){
  const x=id?data.tasks.find(t=>t.id===id):null; if(id&&!x) return;
  const d0=toISO(addDays(today(),7));
  const v=x||{title:'',date:d0,amount:0,note:'',remindOn:remindDefault(d0,3)};
  win(x?'Termin ändern':'Neuer Termin',`<form novalidate>
    <label class="field"><span class="label">Was?</span><input class="input" name="title" value="${esc(v.title)}" placeholder="z. B. Strafzettel bezahlen" maxlength="60" autocomplete="off" ${x?'':'data-focus'}></label>
    <label class="field"><span class="label">Wann?</span><input class="input" type="date" name="date" value="${esc(v.date)}"></label>
    <button type="button" class="switch-row" data-money aria-pressed="${v.amount>0}"><span>Muss ich etwas bezahlen?</span><span class="switch"></span></button>
    <div data-money-on ${v.amount>0?'':'hidden'}>${moneyField('Betrag',v.amount)}</div>
    <label class="field"><span class="label">Notiz</span><textarea class="input" name="note" maxlength="300">${esc(v.note)}</textarea></label>
    ${remindField(v.remindOn)}
    <p class="err" hidden></p>
    <button class="btn btn-main btn-full" type="submit">Speichern</button>
    ${x?`<div class="btns"><button type="button" class="btn btn-soft" data-done>${x.done?'Wieder öffnen':'Erledigt'}</button><button type="button" class="btn btn-red" data-del>Löschen</button></div>`:''}
  </form>`,s=>{
    const f=s.querySelector('form');
    const moneyOn=wireSwitch(s,'data-money',on=>{ s.querySelector('[data-money-on]').hidden=!on; if(on) f.amount.focus(); });
    linkRemindOn(f.date,f.remindOn,x?daysBetween(fromISO(x.remindOn),fromISO(x.date)):3);
    f.addEventListener('submit',e=>{e.preventDefault();
      const title=f.title.value.trim(), date=f.date.value, note=f.note.value.trim(), remindOn=f.remindOn.value;
      const amount=moneyOn()?parseMoney(f.amount.value):0;
      if(!title) return showErr(s,'Bitte gib ein, worum es geht.');
      if(!isISO(date)) return showErr(s,'Bitte wähle ein Datum.');
      if(moneyOn()&&!(amount>0)) return showErr(s,'Bitte gib den Betrag ein, zum Beispiel 30,00.');
      if(!isISO(remindOn)) return showErr(s,'Bitte wähle, wann du erinnert werden willst.');
      if(remindOn>date) return showErr(s,'Die Erinnerung muss vor dem Termin oder am selben Tag sein.');
      const d={title,date,amount:round2(amount),note,remindOn};
      if(x){ if(x.date!==date||x.remindOn!==remindOn) d.notified=''; Object.assign(x,d); }
      else data.tasks.push(mkTask(d));
      save(); closeWin(1); draw(); toast('Gespeichert');
      syncNotifications(true);
    });
    const dn=s.querySelector('[data-done]');
    if(dn) dn.addEventListener('click',()=>{ closeWin(1); setDone(x,!x.done); });
    const del=s.querySelector('[data-del]');
    if(del) del.addEventListener('click',async()=>{
      if(!await ask('Termin löschen?',`„${x.title}“ wird gelöscht.`,'Löschen')) return;
      data.tasks=data.tasks.filter(t=>t!==x); save(); closeWin(2); draw(); toast('Gelöscht'); syncNotifications(false);
    });
  });
}
function setDone(x,done){
  x.done=done; x.doneAt=done?toISO(today()):'';
  save(); draw(); toast(done?(x.amount?'Als bezahlt abgehakt':'Erledigt'):'Wieder offen');
  syncNotifications(false);
}

/* ---------- Sparziel ---------- */
function goalWin(id){
  const g=id?data.goals.find(x=>x.id===id):null; if(id&&!g) return;
  const v=g||{name:'',target:0,until:'',icon:'ziel'};
  win(g?'Sparziel ändern':'Neues Sparziel',`<form novalidate>
    <div class="field"><label><span class="label">Wofür sparst du?</span><input class="input" name="name" value="${esc(v.name)}" placeholder="z. B. Urlaub" maxlength="40" autocomplete="off" ${g?'':'data-focus'}></label>
      ${g?'':quick(['Auto','Urlaub','Notgroschen','Handy'])}</div>
    <div class="field"><span class="label">Symbol</span><div class="icon-pick" data-choice="icon">${GOAL_ICONS.map(([k,l,ic])=>
      `<button type="button" data-v="${k}" aria-pressed="${k===v.icon}" aria-label="${l}" title="${l}">${ICON[ic]}</button>`).join('')}</div></div>
    ${moneyField('Wie viel brauchst du?',v.target,false,'target')}
    ${g?'':moneyField('Hast du schon etwas gespart?',0,false,'start')}
    <label class="field"><span class="label">Bis wann?</span><input class="input" type="date" name="until" value="${esc(v.until)}">
      <span class="hint">Mit Datum rechnet Finanzo aus, wie viel du pro Tag oder pro Monat sparen musst.</span></label>
    <p class="err" hidden></p>
    <button class="btn btn-main btn-full" type="submit">Speichern</button>
    ${g?'<div class="btns"><button type="button" class="btn btn-red" data-del>Sparziel löschen</button></div>':''}
  </form>`,s=>{
    wireChoice(s);
    const f=s.querySelector('form'); wireQuick(s,f.name,f.target);
    let touched=!!g;
    const pickBox=s.querySelector('[data-choice="icon"]');
    pickBox.addEventListener('click',()=>{touched=true;});
    const guess=()=>{ if(touched) return; const ic=guessGoalIcon(f.name.value); pickBox.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===ic)); };
    f.name.addEventListener('input',guess); s.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',guess));
    f.addEventListener('submit',e=>{e.preventDefault();
      const name=f.name.value.trim(), target=parseMoney(f.target.value), until=f.until.value, icon=choiceValue(s,'icon')||guessGoalIcon(name);
      const st=f.start?f.start.value.trim():'', start=st?parseMoney(st):0;
      if(!name) return showErr(s,'Bitte gib ein, wofür du sparst.');
      if(!(target>0)) return showErr(s,'Bitte gib ein, wie viel du brauchst, zum Beispiel 2.000,00.');
      if(!(start>=0)) return showErr(s,'Bitte gib eine Zahl ein, zum Beispiel 0 oder 150,00.');
      if(g) Object.assign(g,{name,target,icon,until:isISO(until)?until:''});
      else data.goals.push({id:uid(),name,target,start,moves:[],until:isISO(until)?until:'',color:data.goals.length%GOAL_COLORS.length,icon});
      save(); closeWin(1); draw(); toast('Gespeichert');
    });
    const del=s.querySelector('[data-del]');
    if(del) del.addEventListener('click',async()=>{
      if(!await ask('Sparziel löschen?',`„${g.name}“ wird gelöscht.`,'Löschen')) return;
      data.goals=data.goals.filter(x=>x!==g); save(); closeWin(2); draw(); toast('Gelöscht');
    });
  });
}
function depositWin(id){
  const g=data.goals.find(x=>x.id===id); if(!g) return;
  win(g.name,`<form novalidate>
    <p class="text">Gespart: <b>${eur(goalSaved(g))}</b> von ${eur(g.target)}</p>
    ${moneyField('Betrag',0,true)}
    <p class="hint" style="margin-top:-8px">Eingezahltes Geld zählt auf der Startseite als „Gespart“ und ist nicht mehr zum Ausgeben übrig.</p>
    <p class="err" hidden></p>
    <div class="btns"><button type="button" class="btn btn-soft" data-out>Rausnehmen</button><button class="btn btn-main" type="submit">Einzahlen</button></div>
  </form>`,s=>{
    const f=s.querySelector('form');
    const apply=sign=>{
      const a=parseMoney(f.amount.value), sv0=goalSaved(g);
      if(!(a>0)) return showErr(s,'Bitte gib einen Betrag ein, zum Beispiel 50,00.');
      if(sign<0&&a>sv0) return showErr(s,`Du hast hier nur ${eur(sv0)} gespart.`);
      const was=sv0>=g.target;
      g.moves.push({id:uid(),date:toISO(today()),amount:round2(sign*a)}); save(); closeWin(1); draw();
      toast(sign>0&&!was&&goalSaved(g)>=g.target?'Geschafft! Ziel erreicht.':sign>0?`${eur(a)} eingezahlt`:`${eur(a)} rausgenommen`);
    };
    f.addEventListener('submit',e=>{e.preventDefault();apply(1);});
    s.querySelector('[data-out]').addEventListener('click',()=>apply(-1));
  });
}

/* =====================================================================
   Einstellungen
   ===================================================================== */
const seg=(key,options)=>`<div class="seg" role="group" data-set="${key}">${options.map(([v,l])=>
  `<button type="button" data-v="${v}" aria-pressed="${String(data.settings[key])===String(v)}">${l}</button>`).join('')}</div>`;
function curLabel(){ const code=data.settings.currency, sym=curSymbol(code); return `<span>${esc(curName(code))}</span><small>${esc(code)}${sym!==code?' '+esc(sym):''}</small>${ICON.right}`; }
/* ---------- Reiter: Einstellungen ---------- */
function drawSettings(){
  $('#view').innerHTML=`<h1 class="page-title">Einstellungen</h1>
    <section class="card set-card">
    <div class="set"><h3>Dein Name</h3><input class="input" data-name value="${esc(data.settings.name)}" placeholder="z. B. Alex" maxlength="30" autocomplete="given-name" aria-label="Dein Name"></div>
    <div class="set"><h3>Aussehen</h3>${seg('theme',[['light','Hell'],['dark','Dunkel'],['system','System']])}</div>
    <div class="set"><h3>Währung</h3><button type="button" class="pick" data-currency>${curLabel()}</button></div>
    ${ACCOUNTS&&session?`<div class="set"><h3>Konto</h3><p>Angemeldet als <b>${esc(session.user.email)}</b></p><p class="sync-info" data-sync>${esc(syncText())}</p>
      <div class="btns" style="margin-top:0"><button type="button" class="btn btn-soft" data-logout>Abmelden</button><button type="button" class="btn btn-red" data-delacc>Konto löschen</button></div></div>`:''}
    </section>
    <p class="version">Finanzo Version ${APP_VERSION}</p>`;
  const s=$('#view');
  const lo=s.querySelector('[data-logout]'); if(lo) lo.addEventListener('click',logout);
  const da=s.querySelector('[data-delacc]'); if(da) da.addEventListener('click',deleteAccount);
  const nm=s.querySelector('[data-name]');
  nm.addEventListener('input',()=>{ data.settings.name=nm.value.trim().slice(0,30); save(); });
  s.querySelectorAll('[data-set]').forEach(g=>g.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    data.settings[g.dataset.set]=b.dataset.v; g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    save(); applyTheme();
  }));
  s.querySelector('[data-currency]').addEventListener('click',()=>currencyWin());
}
function currencyWin(onPick){
  const all=CURRENCIES.map(code=>({code,name:curName(code),sym:curSymbol(code)})).sort((a,b)=>a.name.localeCompare(b.name,'de'));
  const row=c=>`<li><button type="button" class="cur" data-code="${c.code}" aria-selected="${c.code===data.settings.currency}">
    <span class="cur-name">${esc(c.name)}<small>${c.code}</small></span><span class="cur-sym">${c.code===data.settings.currency?ICON.check:(c.sym!==c.code?esc(c.sym):'')}</span></button></li>`;
  win('Währung',`<div class="cur-search"><input class="input" type="search" placeholder="Suchen, z. B. Dollar oder USD" data-q autocomplete="off"></div>
    <p class="text" style="margin-top:0">Die Beträge werden dabei nicht umgerechnet, nur das Zeichen ändert sich.</p><div data-results></div>`,s=>{
    const box=s.querySelector('[data-results]'), q=s.querySelector('[data-q]');
    const render=()=>{
      const t=q.value.trim().toLowerCase();
      if(!t) box.innerHTML=`<div class="cur-group">Häufig</div><ul class="cur-list">${POPULAR.map(c=>all.find(x=>x.code===c)).filter(Boolean).map(row).join('')}</ul>
        <div class="cur-group">Alle Währungen</div><ul class="cur-list">${all.map(row).join('')}</ul>`;
      else { const hits=all.filter(c=>c.name.toLowerCase().includes(t)||c.code.toLowerCase().includes(t)||c.sym.toLowerCase()===t);
        box.innerHTML=hits.length?`<ul class="cur-list">${hits.map(row).join('')}</ul>`:`<p class="cur-none">Keine Währung gefunden.</p>`; }
    };
    render(); q.addEventListener('input',render);
    box.addEventListener('click',e=>{
      const b=e.target.closest('[data-code]'); if(!b) return;
      data.settings.currency=b.dataset.code; setCurrency(b.dataset.code); save();
      closeWin(1); draw(); if(onPick) onPick(); toast(`Währung: ${curName(b.dataset.code)}`);
    });
  });
}

/* =====================================================================
   Zoomen ausschalten
   ===================================================================== */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{ if(e.touches&&e.touches.length>1) e.preventDefault(); },{passive:false});
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{ const now=Date.now(); if(now-lastTouchEnd<300&&!e.target.closest('input,textarea,select,button,label,a')) e.preventDefault(); lastTouchEnd=now; },{passive:false});
document.addEventListener('wheel',e=>{ if(e.ctrlKey) e.preventDefault(); },{passive:false});
document.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].includes(e.key)) e.preventDefault(); });

/* =====================================================================
   Klicks
   ===================================================================== */
const OPEN={expense:expenseWin,income:incomeWin,contract:contractWin,task:taskWin,goal:goalWin};
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.closest('.sheet')) return;
  const d=b.dataset;
  if(d.tab||d.tabGo){ const t=d.tab||d.tabGo; if(t==='stats'&&(tab!=='stats'||sub)) statAnchor=today(); return go(t); }
  if(d.sub) return go(tab,d.sub);
  if(b.hasAttribute('data-back')) return go(tab);
  if(b.hasAttribute('data-add-expense')) return expenseWin();
  if(d.open){ const [k,id]=d.open.split(':'); if(OPEN[k]) OPEN[k](id); return; }
  if(d.filter){ listFilter=d.filter; document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',x===b)); renderList(); return; }
  if(b.hasAttribute('data-search-toggle')){ if(searchOpen||listQuery){ searchOpen=false; listQuery=''; } else searchOpen=true; drawList(); return; }
  if(b.hasAttribute('data-pick-month')) return monthPickerWin();
  if(d.month){ const x=new Date(listMonth.y,listMonth.m+Number(d.month),1); listMonth={y:x.getFullYear(),m:x.getMonth()}; renderList(); return; }
  if(d.statMonth){ const [y,m]=d.statMonth.split('-').map(Number); statAnchor=new Date(y,m,1); draw(); return; }
  if(d.catDetail) return catDetailWin(d.catDetail);
  if(d.budget) return budgetWin(d.budget);
  if(b.hasAttribute('data-budget-new')) return budgetWin();
  if(b.hasAttribute('data-add-income')) return incomeWin();
  if(d.income) return incomeWin(d.income);
  if(b.hasAttribute('data-add-contract')) return contractWin();
  if(d.contract) return contractWin(d.contract);
  if(b.hasAttribute('data-add-task')) return taskWin();
  if(d.task) return taskWin(d.task);
  if(d.check){ const x=data.tasks.find(t=>t.id===d.check); if(x) setDone(x,!x.done); return; }
  if(b.hasAttribute('data-add-goal')) return goalWin();
  if(d.goal) return goalWin(d.goal);
  if(d.deposit) return depositWin(d.deposit);
});
// Neuer Tag / App wieder geöffnet: Anzeige und Nachrichten aktualisieren
let lastDay=toISO(today());
document.addEventListener('visibilitychange',()=>{ if(document.hidden) return; if(toISO(today())!==lastDay){lastDay=toISO(today());if(!stack.length)draw();} showDueNotifications(); if(ACCOUNTS&&session) pull(); });
window.addEventListener('online',()=>{ updateSyncInfo(); if(ACCOUNTS&&session){ if(isDirty()) push(); else pull(); } });
window.addEventListener('offline',updateSyncInfo);
window.addEventListener('hashchange',()=>{ if(ACCOUNTS&&/(^#|&)(access_token|error_code)=/.test(location.hash)) bootAccount(); });
setInterval(()=>{ if(toISO(today())!==lastDay){lastDay=toISO(today());if(!stack.length)draw();} showDueNotifications(); },15*60*1000);

/* =====================================================================
   Start
   ===================================================================== */
paintIcons();
fillSince();
applyTheme();
draw();
saveLocal();   // speichert übernommene Daten aus älteren Versionen
bootAccount();
if(data.tasks.length||data.contracts.some(inTrial)) syncNotifications(false);
showDueNotifications();
// Online-Version (iPhone): auch ohne Internet starten können
if((location.protocol==='https:'||location.hostname==='localhost')&&!window.Capacitor&&'serviceWorker' in navigator){
  try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
}
</script>
</body>
</html>
